<text x="145" y="695" text-anchor="start" font-size="20" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#17365e">曲线为定性假设模型，无实测数据；不能直接用最低点推断最佳保鲜氧浓度。</text>
<rect x="24" y="712" width="1152" height="66" rx="14" fill="#f2f6fa" stroke="#dce7f2" stroke-width="2"/>
<text x="44" y="743" text-anchor="start" font-size="19" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#5d6c7d">不同底物、组织损伤及呼吸商会改变结论；三曲线必须在相同单位和条件下比较。</text>
