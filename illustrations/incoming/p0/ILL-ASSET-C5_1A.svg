<circle cx="213" cy="422" r="8" fill="#276cbd" stroke="#276cbd" stroke-width="3"/>
<rect x="420" y="155" width="365" height="490" rx="14" fill="#f3f7fe" stroke="#abc5e8" stroke-width="2"/>
<text x="603" y="205" text-anchor="middle" font-size="28" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="700" fill="#17365e">卢瑟福模型</text>
<text x="603" y="548" text-anchor="middle" font-size="21" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#276cbd">正电荷集中在原子核</text>
<text x="603" y="590" text-anchor="middle" font-size="20" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#ca4255">经典模型无法解释稳定谱线</text>
<circle cx="603" cy="355" r="12" fill="#ca4255" stroke="#ca4255" stroke-width="3"/>
<circle cx="603" cy="355" r="112" fill="none" stroke="#9eb3cc" stroke-width="3"/>
<circle cx="715" cy="355" r="7" fill="#276cbd" stroke="#276cbd" stroke-width="3"/>
<rect x="810" y="155" width="365" height="490" rx="14" fill="#f3f7fe" stroke="#abc5e8" stroke-width="2"/>
<text x="993" y="205" text-anchor="middle" font-size="28" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="700" fill="#17365e">玻尔氢原子模型</text>
<text x="993" y="548" text-anchor="middle" font-size="21" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#276cbd">一个电子处于允许能级</text>
<text x="993" y="590" text-anchor="middle" font-size="20" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#ca4255">不是电子真实圆轨道照片</text>
