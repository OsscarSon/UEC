<circle cx="1073" cy="355" r="8" fill="#276cbd" stroke="#276cbd" stroke-width="3"/>
<text x="993" y="495" text-anchor="middle" font-size="22" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="600" fill="#15835e">仅 1 个电子</text>
<rect x="24" y="712" width="1152" height="66" rx="14" fill="#f2f6fa" stroke="#dce7f2" stroke-width="2"/>
<text x="44" y="743" text-anchor="start" font-size="19" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#5d6c7d">以上为历史模型的教学示意；不同轨道代表可选能级，不代表氢原子同时有多个电子。</text>
