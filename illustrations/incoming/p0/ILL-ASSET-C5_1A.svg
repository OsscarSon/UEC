<text x="213" y="548" text-anchor="middle" font-size="21" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#276cbd">正电荷弥散分布</text>
<text x="213" y="590" text-anchor="middle" font-size="20" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#ca4255">无法解释大角度散射</text>
