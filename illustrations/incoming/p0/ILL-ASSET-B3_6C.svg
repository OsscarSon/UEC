<text x="600" y="691" text-anchor="middle" font-size="25" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="700" fill="#15835e">所需总计：9 ATP、6 NADPH</text>
<rect x="24" y="712" width="1152" height="66" rx="14" fill="#f2f6fa" stroke="#dce7f2" stroke-width="2"/>
<text x="44" y="743" text-anchor="start" font-size="19" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#5d6c7d">碳账 3 + 15 = 18；两份净 G3P 相当于合成一个六碳糖的碳骨架。</text>
