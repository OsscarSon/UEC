<text x="600.0" y="285" text-anchor="middle" font-size="22" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#15835e">15 C</text>
<rect x="825" y="195" width="310" height="115" rx="14" fill="#f3f7fe" stroke="#abc5e8" stroke-width="2"/>
<text x="980.0" y="243" text-anchor="middle" font-size="28" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="700" fill="#17365e">6 × 3-PGA</text>
<text x="980.0" y="285" text-anchor="middle" font-size="22" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#15835e">18 C</text>
