<text x="207.5" y="453" text-anchor="middle" font-size="28" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="700" fill="#17365e">1 G3P 净输出</text>
<text x="207.5" y="495" text-anchor="middle" font-size="22" font-family="Noto Sans CJK SC,Arial,sans-serif" font-weight="400" fill="#15835e">3 C</text>
