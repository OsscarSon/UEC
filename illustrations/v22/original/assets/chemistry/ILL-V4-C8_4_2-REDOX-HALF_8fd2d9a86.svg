<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="740px" version="1.1" viewBox="0 0 1200 740" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f8fbff" height="740" width="1200" x="0" y="0" /><rect fill="#102d55" height="105" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="41" font-weight="bold" text-anchor="start" x="46" y="65">氧化还原：酸性条件下的半反应配平</text><text fill="#cfdef4" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="47" y="94">化学 8.4.2 · Fe(2+) 与 MnO4(-) 的电子守恒实例</text><rect fill="white" height="582" rx="16" stroke="#cfdef0" stroke-width="2" width="1146" x="27" y="124" /><rect fill="#fff8f2" height="75" rx="16" stroke="#bd5c18" stroke-width="2" width="1060" x="70" y="163" /><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="600.0" y="208.5">氧化半反应：Fe(2+) → Fe(3+) + e(-)</text><rect fill="#edf6ff" height="97" rx="16" stroke="#1c68c8" stroke-width="2" width="1060" x="70" y="258" /><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="600.0" y="314.5">还原半反应：MnO4(-) + 8H(+) + 5e(-) → Mn(2+) + 4H2O</text><line stroke="#157c64" stroke-width="4" x1="596" x2="596" y1="367" y2="401" /><polygon fill="#157c64" points="596,401 589.4758327510468,386.39057695500304 602.5241672489532,386.39057695500304" /><rect fill="#edf9f3" height="75" rx="16" stroke="#157c64" stroke-width="2" width="430" x="115" y="412" /><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="330.0" y="457.5">氧化式乘以 5</text><rect fill="#edf9f3" height="75" rx="16" stroke="#157c64" stroke-width="2" width="430" x="654" y="412" /><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="869.0" y="457.5">两式相加，消去 5e(-)</text><rect fill="#f7f2ff" height="90" rx="16" stroke="#744aa7" stroke-width="2" width="1060" x="70" y="511" /><text fill="#744aa7" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="600.0" y="564.0">MnO4(-) + 8H(+) + 5Fe(2+) → Mn(2+) + 4H2O + 5Fe(3+)</text><rect fill="#eef5ff" height="54" rx="12" width="1104" x="48" y="637" /><text fill="#102d55" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="68" y="671">原子守恒：Mn 1、Fe 5、O 4、H 8；两侧总电荷均为 +17。仅适用酸性介质。</text></svg>