<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc"/><rect x="0" y="0" width="1200" height="104" fill="#163e78"/><text x="40" y="61" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="36" fill="#fff" font-weight="700" text-anchor="start">水分子间氢键：供体与受体</text><text x="40" y="90" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#deedff" font-weight="400" text-anchor="start">概念图；键角与距离非按比例绘制</text><rect x="35" y="140" width="1130" height="410" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/><text x="60" y="185" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">两个水分子之间的 O—H···O 氢键</text><circle cx="320" cy="310" r="38" fill="#fdd9d9" stroke="#bb4e56" stroke-width="3"/><text x="320" y="319" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#143156" font-weight="700" text-anchor="middle">O</text><circle cx="250" cy="385" r="38" fill="#e6effb" stroke="#7a9ac8" stroke-width="3"/><text x="250" y="394" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#143156" font-weight="700" text-anchor="middle">H</text><circle cx="395" cy="388" r="38" fill="#e6effb" stroke="#7a9ac8" stroke-width="3"/><text x="395" y="397" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#143156" font-weight="700" text-anchor="middle">H</text><circle cx="775" cy="310" r="38" fill="#fdd9d9" stroke="#bb4e56" stroke-width="3"/><text x="775" y="319" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#143156" font-weight="700" text-anchor="middle">O</text><circle cx="850" cy="385" r="38" fill="#e6effb" stroke="#7a9ac8" stroke-width="3"/><text x="850" y="394" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#143156" font-weight="700" text-anchor="middle">H</text><circle cx="700" cy="385" r="38" fill="#e6effb" stroke="#7a9ac8" stroke-width="3"/><text x="700" y="394" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="32" fill="#143156" font-weight="700" text-anchor="middle">H</text><line x1="296" y1="337" x2="267" y2="358" stroke="#405e81" stroke-width="6" stroke-linecap="round" /><line x1="345" y1="337" x2="370" y2="360" stroke="#405e81" stroke-width="6" stroke-linecap="round" /><line x1="747" y1="337" x2="720" y2="360" stroke="#405e81" stroke-width="6" stroke-linecap="round" /><line x1="804" y1="338" x2="826" y2="360" stroke="#405e81" stroke-width="6" stroke-linecap="round" /><line x1="421" y1="372" x2="743" y2="326" stroke="#9168bd" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 12"/><text x="571" y="342" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#7c3da1" font-weight="700" text-anchor="middle">氢键（虚线）</text><text x="155" y="500" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#1c4b8f" font-weight="700" text-anchor="start">供体：O—H</text><text x="727" y="500" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#1c4b8f" font-weight="700" text-anchor="start">受体：另一分子的 O</text><rect x="55" y="571" width="1088" height="54" rx="12" fill="#fff5e6" stroke="#f1d59d" stroke-width="2"/><text x="80" y="606" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#143156" font-weight="400" text-anchor="start">共价键以实线表示；氢键以虚线表示。沸腾不意味着断裂分子内 O—H 共价键。</text><text x="30" y="656" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#55718e" font-weight="400" text-anchor="start">UEC 2027 · 教学概念示意 · 使用前须学科审核</text></svg>