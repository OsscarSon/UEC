<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="740px" version="1.1" viewBox="0 0 1200 740" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f8fbff" height="740" width="1200" x="0" y="0" /><rect fill="#102d55" height="105" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="41" font-weight="bold" text-anchor="start" x="46" y="65">Al(OH)3 的两性：与酸、过量碱反应</text><text fill="#cfdef4" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="47" y="94">化学 11.2 · 两侧途径独立，不暗示先后发生</text><rect fill="white" height="582" rx="16" stroke="#cfdef0" stroke-width="2" width="1146" x="27" y="124" /><rect fill="#f8f2ff" height="103" rx="16" stroke="#744aa7" stroke-width="2" width="388" x="406" y="184" /><text fill="#744aa7" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="600.0" y="243.5">Al(OH)3（白色沉淀）</text><line stroke="#1c68c8" stroke-width="4" x1="458" x2="244" y1="304" y2="385" /><polygon fill="#1c68c8" points="244,385 255.35389603915033,373.7266223015386 259.9729466765919,385.93004003502625" /><line stroke="#157c64" stroke-width="4" x1="740" x2="958" y1="304" y2="385" /><polygon fill="#157c64" points="958,385 942.0330120603944,386.02727607608097 946.5776750472924,373.79596087677515" /><rect fill="#edf6ff" height="109" rx="16" stroke="#1c68c8" stroke-width="2" width="475" x="71" y="404" /><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="308.5" y="451.0">加入足量酸：沉淀溶解</text><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="308.5" y="482.0">Al(OH)3 + 3H(+) → Al(3+) + 3H2O</text><rect fill="#f1fbf6" height="109" rx="16" stroke="#157c64" stroke-width="2" width="476" x="654" y="404" /><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="892.0" y="451.0">加入过量强碱：沉淀溶解</text><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="892.0" y="482.0">Al(OH)3 + OH(-) → [Al(OH)4](-)</text><rect fill="#fff9ef" height="68" rx="16" stroke="#bd5c18" stroke-width="2" width="847" x="177" y="547" /><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="600.5" y="589.0">两性：既能与酸反应，也能与强碱反应</text><rect fill="#eef5ff" height="54" rx="12" width="1104" x="48" y="637" /><text fill="#102d55" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="68" y="671">水溶液中优先写 [Al(OH)4](-)；部分教材用 AlO2(-) 简化式，须说明条件与写法。</text></svg>