<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc"/><rect x="0" y="0" width="1200" height="104" fill="#163e78"/><text x="40" y="61" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="36" fill="#fff" font-weight="700" text-anchor="start">铝电解冶炼：阳极、阴极与总反应</text><text x="40" y="90" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#deedff" font-weight="400" text-anchor="start">霍尔—埃鲁法 · 仅展示原理</text><rect x="34" y="139" width="550" height="435" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/><text x="59" y="184" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">电解槽中主要过程（简化）</text><rect x="610" y="139" width="551" height="435" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/><text x="635" y="184" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">电极与总反应（课堂简化模型）</text><rect x="170" y="288" width="268" height="145" rx="10" fill="#dff2ff" stroke="#5592b9" stroke-width="2"/><text x="306" y="325" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#1c4b8f" font-weight="700" text-anchor="middle">熔融电解质</text><text x="306" y="369" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#1c4b8f" font-weight="400" text-anchor="middle">溶解 Al2O3</text><rect x="246" y="429" width="123" height="43" rx="8" fill="#ffdc99" stroke="#b78335" stroke-width="2"/><text x="307" y="458" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#143156" font-weight="700" text-anchor="middle">液态 Al</text><rect x="232" y="195" width="45" height="102" rx="6" fill="#414b5e" stroke="#303b4c" stroke-width="2"/><rect x="332" y="195" width="45" height="102" rx="6" fill="#414b5e" stroke="#303b4c" stroke-width="2"/><text x="308" y="184" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#c04b4b" font-weight="700" text-anchor="middle">碳阳极 (+)</text><text x="307" y="509" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#1c4b8f" font-weight="700" text-anchor="middle">阴极区收集铝</text><text x="638" y="235" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#177b5b" font-weight="700" text-anchor="start">阴极：Al3+ + 3e- → Al</text><text x="638" y="320" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#c04b4b" font-weight="700" text-anchor="start">碳阳极被消耗，生成 CO2</text><text x="638" y="412" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#1c4b8f" font-weight="700" text-anchor="start">理想化总式：</text><text x="637" y="458" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#143156" font-weight="700" text-anchor="start">2Al2O3 + 3C → 4Al + 3CO2</text><rect x="30" y="582" width="1138" height="49" rx="12" fill="#fff4e3" stroke="#efd0a0" stroke-width="2"/><text x="50" y="615" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#143156" font-weight="400" text-anchor="start">实际电解液、阳极反应更复杂；图示不是完整工业槽比例或精确微观机理。</text><text x="30" y="656" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#55718e" font-weight="400" text-anchor="start">UEC 2027 · 教学概念示意 · 使用前须学科审核</text></svg>