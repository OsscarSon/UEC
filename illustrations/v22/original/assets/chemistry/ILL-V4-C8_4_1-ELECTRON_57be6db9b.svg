<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="740px" version="1.1" viewBox="0 0 1200 740" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f8fbff" height="740" width="1200" x="0" y="0" /><rect fill="#102d55" height="105" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="41" font-weight="bold" text-anchor="start" x="46" y="65">氧化数法：先找升降价，再配电子</text><text fill="#cfdef4" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="47" y="94">化学 8.4.1 · 用 Zn + Cu(2+) → Zn(2+) + Cu 演示</text><rect fill="white" height="582" rx="16" stroke="#cfdef0" stroke-width="2" width="1146" x="27" y="124" /><rect fill="#fff5ed" height="93" rx="16" stroke="#bd5c18" stroke-width="2" width="466" x="85" y="172" /><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="35" font-weight="bold" text-anchor="middle" x="318.0" y="226.5">Zn(0) → Zn(2+) + 2e(-)</text><rect fill="#edf6ff" height="93" rx="16" stroke="#1c68c8" stroke-width="2" width="466" x="653" y="172" /><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="35" font-weight="bold" text-anchor="middle" x="886.0" y="226.5">Cu(2+) + 2e(-) → Cu(0)</text><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="315" y="321">氧化：失去 2e(-)</text><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" x="895" y="321">还原：得到 2e(-)</text><line stroke="#157c64" stroke-width="5" x1="360" x2="825" y1="370" y2="370" /><polygon fill="#157c64" points="825,370 810.3905769550031,376.5241672489531 810.3905769550031,363.4758327510469" /><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="590" y="354">电子数相等</text><rect fill="#f7f1ff" height="105" rx="16" stroke="#744aa7" stroke-width="2" width="918" x="142" y="430" /><text fill="#744aa7" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="41" font-weight="bold" text-anchor="middle" x="601.0" y="490.5">Zn + Cu(2+) → Zn(2+) + Cu</text><rect fill="#eef5ff" height="54" rx="12" width="1104" x="48" y="637" /><text fill="#102d55" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="68" y="671">Zn 是还原剂（自身被氧化）；Cu(2+) 是氧化剂（自身被还原）。</text></svg>