<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620" version="1.1" viewBox="0 0 1000 620" width="1000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="620" width="1000" x="0" y="0" /><rect fill="#173a68" height="76" rx="20" width="956" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="500" y="67">碳酸钙热分解：质量与物质的量</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="500" y="119">化学 10.3｜理想完全分解；使用 Ca=40、C=12、O=16</text><rect fill="#f7fbff" height="345" rx="16" stroke="#bfd4e7" stroke-width="2" width="928" x="36" y="145" /><rect fill="#e8f4ff" height="76" rx="16" stroke="#bfd4e7" stroke-width="2" width="870" x="65" y="183" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="29" font-weight="normal" text-anchor="middle" x="500" y="232">CaCO3(s) → CaO(s) + CO2(g)</text><rect fill="#f8fbff" height="155" rx="16" stroke="#bfd4e7" stroke-width="2" width="270" x="77" y="292" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="212" y="353">100 g CaCO3</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="212" y="406">1 mol</text><rect fill="#eef9f6" height="155" rx="16" stroke="#bfd4e7" stroke-width="2" width="270" x="387" y="292" /><text fill="#15967a" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="522" y="353">56 g CaO</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="522" y="406">1 mol</text><rect fill="#fff8ed" height="155" rx="16" stroke="#bfd4e7" stroke-width="2" width="270" x="697" y="292" /><text fill="#e7a536" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="832" y="353">44 g CO2</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="832" y="406">1 mol</text><rect fill="#f2f9ff" height="86" rx="16" stroke="#bfd4e7" stroke-width="2" width="928" x="36" y="510" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="60" y="547">例如：50 g 纯 CaCO3 完全分解 → 28 g CaO + 22 g CO2</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="60" y="580">质量守恒：50 = 28 + 22（g）。实际产率需另考虑纯度与反应程度。</text></svg>