<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="740px" version="1.1" viewBox="0 0 1200 740" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f8fbff" height="740" width="1200" x="0" y="0" /><rect fill="#102d55" height="105" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="41" font-weight="bold" text-anchor="start" x="46" y="65">焰色试验：Na 与 K 的辨认</text><text fill="#cfdef4" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="47" y="94">化学 9.2 · 发射光谱的课堂概念示意</text><rect fill="white" height="582" rx="16" stroke="#cfdef0" stroke-width="2" width="1146" x="27" y="124" /><rect fill="#fff8e9" height="82" rx="16" stroke="#bd5c18" stroke-width="2" width="453" x="96" y="167" /><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="322.5" y="216.0">钠 Na(+)：明显黄色</text><rect fill="#f8f2ff" height="82" rx="16" stroke="#744aa7" stroke-width="2" width="453" x="650" y="167" /><text fill="#744aa7" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="876.5" y="216.0">钾 K(+)：浅紫色（淡紫）</text><path d="M 229 531 Q 226 433 294 366 Q 309 326 324 293 Q 344 361 389 386 Q 446 476 408 531 Z" fill="#ffce40" stroke="#dde5ee" stroke-width="3" /><path d="M 286 526 Q 281 448 335 394 Q 366 466 355 526 Z" fill="#fff9e3" opacity="0.65" /><rect fill="#3a4d66" height="24" rx="5" width="140" x="251" y="529" /><path d="M 783 531 Q 780 433 848 366 Q 863 326 878 293 Q 898 361 943 386 Q 1000 476 962 531 Z" fill="#ba94e8" stroke="#dde5ee" stroke-width="3" /><path d="M 840 526 Q 835 448 889 394 Q 920 466 909 526 Z" fill="#fff9e3" opacity="0.65" /><rect fill="#3a4d66" height="24" rx="5" width="140" x="805" y="529" /><rect fill="#f0faf5" height="48" rx="16" stroke="#157c64" stroke-width="2" width="1032" x="83" y="577" /><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="599.0" y="609.0">样品需洁净；钠的强黄光可能掩盖钾的淡紫光，必要时使用钴玻璃辅助。</text><rect fill="#eef5ff" height="54" rx="12" width="1104" x="48" y="637" /><text fill="#102d55" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="68" y="671">颜色为教学概念色，不是标准光谱数值或真实火焰照片。</text></svg>