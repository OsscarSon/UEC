<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="head" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L9 5 L0 10Z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="89" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="700" text-anchor="start" x="45" y="57">平抛运动：水平和竖直运动独立</text><text fill="#52677c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="45" y="123">示例：水平初速 10 m/s，高度 20 m，g = 10 m/s²；忽略空气阻力</text><rect fill="#f7faff" height="480" rx="14" stroke="#d6e2ee" stroke-width="2" width="740" x="40" y="160" /><rect fill="#f5faf7" height="480" rx="14" stroke="#d6e2ee" stroke-width="2" width="345" x="805" y="160" /><line stroke="#8397aa" stroke-dasharray="6 6" stroke-linecap="round" stroke-width="2" x1="120" x2="690" y1="270" y2="270" /><line stroke="#8397aa" stroke-dasharray="6 6" stroke-linecap="round" stroke-width="2" x1="120" x2="120" y1="270" y2="590" /><polyline fill="none" points="120.0,270.0 132.0,270.175 144.0,270.7 156.0,271.575 168.0,272.8 180.0,274.375 192.0,276.3 204.0,278.575 216.0,281.2 228.0,284.175 240.0,287.5 252.0,291.175 264.0,295.2 276.0,299.575 288.0,304.3 300.0,309.375 312.0,314.8 324.0,320.575 336.0,326.7 348.0,333.175 360.0,340.0 372.0,347.175 384.0,354.70000000000005 396.0,362.575 408.0,370.79999999999995 420.0,379.375 432.0,388.3 444.0,397.57500000000005 456.0,407.2 468.0,417.17499999999995 480.0,427.5 492.0,438.175 504.0,449.20000000000005 516.0,460.575 528.0,472.29999999999995 540.0,484.375 552.0,496.79999999999995 564.0,509.57500000000005 576.0,522.7 588.0,536.175 600.0,550.0 612.0,564.175 624.0,578.7 636.0,593.575 648.0,608.8000000000001 660.0,624.375 672.0,640.3 684.0,656.575 696.0,673.1999999999999 708.0,690.1750000000001 720.0,707.5 732.0,725.175 744.0,743.2 756.0,761.5749999999999 768.0,780.3000000000001 780.0,799.375 792.0,818.8 804.0,838.575 816.0,858.6999999999999 828.0,879.1750000000001 840.0,900.0 852.0,921.175 864.0,942.7 876.0,964.5749999999999 888.0,986.8000000000001 900.0,1009.375 912.0,1032.3 924.0,1055.575 936.0,1079.1999999999998 948.0,1103.1750000000002 960.0,1127.5 972.0,1152.175 984.0,1177.1999999999998 996.0,1202.5749999999998 1008.0,1228.3000000000002 1020.0,1254.375 1032.0,1280.8000000000002 1044.0,1307.575 1056.0,1334.7 1068.0,1362.175 1080.0,1390.0" stroke="#2563eb" stroke-linejoin="round" stroke-width="5" /><circle cx="120" cy="270" fill="#cf4556" r="9" stroke="none" stroke-width="2" /><circle cx="120" cy="270" fill="#cf4556" r="6" stroke="none" stroke-width="2" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="133" y="259">t=0 s</text><circle cx="360" cy="340" fill="#cf4556" r="6" stroke="none" stroke-width="2" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="373" y="329">t=1 s</text><circle cx="600" cy="550" fill="#cf4556" r="6" stroke="none" stroke-width="2" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="613" y="539">t=2 s</text><line marker-end="url(#head)" stroke="#2563eb" stroke-linecap="round" stroke-width="4" x1="120" x2="272" y1="270" y2="270" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="140" y="246">vₓ = 10 m/s</text><line stroke="#a47d40" stroke-dasharray="7 6" stroke-linecap="round" stroke-width="2" x1="600" x2="600" y1="270" y2="550" /><text fill="#b97813" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="615" y="425">h = 20 m</text><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="85" x2="720" y1="550" y2="550" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="825" y="226">求运动时间与水平距离</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="825" y="272">竖直：h = ½gt²</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="825" y="307">20 = 5t²</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="825" y="342">t = 2 s</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="825" y="377" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="825" y="412">水平：x = vₓt</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="825" y="447">x = 10 × 2</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="825" y="482">x = 20 m</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="825" y="517" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="825" y="552">落地前竖直速度：</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="825" y="587">vᵧ = gt = 20 m/s</text></svg>