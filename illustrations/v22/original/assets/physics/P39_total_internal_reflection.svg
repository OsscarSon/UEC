<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620" version="1.1" viewBox="0 0 1000 620" width="1000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="620" width="1000" x="0" y="0" /><rect fill="#173a68" height="76" rx="20" width="956" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="500" y="67">全反射：临界角与反射光线</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="500" y="119">物理｜光由玻璃进入空气，超过临界角后不再有传播折射光</text><rect fill="#f7fbff" height="350" rx="16" stroke="#bfd4e7" stroke-width="2" width="928" x="36" y="145" /><line stroke="#173a68" stroke-width="3" x1="60" x2="940" y1="305" y2="305" /><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="normal" text-anchor="start" x="90" y="205">空气 n2 = 1.00</text><text fill="#2673ba" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="normal" text-anchor="start" x="90" y="435">玻璃 n1 = 1.50</text><line stroke="#607389" stroke-dasharray="7 6" stroke-width="2" x1="510" x2="510" y1="175" y2="470" /><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="522" y="177">法线</text><line stroke="#d95a56" stroke-width="5" x1="366.6483922494264" x2="510" y1="405.3758763614331" y2="305" /><line stroke="#d95a56" stroke-width="5" x1="510" x2="504.7188444545292" y1="305" y2="316.8789476008838" /><line stroke="#d95a56" stroke-width="5" x1="510" x2="497.0311790201599" y1="305" y2="305.89982353428917" /><line stroke="#15967a" stroke-width="5" x1="510" x2="653.3516077505735" y1="305" y2="405.3758763614331" /><line stroke="#15967a" stroke-width="5" x1="653.3516077505735" x2="640.3827867707334" y1="405.3758763614331" y2="404.4760528271439" /><line stroke="#15967a" stroke-width="5" x1="653.3516077505735" x2="648.0704522051027" y1="405.3758763614331" y2="393.4969287605493" /><path d="M 510,360 A 55,55 0 0,0 465,337" fill="none" stroke="#d95a56" stroke-width="2" /><text fill="#d95a56" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="404" y="378">θi = 55°</text><text fill="#15967a" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="652" y="403">反射角 = 55°</text><rect fill="#f2f9ff" height="88" rx="16" stroke="#bfd4e7" stroke-width="2" width="928" x="36" y="511" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="60" y="547">临界角 θc = arcsin(n2/n1) = arcsin(1/1.5) ≈ 41.8°</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="60" y="580">55° &gt; 41.8°，满足全反射条件。示意图未画出消逝场。</text></svg>