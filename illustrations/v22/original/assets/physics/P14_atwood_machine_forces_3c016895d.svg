<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr_P14_atwood_machine_forces" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="90" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="38" font-weight="700" text-anchor="start" x="55" y="56">理想阿特伍德机：受力与加速度</text><text fill="#51667c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="56" y="120">假设轻绳不可伸长、滑轮无摩擦且质量可忽略；m1=2 kg，m2=3 kg，g=10 m/s^2</text><rect fill="#f7faff" height="485" rx="18" stroke="#d6e3f1" stroke-width="2" width="650" x="45" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="67" y="195">两侧物体的受力分析</text><circle cx="370" cy="278" fill="#e5edf7" r="60" stroke="#142c4c" stroke-width="4" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="4" x1="260" x2="260" y1="280" y2="455" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="4" x1="480" x2="480" y1="280" y2="455" /><path d="M 260 280 C 260 195 480 195 480 280" fill="none" stroke="#142c4c" stroke-width="4" /><rect fill="#dbeafe" height="78" rx="10" stroke="#2563eb" stroke-width="3" width="78" x="221" y="449" /><rect fill="#ffeddd" height="78" rx="10" stroke="#c7830a" stroke-width="3" width="78" x="441" y="449" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" text-anchor="middle" x="260" y="495">2 kg</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" text-anchor="middle" x="480" y="495">3 kg</text><line marker-end="url(#arr_P14_atwood_machine_forces)" stroke="#0f977c" stroke-linecap="round" stroke-width="5" x1="260" x2="260" y1="449" y2="359" /><line marker-end="url(#arr_P14_atwood_machine_forces)" stroke="#0f977c" stroke-linecap="round" stroke-width="5" x1="480" x2="480" y1="449" y2="359" /><line marker-end="url(#arr_P14_atwood_machine_forces)" stroke="#d34f55" stroke-linecap="round" stroke-width="5" x1="260" x2="260" y1="531" y2="605" /><line marker-end="url(#arr_P14_atwood_machine_forces)" stroke="#d34f55" stroke-linecap="round" stroke-width="5" x1="480" x2="480" y1="531" y2="605" /><text fill="#0f977c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="283" y="365">T</text><text fill="#0f977c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="503" y="365">T</text><text fill="#d34f55" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="283" y="605">m1g</text><text fill="#d34f55" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="503" y="605">m2g</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="128" y="400">a ↑</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="550" y="400">a ↓</text><rect fill="#f5fbf8" height="485" rx="18" stroke="#d6e3f1" stroke-width="2" width="425" x="730" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="752" y="195">沿运动方向列式</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="757" y="237">m2g − T = m2a</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="757" y="276">T − m1g = m1a</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="757" y="315" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="757" y="354">联立相加：</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="757" y="393">(m2−m1)g = (m1+m2)a</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="757" y="432" /><text fill="#0f977c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="757" y="471">a = (3−2)×10/(2+3)</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="757" y="510">= 2 m/s^2</text><text fill="#0f977c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="757" y="549" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="757" y="588">代入得 T = 24 N</text></svg>