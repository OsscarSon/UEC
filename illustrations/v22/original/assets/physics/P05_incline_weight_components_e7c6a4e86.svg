<svg baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f6f9fe" height="700" rx="0" stroke="#f6f9fe" stroke-width="1.5" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#d8e4f0" stroke-width="1.5" width="1064" x="18" y="18" /><rect fill="#193452" height="97" rx="20" stroke="#193452" stroke-width="1.5" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="29" font-weight="700" x="47" y="77">斜面受力：重力分解与法向支持力</text><text fill="#d9edff" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="904" y="74">物理</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="46" y="149">无摩擦斜面上的重力分解；没有额外约束时物块沿斜面加速</text><rect fill="#eff6ff" height="407" rx="15" stroke="#c9d8ea" stroke-width="1.5" width="655" x="55" y="180" /><polyline fill="none" points="125,510 585,244 585,510 125,510" stroke="#7a95b1" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#d9eafb" height="61" rx="7" stroke="#2064c8" stroke-width="3" transform="rotate(-30 362 369)" width="86" x="319" y="339" /><line stroke="#7155bb" stroke-width="5" x1="362" x2="362" y1="368" y2="528" /><polygon fill="#7155bb" points="362,528 356.78041359066526,517.1946347717678 367.21958640933474,517.1946347717678" /><text fill="#7155bb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700" x="385" y="530">mg（竖直向下）</text><line stroke="#177b59" stroke-width="5" x1="362" x2="447" y1="368" y2="220" /><polygon fill="#177b59" points="447,220 446.14480943323224,231.96948825533119 437.09238277405507,226.77045943080378" /><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="22" font-weight="700" x="457" y="228">N</text><line stroke="#ca4b52" stroke-width="5" x1="362" x2="243" y1="368" y2="436" /><polygon fill="#ca4b52" points="243,436 249.79204419777352,426.1071674624761 254.97132431735173,435.170907671738" /><text fill="#ca4b52" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700" x="181" y="443">mg sinθ</text><line stroke="#bd7d13" stroke-width="5" x1="362" x2="277" y1="368" y2="516" /><polygon fill="#bd7d13" points="277,516 277.85519056676776,504.0305117446688 286.90761722594493,509.2295405691962" /><text fill="#bd7d13" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="700" x="142" y="534">mg cosθ</text><rect fill="#f1f8f6" height="407" rx="15" stroke="#cce5db" stroke-width="1.5" width="310" x="738" y="180" /><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="700" x="762" y="239">分解关系</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="400" x="755" y="307">沿斜面：mg sinθ</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="400" x="755" y="354">垂直斜面：mg cosθ</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="755" y="422">若垂直方向无加速度：</text><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="700" x="766" y="464">N = mg cosθ</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="755" y="529">θ：斜面与水平夹角</text><rect fill="#edf6ff" height="47" rx="9" stroke="#dce8f4" stroke-width="1.5" width="1010" x="45" y="617" /><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">注意：无摩擦且无其他约束时，物体会沿斜面加速下滑；图只显示所列力。</text></svg>