<svg baseProfile="full" height="620" version="1.1" viewBox="0 0 1000 620" width="1000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="620" width="1000" x="0" y="0" /><rect fill="#173a68" height="76" rx="20" width="956" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="500" y="67">电功率：并联支路的比较</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="500" y="119">物理｜理想恒压电源 12 V；两个电阻并联，各支路电压相同</text><rect fill="#f7fbff" height="350" rx="16" stroke="#bfd4e7" stroke-width="2" width="928" x="36" y="145" /><line stroke="#173a68" stroke-width="3" x1="170" x2="250" y1="260" y2="260" /><line stroke="#173a68" stroke-width="3" x1="250" x2="250" y1="260" y2="390" /><line stroke="#173a68" stroke-width="3" x1="250" x2="390" y1="260" y2="260" /><line stroke="#173a68" stroke-width="3" x1="250" x2="390" y1="390" y2="390" /><line stroke="#173a68" stroke-width="3" x1="170" x2="170" y1="260" y2="292" /><line stroke="#173a68" stroke-width="3" x1="148" x2="192" y1="292" y2="292" /><line stroke="#173a68" stroke-width="3" x1="157" x2="183" y1="310" y2="310" /><line stroke="#173a68" stroke-width="3" x1="170" x2="170" y1="310" y2="390" /><line stroke="#173a68" stroke-width="3" x1="170" x2="250" y1="390" y2="390" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="normal" text-anchor="start" x="110" y="342">12 V</text><line stroke="#173a68" stroke-width="3" x1="390" x2="480" y1="260" y2="260" /><rect fill="#eef6fe" height="34" stroke="#173a68" stroke-width="2" width="115" x="480" y="243" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="537" y="267">6 Ω</text><line stroke="#173a68" stroke-width="3" x1="595" x2="790" y1="260" y2="260" /><line stroke="#173a68" stroke-width="3" x1="390" x2="480" y1="390" y2="390" /><rect fill="#eef6fe" height="34" stroke="#173a68" stroke-width="2" width="115" x="480" y="373" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" x="537" y="397">12 Ω</text><line stroke="#173a68" stroke-width="3" x1="595" x2="790" y1="390" y2="390" /><line stroke="#173a68" stroke-width="3" x1="790" x2="790" y1="260" y2="390" /><line stroke="#173a68" stroke-width="3" x1="250" x2="390" y1="260" y2="260" /><line stroke="#173a68" stroke-width="3" x1="250" x2="390" y1="390" y2="390" /><rect fill="#f7fbff" height="280" width="850" x="70" y="175" /><rect fill="#e9f4ff" height="245" rx="16" stroke="#bfd4e7" stroke-width="2" width="375" x="95" y="193" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="113" y="225">支路 1</text><rect fill="#eaf9f4" height="245" rx="16" stroke="#bfd4e7" stroke-width="2" width="375" x="530" y="193" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="548" y="225">支路 2</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="normal" text-anchor="start" x="120" y="260">U1 = 12 V</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="normal" text-anchor="start" x="120" y="310">R1 = 6 Ω</text><text fill="#2673ba" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="normal" text-anchor="start" x="120" y="357">I1 = U/R = 2 A</text><text fill="#d95a56" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="normal" text-anchor="start" x="120" y="408">P1 = U2/R = 24 W</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="normal" text-anchor="start" x="555" y="260">U2 = 12 V</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="normal" text-anchor="start" x="555" y="310">R2 = 12 Ω</text><text fill="#2673ba" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="normal" text-anchor="start" x="555" y="357">I2 = U/R = 1 A</text><text fill="#d95a56" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="normal" text-anchor="start" x="555" y="408">P2 = U2/R = 12 W</text><rect fill="#f2f9ff" height="82" rx="16" stroke="#bfd4e7" stroke-width="2" width="928" x="36" y="515" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="60" y="547">并联特点：U1 = U2 = U电源</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="60" y="577">总电流 3 A；总功率 36 W。图为计算卡片，不是电路接线图。</text></svg>