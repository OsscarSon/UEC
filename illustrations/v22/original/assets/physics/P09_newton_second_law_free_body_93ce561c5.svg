<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1200 760" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="760" width="1200" x="0" y="0" /><rect fill="#14294a" height="83" rx="23" width="1136" x="32" y="28" /><text fill="#ffffff" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start" x="65" y="84">牛顿第二定律：水平小车受力分析</text><text fill="#66758a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="47" y="143">小车质量 2 kg，水平拉力 10 N，动摩擦力 2 N；取 g = 10 N/kg</text><rect fill="#f4f8ff" height="420" rx="20" stroke="#cbdcf0" stroke-width="2" width="1080" x="60" y="170" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="84" y="212">受力图：只画作用在小车上的力</text><line stroke="#aab8c8" stroke-linecap="round" stroke-width="7" x1="140" x2="700" y1="500" y2="500" /><rect fill="#cddbf1" height="110" rx="14" stroke="#14294a" stroke-width="3" width="150" x="335" y="380" /><circle cx="365" cy="505" fill="#14294a" r="18" stroke="#14294a" stroke-width="3" /><circle cx="455" cy="505" fill="#14294a" r="18" stroke="#14294a" stroke-width="3" /><line stroke="#138a67" stroke-linecap="round" stroke-width="6" x1="410" x2="410" y1="420" y2="268" /><polygon fill="#138a67" points="410.0,268.0 416.60842757805835,280.342150742296 403.39157242194165,280.342150742296" /><text fill="#138a67" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" x="429" y="279">N = 20 N</text><line stroke="#d95a5a" stroke-linecap="round" stroke-width="6" x1="410" x2="410" y1="448" y2="560" /><polygon fill="#d95a5a" points="410.0,560.0 403.39157242194165,547.657849257704 416.60842757805835,547.657849257704" /><text fill="#d95a5a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" x="435" y="573">mg = 20 N</text><line stroke="#2670dc" stroke-linecap="round" stroke-width="7" x1="480" x2="682" y1="423" y2="423" /><polygon fill="#2670dc" points="682.0,423.0 669.657849257704,429.60842757805835 669.657849257704,416.39157242194165" /><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" x="543" y="402">F = 10 N</text><line stroke="#e99b25" stroke-linecap="round" stroke-width="6" x1="338" x2="200" y1="447" y2="447" /><polygon fill="#e99b25" points="200.0,447.0 212.342150742296,440.39157242194165 212.342150742296,453.60842757805835" /><text fill="#e99b25" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" x="216" y="424">f = 2 N</text><rect fill="#e8f2ff" height="330" rx="20" stroke="#cbdcf0" stroke-width="2" width="370" x="745" y="207" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="769" y="249">列方程并求加速度</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="763" y="268">水平方向：</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="763" y="317">ΣFₓ = 10 − 2 = 8 N</text><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" x="763" y="366">aₓ = 8 / 2 = 4 m/s²</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="763" y="415" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="763" y="464">竖直方向：</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" x="763" y="513">ΣFᵧ = N − mg = 0</text><rect fill="#edf7fc" height="80" rx="20" stroke="#cbdcf0" stroke-width="2" width="1090" x="55" y="640" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="83" y="689">自由体图只表示小车受到的力；N 与 mg 平衡，并不抵消水平加速度。</text></svg>