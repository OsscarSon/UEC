<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="700" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#dbe5ef" stroke-width="2" width="1064" x="18" y="18" /><rect fill="#132c4b" height="98" rx="20" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="31" font-weight="700" x="50" y="74">牛顿第三定律：作用力与反作用力</text><text fill="#cde3fa" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="15" font-weight="400" x="930" y="72">物理｜牛顿运动定律</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="48" y="149">大小相等、方向相反，分别作用在两个不同物体上</text><rect fill="#eff6ff" height="392" rx="16" stroke="#ccdef2" stroke-width="1.5" width="990" x="55" y="180" /><circle cx="355" cy="370" fill="#deebff" r="82" stroke="#668ad0" stroke-width="2" /><circle cx="735" cy="370" fill="#dbf4ec" r="82" stroke="#70b89d" stroke-width="2" /><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="355" y="381">物体 A</text><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="735" y="381">物体 B</text><line stroke="#2563eb" stroke-width="6" x1="418" x2="652" y1="344" y2="344" /><polygon fill="#2563eb" points="652,344 640.12984377594,349.3008858897744 640.12984377594,338.6991141102256" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="540" y="318">A 对 B 的力</text><line stroke="#dc4d54" stroke-width="6" x1="672" x2="438" y1="421" y2="421" /><polygon fill="#dc4d54" points="438,421 449.87015622406,415.6991141102256 449.87015622406,426.3008858897744" /><text fill="#dc4d54" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="540" y="464">B 对 A 的力</text><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="540" y="540">F_AB = −F_BA（矢量式）</text><rect fill="#edf6ff" height="43" rx="9" stroke="#dfebfa" stroke-width="1.5" width="1010" x="45" y="620" /><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">这一对力不能在同一个物体的受力图中互相抵消；它们作用于不同物体。</text></svg>