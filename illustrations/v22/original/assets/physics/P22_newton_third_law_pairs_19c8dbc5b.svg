<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1000 640" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="640" width="1000" x="0" y="0" /><rect fill="#142c4a" height="86" width="1000" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31px" font-weight="bold" x="44" y="56">牛顿第三定律：作用力与反作用力</text><text fill="#617389" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17px" x="44" y="111">物理 · 牛顿运动定律（具体节号待核） · 教学示意</text><rect fill="#f0f5fa" height="450" rx="18" ry="18" stroke="#d9e4f0" stroke-width="2" width="600" x="36" y="146" /><text fill="#2867ad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23px" font-weight="bold" x="59" y="186">物体放在水平桌面上</text><rect fill="#91adca" height="24" rx="5" width="425" x="125" y="429" /><rect fill="#dce9f6" height="110" rx="8" stroke="#142c4a" stroke-width="3" width="130" x="255" y="319" /><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25px" font-weight="bold" x="292" y="378">物体</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23px" font-weight="normal" x="284" y="492">桌面</text><line stroke="#21806e" stroke-width="5" x1="320" x2="320" y1="432" y2="254" /><polygon fill="#21806e" points="320,254 324.3496553411123,263.0044710235268 315.6503446588877,263.0044710235268" /><text fill="#21806e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19px" font-weight="bold" x="340" y="266">桌面对物体的支持力 N</text><line stroke="#bd4052" stroke-width="5" x1="380" x2="380" y1="429" y2="538" /><polygon fill="#bd4052" points="380,538 375.6503446588877,528.9955289764732 384.3496553411123,528.9955289764732" /><text fill="#bd4052" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="bold" x="414" y="540">物体对桌面的压力 N′</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20px" font-weight="bold" x="80" y="578">N 与 N′ 是一对作用与反作用力</text><rect fill="#f0f5fa" height="450" rx="18" ry="18" stroke="#d9e4f0" stroke-width="2" width="302" x="665" y="146" /><text fill="#2867ad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23px" font-weight="bold" x="688" y="186">分清三个概念</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="687" y="247">① 大小相等、方向相反</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="687" y="310">② 分别作用于不同物体</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="687" y="373">③ 力的性质相同</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="687" y="436">④ N 与重力 G 不是</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="687" y="499">   第三定律的一对力</text><text fill="#617389" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15px" font-weight="normal" x="40" y="622">提示：若物体静止且仅受竖直 N、G，则 N=G；这是平衡关系，不是第三定律配对。</text></svg>