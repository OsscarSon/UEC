<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="bold" x="50" y="66">光电效应：频率与最大动能</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="48" y="126">单色光照射同一种金属；不同金属的逸出功可能不同</text><rect fill="#f4f8ff" height="335" rx="15" stroke="#dae6f5" stroke-width="1.5" width="388" x="45" y="154" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="186">光子入射与电子逸出</text><rect fill="#bfcbd9" height="56" stroke="#556a83" stroke-width="2" width="278" x="97" y="318" /><circle cx="132" cy="337" fill="#2563eb" r="8" /><circle cx="202" cy="337" fill="#2563eb" r="8" /><circle cx="272" cy="337" fill="#2563eb" r="8" /><path d="M 84 217 Q 108 188 130 216 T 176 216" fill="none" stroke="#ee9444" stroke-width="4" /><line stroke="#ee9444" stroke-linecap="round" stroke-width="3" x1="170" x2="209" y1="222" y2="308" /><polygon fill="#ee9444" points="209,308 198.93292463079297,299.77479522986175 209.44514906313827,295.00762368496095" /><line stroke="#2563eb" stroke-linecap="round" stroke-width="3" x1="230" x2="276" y1="307" y2="239" /><polygon fill="#2563eb" points="276,239 274.2534271846203,251.88213815329493 264.69284099910374,245.4146827925043" /><text fill="#ee9444" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="61" y="291">入射光 hf</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="279" y="240">光电子</text><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="70" y="410">只有 hf ≥ W 时才可能逸出</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="68" y="445">W：金属逸出功</text><rect fill="#f4f8ff" height="335" rx="15" stroke="#dae6f5" stroke-width="1.5" width="459" x="451" y="154" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="469" y="186">最大初动能—频率图</text><line stroke="#556a83" stroke-linecap="round" stroke-width="2" x1="512" x2="862" y1="437" y2="437" /><polygon fill="#556a83" points="862,437 850.3513175321682,442.77132539055174 850.3513175321682,431.22867460944826" /><line stroke="#556a83" stroke-linecap="round" stroke-width="2" x1="512" x2="512" y1="437" y2="198" /><polygon fill="#556a83" points="512,198 517.7713253905517,209.64868246783183 506.22867460944826,209.64868246783183" /><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="end" x="857" y="466">频率 f</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="509" y="186">Kmax</text><line stroke="#dc4b4b" stroke-linecap="round" stroke-width="3" x1="608" x2="608" y1="437" y2="428" /><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="608" y="463">f0</text><polyline fill="none" points="608,437 837,220" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="695" y="253">斜率 h</text><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="618" y="417">阈频 f0 = W/h</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">Kmax = hf − W（f ≥ f0）；增加光强不能让低于阈频的光产生光电子。</text></svg>