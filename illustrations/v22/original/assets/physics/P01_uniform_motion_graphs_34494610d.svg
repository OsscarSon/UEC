<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="700" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#dbe5ef" stroke-width="2" width="1064" x="18" y="18" /><rect fill="#132c4b" height="98" rx="20" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="31" font-weight="700" x="50" y="74">匀速直线运动：位移—时间与速度—时间图</text><text fill="#cde3fa" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="15" font-weight="400" x="930" y="72">物理｜直线运动</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="48" y="149">同一运动，两种图像；斜率、面积的物理意义不同</text><rect fill="#eff6ff" height="402" rx="16" stroke="#ccdef2" stroke-width="1.5" width="476" x="55" y="178" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="22" font-weight="700" x="78" y="217">x–t 图（斜率 = 速度）</text><line stroke="#132c4b" stroke-width="3" x1="131" x2="489" y1="520" y2="520" /><polygon fill="#132c4b" points="489,520 479.8691105968769,524.0776045305957 479.8691105968769,515.9223954694043" /><line stroke="#132c4b" stroke-width="3" x1="131" x2="131" y1="520" y2="260" /><polygon fill="#132c4b" points="131,260 135.0776045305957,269.1308894031231 126.9223954694043,269.1308894031231" /><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="489" y="548">t / s</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="74" y="248">x / m</text><polyline fill="none" points="131,475 445,315" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="19" font-weight="400" x="165" y="297">斜率恒定：v = Δx / Δt</text><rect fill="#eff6ff" height="402" rx="16" stroke="#ccdef2" stroke-width="1.5" width="476" x="568" y="178" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="22" font-weight="700" x="591" y="217">v–t 图（面积 = 位移）</text><line stroke="#132c4b" stroke-width="3" x1="644" x2="1002" y1="520" y2="520" /><polygon fill="#132c4b" points="1002,520 992.8691105968769,524.0776045305957 992.8691105968769,515.9223954694043" /><line stroke="#132c4b" stroke-width="3" x1="644" x2="644" y1="520" y2="260" /><polygon fill="#132c4b" points="644,260 648.0776045305957,269.1308894031231 639.9223954694043,269.1308894031231" /><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="1002" y="548">t / s</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="587" y="248">v / (m/s)</text><polyline fill="none" points="644,340 957,340" stroke="#0b9488" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><rect fill="#b6eee3" height="178" opacity="0.32" width="310" x="645" y="340" /><text fill="#0b9488" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="22" font-weight="700" x="708" y="450">矩形面积 = vΔt</text><rect fill="#edf6ff" height="43" rx="9" stroke="#dfebfa" stroke-width="1.5" width="1010" x="45" y="620" /><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">注意：x–t 线的纵坐标是位置；v–t 线下有向面积是位移，而不是路程（一般情况）。</text></svg>