<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="head" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L9 5 L0 10Z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="89" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="700" text-anchor="start" x="45" y="57">斜面受力分解：沿面与垂直面</text><text fill="#52677c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="45" y="123">示例：质量 2 kg，斜面角 30°，g = 10 N/kg；忽略摩擦</text><rect fill="#f7faff" height="480" rx="14" stroke="#d6e2ee" stroke-width="2" width="730" x="40" y="160" /><rect fill="#f5faf7" height="480" rx="14" stroke="#d6e2ee" stroke-width="2" width="350" x="800" y="160" /><polygon fill="#e6eef9" points="125,565 690,565 690,240" stroke="#142c4c" stroke-width="3" /><polygon fill="#bfdefd" points="386.2250092524069,414.80973451327435 418.2250092524069,359.3841086710703 485.7749907475931,320.3841086710703 453.7749907475931,375.80973451327435" stroke="#2563eb" stroke-width="3" /><line marker-end="url(#head)" stroke="#cf4556" stroke-linecap="round" stroke-width="5" x1="420" x2="420" y1="368.30973451327435" y2="570.3097345132744" /><line marker-end="url(#head)" stroke="#11816c" stroke-linecap="round" stroke-width="5" x1="420" x2="497.5" y1="368.30973451327435" y2="234.07579692668634" /><line marker-end="url(#head)" stroke="#2563eb" stroke-linecap="round" stroke-width="5" x1="420" x2="268.44555433772325" y1="368.30973451327435" y2="455.80973451327435" /><text fill="#cf4556" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="435" y="561.3097345132744">mg = 20 N</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="515" y="230.30973451327435">N</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="248" y="477.30973451327435">mg sin30°</text><text fill="#b97813" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="165" y="555">30°</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="505" y="310">重力沿斜面分量</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="700" text-anchor="start" x="825" y="225">受力关系</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="271">重力：mg = 20 N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="307">沿斜面：mg sin30°</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="824" y="343">= 10 N（向下）</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="379">垂直斜面：mg cos30°</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="824" y="415">≈ 17.32 N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="451">法向支持力 N ≈ 17.32 N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="487" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="523">加速度 a = g sin30°</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="824" y="559">= 5 m/s²（沿面向下）</text></svg>