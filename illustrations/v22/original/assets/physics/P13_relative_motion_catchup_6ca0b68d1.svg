<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr_P13_relative_motion_catchup" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="90" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="38" font-weight="700" text-anchor="start" x="55" y="56">同向追及：位置—时间图</text><text fill="#51667c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="56" y="120">示例：A 在 x=0 以 6 m/s 前进；B 在 x=30 m 以 3 m/s 前进</text><rect fill="#f7faff" height="480" rx="18" stroke="#d6e3f1" stroke-width="2" width="710" x="45" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="67" y="195">x–t 交点表示同一时刻、同一位置</text><line marker-end="url(#arr_P13_relative_motion_catchup)" stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="120" x2="695" y1="585" y2="585" /><line marker-end="url(#arr_P13_relative_motion_catchup)" stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="120" x2="120" y1="585" y2="235" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="694" y="614">t / s</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="64" y="235">x / m</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="120" x2="120" y1="579" y2="591" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="120" y="612">0</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="295" x2="295" y1="579" y2="591" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="295" y="612">5</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="470" x2="470" y1="579" y2="591" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="470" y="612">10</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="645" x2="645" y1="579" y2="591" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="645" y="612">15</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="113" x2="127" y1="585" y2="585" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="end" x="102" y="590">0</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="113" x2="127" y1="495" y2="495" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="end" x="102" y="500">30</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="113" x2="127" y1="405" y2="405" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="end" x="102" y="410">60</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="113" x2="127" y1="315" y2="315" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="end" x="102" y="320">90</text><polyline fill="none" points="120,585 645,315" stroke="#2563eb" stroke-linejoin="round" stroke-width="5" /><polyline fill="none" points="120,495 645,360" stroke="#d34f55" stroke-linejoin="round" stroke-width="5" /><circle cx="470" cy="405" fill="#142c4c" r="8" stroke="none" stroke-width="2" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="484" y="390">(10 s, 60 m)</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="430" y="310">A：xA = 6t</text><text fill="#d34f55" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="420" y="397">B：xB = 30 + 3t</text><rect fill="#f5fbf8" height="480" rx="18" stroke="#d6e3f1" stroke-width="2" width="375" x="780" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="802" y="195">联立位置方程</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="808" y="239">xA = 6t</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="808" y="277">xB = 30 + 3t</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="808" y="315" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="808" y="353">追上时 xA = xB</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="808" y="391">6t = 30 + 3t</text><text fill="#0f977c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="808" y="429">t = 10 s</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="808" y="467" /><text fill="#0f977c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="808" y="505">x = 6 × 10 = 60 m</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="808" y="543" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="808" y="581">速度差：6−3 = 3 m/s</text></svg>