<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px"><defs/><rect fill="#f7faff" height="590" width="960" x="0" y="0"/><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18"/><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18"/><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="bold" x="50" y="67">浮力：阿基米德原理与受力分析</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" x="48" y="126">静止于液体中、未接触容器底部的浸没物体；下图为竖直力示意</text><rect fill="#f4f8ff" height="344" rx="15" stroke="#dae6f5" stroke-width="1.5" width="526" x="45" y="151"/><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="183">浸没物体：受力图</text><rect fill="#dff3ff" height="254" rx="12" stroke="#6cb4e7" stroke-width="3" width="384" x="116" y="207"/><line stroke="#65a9d8" stroke-linecap="round" stroke-width="3" x1="115" x2="499" y1="242" y2="242"/><rect fill="#a9b8cf" height="90" rx="12" stroke="#556a83" stroke-width="2" width="95" x="268" y="295"/><line stroke="#0f766e" stroke-linecap="round" stroke-width="5" x1="314" x2="314" y1="342" y2="256"/><polygon fill="#0f766e" points="314,256 319.2736809246462,265.6534081807941 308.7263190753538,265.6534081807941"/><line stroke="#dc4b4b" stroke-linecap="round" stroke-width="5" x1="314" x2="314" y1="342" y2="431"/><polygon fill="#dc4b4b" points="314,431 308.7263190753538,421.3465918192059 319.2736809246462,421.3465918192059"/><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="326" y="272">浮力 F</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="332" y="422">重力 mg</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="152" y="449">液体密度 rho</text><rect fill="#f4f8ff" height="344" rx="15" stroke="#dae6f5" stroke-width="1.5" width="320" x="591" y="151"/><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="609" y="183">阿基米德原理</text><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="612" y="232">F浮 = rho·g·V</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="611" y="285">rho：液体密度</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="611" y="316">V：排开液体体积</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="611" y="347">g：重力加速度</text><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="610" y="391">悬浮平衡时：</text><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="613" y="426">F浮 = mg</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="608" y="462">仅在无其他竖直力时适用</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515"/><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">浸没物体的 V排 = 物体体积；浮力大小由排开液体的重量决定。</text></svg>