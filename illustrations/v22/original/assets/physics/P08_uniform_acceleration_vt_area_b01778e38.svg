<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1200 760" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="760" width="1200" x="0" y="0" /><rect fill="#14294a" height="83" rx="23" width="1136" x="32" y="28" /><text fill="#ffffff" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start" x="65" y="84">匀加速直线运动：速度—时间图</text><text fill="#66758a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="47" y="143">例：初速度 2 m/s，加速度 +1.5 m/s²，持续 4 s（正方向向右）</text><rect fill="#f4f8ff" height="445" rx="20" stroke="#cbdcf0" stroke-width="2" width="740" x="52" y="170" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="76" y="212">图中阴影面积代表有向位移</text><line stroke="#14294a" stroke-linecap="round" stroke-width="3" x1="140" x2="710" y1="530" y2="530" /><polygon fill="#14294a" points="710.0,530.0 697.657849257704,536.6084275780584 697.657849257704,523.3915724219416" /><line stroke="#14294a" stroke-linecap="round" stroke-width="3" x1="140" x2="140" y1="530" y2="230" /><polygon fill="#14294a" points="140.0,230.0 146.60842757805835,242.342150742296 133.39157242194165,242.342150742296" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" x="730" y="560">t / s</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="77" y="215">v / (m/s)</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="140" x2="140" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="140" y="566">0</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="272" x2="272" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="272" y="566">1</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="404" x2="404" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="404" y="566">2</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="536" x2="536" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="536" y="566">3</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="668" x2="668" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="668" y="566">4</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="133" x2="147" y1="530" y2="530" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="114" y="536">0</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="133" x2="147" y1="468" y2="468" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="114" y="474">2</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="133" x2="147" y1="406" y2="406" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="114" y="412">4</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="133" x2="147" y1="344" y2="344" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="114" y="350">6</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="133" x2="147" y1="282" y2="282" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="114" y="288">8</text><polygon fill="#dceafa" opacity="0.9" points="140,530 140,468 668,282 668,530" /><line stroke="#2670dc" stroke-linecap="round" stroke-width="6" x1="140" x2="668" y1="468" y2="282" /><circle cx="140" cy="468" fill="#2670dc" r="8" /><circle cx="668" cy="282" fill="#2670dc" r="8" /><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="152" y="454">v₀ = 2</text><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="end" x="662" y="267">v₄ = 8</text><rect fill="#e8f2ff" height="445" rx="20" stroke="#cbdcf0" stroke-width="2" width="338" x="816" y="170" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="840" y="212">计算核验</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="838" y="252">v = v₀ + at</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="838" y="296">= 2 + 1.5 × 4</text><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" x="838" y="340">= 8 m/s</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="838" y="384" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="838" y="428">Δx = (2 + 8) × 4 / 2</text><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" x="838" y="472">= 20 m</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="838" y="516" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" x="838" y="560">图像斜率 = 1.5 m/s²</text><rect fill="#edf7fc" height="80" rx="20" stroke="#cbdcf0" stroke-width="2" width="1090" x="55" y="640" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="83" y="689">提醒：v–t 图像的斜率是加速度；与时间轴之间的有向面积是位移，不一定是路程。</text></svg>