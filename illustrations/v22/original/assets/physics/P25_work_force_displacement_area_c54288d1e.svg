<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="660" version="1.1" viewBox="0 0 1100 660" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="660" width="1100" x="0" y="0" /><rect fill="#112B51" height="96" width="1100" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="bold" x="40" y="62">功与力—位移图：面积代表做功</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="42" y="133">示例：作用力始终沿位移方向，力随位置线性增大</text><rect fill="#F5F8FD" height="369" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="650" x="37" y="156" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="62" y="198">F / N</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="128" x2="610" y1="465" y2="465" /><polygon fill="#112B51" points="610,465 596.6950761583107,471.92668763312224 596.6950761583107,458.07331236687776" /><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="128" x2="128" y1="465" y2="217" /><polygon fill="#112B51" points="128,217 134.92668763312224,230.30492384168926 121.07331236687776,230.30492384168926" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="128" y="493">0</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="320" y="493">2</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="512" y="493">4</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="end" x="103" y="471">0</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="end" x="103" y="359">4</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="end" x="103" y="247">8</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="bold" x="612" y="500">x / m</text><polygon fill="#2762CD" opacity="0.17" points="128,465 512,241 512,465" /><line stroke="#2762CD" stroke-linecap="round" stroke-width="6" x1="128" x2="512" y1="465" y2="241" /><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" x="325" y="250">F = 2x（N）</text><rect fill="#F5F8FD" height="369" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="353" x="713" y="156" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="738" y="198">面积计算</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" x="739" y="240">从 x = 0 到 4 m</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" x="739" y="291">末端 F = 8 N</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" x="739" y="342">图像下为三角形</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" x="739" y="393">W = ½ × 4 m × 8 N</text><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" x="739" y="444">W = 16 J</text><rect fill="#F5F8FD" height="91" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="1030" x="35" y="548" /><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="581">图像面积表示 W = ∫ F(x) dx；仅取沿位移方向的力分量。</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="614">本图为示例函数，并非实验测量数据；若力与位移反向，则做功为负。</text></svg>