<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="bold" x="50" y="66">哈代—温伯格平衡：基因型频率</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="48" y="126">理想随机交配群体的理论模型；以两种等位基因 A、a 为例</text><rect fill="#f4f8ff" height="336" rx="15" stroke="#dae6f5" stroke-width="1.5" width="410" x="45" y="154" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="186">频率关系与前提</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="70" y="226">p = f(A)，q = f(a)</text><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="70" y="282">p + q = 1</text><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="70" y="332">p^2 + 2pq + q^2 = 1</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="70" y="393">AA：p^2    Aa：2pq    aa：q^2</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="68" y="460">须满足理想群体前提条件</text><rect fill="#f4f8ff" height="336" rx="15" stroke="#dae6f5" stroke-width="1.5" width="436" x="475" y="154" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="493" y="186">示例：p = 0.6，q = 0.4</text><rect fill="#2563eb" height="65" width="126.0" x="505" y="262" /><rect fill="#0f766e" height="65" width="168.0" x="631.0" y="262" /><rect fill="#ee9444" height="65" width="56.0" x="799.0" y="262" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="505" y="364">AA：36%</text><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="505" y="395">Aa：48%</text><text fill="#ee9444" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="505" y="426">aa：16%</text><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="506" y="229">36% + 48% + 16% = 100%</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">模型条件：大群体、随机交配、无突变/迁移/自然选择及遗传漂变等干扰。</text></svg>