  <rect fill="#EAF3FE" height="355" rx="16" ry="16" stroke="#2869B5" stroke-width="2" width="245" x="478" y="194"/>
  <rect fill="#E9F7EF" height="355" rx="16" ry="16" stroke="#0B9488" stroke-width="2" width="245" x="757" y="194"/>
