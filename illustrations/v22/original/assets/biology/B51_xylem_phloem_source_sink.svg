  <text fill="#168A62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="785" y="244">韧皮部</text>
  <line stroke="#2869B5" stroke-linecap="round" stroke-width="8" x1="605" x2="605" y1="488" y2="312"/>
  <polygon fill="#2869B5" points="605,312 611.5,323.2583302491977 598.5,323.2583302491977"/>
  <text fill="#2869B5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="601" y="534">水、无机盐</text>
  <text fill="#2869B5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="500" text-anchor="middle" x="601" y="293">根 → 茎 → 叶</text>
  <line stroke="#0B9488" stroke-linecap="round" stroke-width="7" x1="883" x2="883" y1="325" y2="470"/>
  <polygon fill="#0B9488" points="883,470 876.5,458.7416697508023 889.5,458.7416697508023"/>
  <text fill="#0B9488" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="884" y="290">源：成熟叶</text>
  <text fill="#0B9488" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="884" y="518">库：生长部位/根</text>
  <rect fill="#F0F9F6" height="76" rx="16" ry="16" stroke="#0B9488" stroke-width="2" width="1024" x="48" y="622"/>
  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="650">木质部水分主要向上运输；韧皮部的方向由“源—库”关系决定，不是一律向下。</text>
  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="676">同株植物不同筛管可同时向不同方向运输同化产物。</text>
