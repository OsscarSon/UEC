<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650"><rect width="1200" height="650" fill="#f7faff"/><rect x="20" y="15" width="1160" height="620" rx="22" fill="white" stroke="#d8e5f4" stroke-width="2"/><rect x="25" y="20" width="1150" height="76" rx="17" fill="#173a68"/><text x="55" y="69" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="white">有氧细胞呼吸：场所与主要阶段</text><text x="55" y="131" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#576c84">以真核细胞为例；每个阶段的物质和能量变化需分别理解</text><rect x="45" y="174" width="270" height="350" rx="16" fill="#dbeaff" stroke="#d2e2ef" stroke-width="2"/><text x="60" y="216" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173a68">① 糖酵解</text><text x="60" y="264" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#586d82">细胞质基质</text><text x="60" y="319" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#142e50">葡萄糖 → 2 丙酮酸</text><text x="60" y="385" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0e725e">净生成 2 ATP</text><text x="60" y="426" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#0e725e">生成 2 NADH</text><line x1="316" y1="344" x2="332" y2="344" stroke="#336ca8" stroke-width="3"/><path d="M 332 344 l -10 -7 v 14 z" fill="#336ca8"/><rect x="335" y="174" width="270" height="350" rx="16" fill="#e8f2ff" stroke="#d2e2ef" stroke-width="2"/><text x="350" y="216" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173a68">② 丙酮酸氧化</text><text x="350" y="264" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#586d82">线粒体基质</text><text x="350" y="319" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#142e50">2 丙酮酸 → 2 乙酰辅酶 A</text><text x="350" y="385" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0e725e">生成 2 CO2</text><text x="350" y="426" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#0e725e">生成 2 NADH</text><line x1="606" y1="344" x2="622" y2="344" stroke="#336ca8" stroke-width="3"/><path d="M 622 344 l -10 -7 v 14 z" fill="#336ca8"/><rect x="625" y="174" width="270" height="350" rx="16" fill="#e5f8f0" stroke="#d2e2ef" stroke-width="2"/><text x="640" y="216" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173a68">③ 柠檬酸循环</text><text x="640" y="264" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#586d82">线粒体基质</text><text x="640" y="319" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#142e50">2 乙酰基进入循环</text><text x="640" y="385" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0e725e">生成 4 CO2、6 NADH</text><text x="640" y="426" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#0e725e">生成 2 FADH2、2 GTP/ATP</text><line x1="896" y1="344" x2="912" y2="344" stroke="#336ca8" stroke-width="3"/><path d="M 912 344 l -10 -7 v 14 z" fill="#336ca8"/><rect x="915" y="174" width="270" height="350" rx="16" fill="#fff1d8" stroke="#d2e2ef" stroke-width="2"/><text x="930" y="216" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173a68">④ 氧化磷酸化</text><text x="930" y="264" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#586d82">线粒体内膜</text><text x="930" y="319" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#142e50">NADH、FADH2供电子</text><text x="930" y="385" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0e725e">O2 是最终电子受体</text><text x="930" y="426" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#0e725e">质子梯度驱动 ATP 合成</text><rect x="45" y="550" width="1110" height="60" rx="16" fill="#eaf3ff" stroke="#cddff3" stroke-width="2"/><text x="65" y="586" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#142e50">说明：ATP 总产量随细胞条件及穿梭机制变化；GTP 可换算为 ATP 当量。</text></svg>