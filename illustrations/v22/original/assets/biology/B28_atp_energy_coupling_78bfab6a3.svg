<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1000 640" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="640" width="1000" x="0" y="0" /><rect fill="#142c4a" height="86" width="1000" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31px" font-weight="bold" x="44" y="56">ATP 水解与吸能过程的能量耦联</text><text fill="#617389" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17px" x="44" y="111">生物 · 3.4 细胞的能量通货——ATP · 教学示意</text><rect fill="#f0f5fa" height="450" rx="18" ry="18" stroke="#d9e4f0" stroke-width="2" width="905" x="46" y="150" /><text fill="#2867ad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23px" font-weight="bold" x="69" y="190">细胞能量耦联的基本逻辑</text><rect fill="#2867ad" height="43" rx="11" width="340" x="90" y="232" /><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19px" font-weight="bold" x="105" y="262">放能：ATP 水解</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26px" font-weight="bold" x="109" y="308">ATP + H₂O → ADP + Pi</text><text fill="#2867ad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20px" font-weight="normal" x="109" y="351">整体反应的 ΔG &lt; 0</text><line stroke="#d78724" stroke-width="5" x1="480" x2="625" y1="315" y2="315" /><polygon fill="#d78724" points="625,315 615.9955289764732,319.3496553411123 615.9955289764732,310.6503446588877" /><rect fill="#21806e" height="43" rx="11" width="252" x="655" y="232" /><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19px" font-weight="bold" x="670" y="262">吸能：细胞工作</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22px" font-weight="normal" x="661" y="314">物质合成</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22px" font-weight="normal" x="661" y="356">主动运输</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22px" font-weight="normal" x="661" y="398">机械活动</text><rect fill="#fff4dd" height="106" rx="15" stroke="#f3d6a3" stroke-width="1.5" width="749" x="126" y="439" /><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21px" font-weight="bold" x="153" y="476">关键：把两个反应耦联，使整体自由能变化有利。</text><text fill="#bd4052" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="153" y="513">不能理解成“只要把高能键打断就必然释放能量”。</text><text fill="#617389" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15px" font-weight="normal" x="49" y="623">ATP 再合成需要能量输入；本图为机理示意，不代表 ATP 直接提供所有反应的唯一能量。</text></svg>