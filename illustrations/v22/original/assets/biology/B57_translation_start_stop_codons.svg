<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px"><defs/><rect fill="#f7faff" height="590" width="960" x="0" y="0"/><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18"/><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18"/><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="bold" x="50" y="67">蛋白质翻译：起始密码子与终止密码子</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" x="48" y="126">以一段示例 mRNA 为例；密码子按 5′ → 3′ 方向每三个核苷酸读取</text><rect fill="#f4f8ff" height="338" rx="15" stroke="#dae6f5" stroke-width="1.5" width="870" x="44" y="154"/><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="62" y="186">mRNA 与多肽链的对应关系</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="74" y="226">5′</text><rect fill="white" height="73" rx="13" stroke="#0f766e" stroke-width="3" width="160" x="125" y="191"/><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="205" y="236">AUG</text><line stroke="#0f766e" stroke-linecap="round" stroke-width="2" x1="205" x2="205" y1="274" y2="327"/><polygon fill="#0f766e" points="205,327 199.72631907535376,317.3465918192059 210.27368092464624,317.3465918192059"/><circle cx="205" cy="366" fill="#f6fbff" r="33" stroke="#0f766e" stroke-width="2"/><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="205" y="373">Met</text><rect fill="white" height="73" rx="13" stroke="#2563eb" stroke-width="3" width="160" x="310" y="191"/><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="390" y="236">GCU</text><line stroke="#2563eb" stroke-linecap="round" stroke-width="2" x1="390" x2="390" y1="274" y2="327"/><polygon fill="#2563eb" points="390,327 384.7263190753538,317.3465918192059 395.2736809246462,317.3465918192059"/><circle cx="390" cy="366" fill="#f6fbff" r="33" stroke="#2563eb" stroke-width="2"/><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="390" y="373">Ala</text><rect fill="white" height="73" rx="13" stroke="#2563eb" stroke-width="3" width="160" x="495" y="191"/><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="575" y="236">UUU</text><line stroke="#2563eb" stroke-linecap="round" stroke-width="2" x1="575" x2="575" y1="274" y2="327"/><polygon fill="#2563eb" points="575,327 569.7263190753538,317.3465918192059 580.2736809246462,317.3465918192059"/><circle cx="575" cy="366" fill="#f6fbff" r="33" stroke="#2563eb" stroke-width="2"/><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="575" y="373">Phe</text><rect fill="white" height="73" rx="13" stroke="#dc4b4b" stroke-width="3" width="160" x="680" y="191"/><text fill="#dc4b4b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="760" y="236">UGA</text><line stroke="#dc4b4b" stroke-linecap="round" stroke-width="2" x1="760" x2="760" y1="274" y2="327"/><polygon fill="#dc4b4b" points="760,327 754.7263190753538,317.3465918192059 765.2736809246462,317.3465918192059"/><rect fill="#ffebeb" height="52" rx="12" stroke="#dc4b4b" stroke-width="2" width="103" x="710" y="342"/><text fill="#dc4b4b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="762" y="374">终止</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="bold" text-anchor="start" x="870" y="234">3′</text><line stroke="#556a83" stroke-linecap="round" stroke-width="3" x1="238" x2="277" y1="366" y2="366"/><line stroke="#556a83" stroke-linecap="round" stroke-width="3" x1="422" x2="462" y1="366" y2="366"/><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="102" y="450">AUG 通常为起始密码子；UGA 是终止密码子，不由 tRNA 携带氨基酸。</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515"/><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">tRNA 识别氨基酸密码子；终止密码子由释放因子识别，触发多肽释放。</text></svg>