l="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="700" x="423" y="245">② 酶—底物复合物</text><path d="M 453 355 L 525 355 L 525 415 L 598 415 L 598 355 L 647 355 L 647 481 L 453 481 Z" fill="#a8d8f5" stroke="#2563eb" stroke-width="3" /><rect fill="#ffe1a6" height="43" rx="5" stroke="#e9a928" stroke-width="1.5" width="51" x="536" y="369" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="504" y="522">酶</text><rect fill="#eff6ff" height="345" rx="16" stroke="#ccdef2" stroke-width="1.5" width="304" x="736" y="200" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="700" x="761" y="245">③ 产物释放</text><path d="M 791 355 L 863 355 L 863 415 L 936 415 L 936 355 L 985 355 L 985 481 L 791 481 Z" fill="#a8d8f5" stroke="#2563eb" stroke-width="3" /><rect fill="#e5f7d4" height="42" rx="5" stroke="#76bd78" stroke-width="1.5" width="42" x="866" y="281" /><rect fill="#e5f7d4" height="42" rx="5" stroke="#76bd78" stroke-width="1.5" width="42" x="925" y="281" /><text fill="#18845d" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="918" y="266">产物</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="842" y="522">酶</text><rect fill="#edf6ff" height="43" rx="9" stroke="#dfebfa" stroke-width="1.5" width="1010" x="45" y="620" /><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">示意图不代表所有酶只有一个底物或产物；酶专一性与活性位点结构有关。</text></svg>