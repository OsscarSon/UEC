<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="720" version="1.1" viewBox="0 0 1120 720" width="1120">
  <defs/>
  <rect fill="#F7FAFE" height="720" width="1120" x="0" y="0"/>
  <rect fill="#173B63" height="98" width="1120" x="0" y="0"/>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" text-anchor="start" x="55" y="61">生态系统能量金字塔</text>
  <text fill="#64748b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="58" y="128">示意例子：营养级间能量传递效率按约 10% 计算</text>
  <rect fill="white" height="435" rx="16" ry="16" stroke="#CCD9E8" stroke-width="2" width="1024" x="48" y="154"/>
  <polygon fill="#D9565C" points="455.0,258 665.0,258 648.0,188 472.0,188" stroke="white" stroke-width="3"/>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="560" y="222">第四营养级</text>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="500" text-anchor="middle" x="560" y="245">10 kJ</text>
  <polygon fill="#E79439" points="385.0,353 735.0,353 718.0,283 402.0,283" stroke="white" stroke-width="3"/>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="560" y="317">第三营养级</text>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="500" text-anchor="middle" x="560" y="340">100 kJ</text>
  <polygon fill="#2869B5" points="315.0,448 805.0,448 788.0,378 332.0,378" stroke="white" stroke-width="3"/>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="560" y="412">第二营养级</text>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="500" text-anchor="middle" x="560" y="435">1,000 kJ</text>
  <polygon fill="#0B9488" points="245.0,543 875.0,543 858.0,473 262.0,473" stroke="white" stroke-width="3"/>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="560" y="507">第一营养级</text>
  <text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="500" text-anchor="middle" x="560" y="530">10,000 kJ</text>
  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="100" y="226">高营养级</text>
  <text fill="#0B9488" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="100" y="506">生产者</text>
  <line stroke="#E79439" stroke-linecap="round" stroke-width="5" x1="958" x2="958" y1="523" y2="232"/>
  <polygon fill="#E79439" points="958,232 964.5,243.2583302491977 951.5,243.2583302491977"/>
  <text fill="#E79439" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="979" y="390">能量总体递减</text>
  <rect fill="#F0F9F6" height="76" rx="16" ry="16" stroke="#0B9488" stroke-width="2" width="1024" x="48" y="622"/>
  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="650">数字为示例，不是所有生态系统固定的能量数据。能量在呼吸、排遗和未被摄食等过程中减少。</text>
  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="676">“10%”是常用近似经验值；实际传递效率可因生态系统和营养级而改变。</text>
</svg>
