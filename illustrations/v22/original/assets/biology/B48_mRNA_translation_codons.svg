  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="658" y="330">C</text>
  <rect fill="white" height="68" rx="8" ry="8" stroke="#CCD9E8" stroke-width="2" width="75" x="718" y="284"/>
  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="756" y="330">C</text>
