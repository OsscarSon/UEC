  <rect fill="#EAF4FE" height="95" rx="16" ry="16" stroke="#2869B5" stroke-width="2" width="360" x="150" y="272"/>
  <rect fill="white" height="68" rx="8" ry="8" stroke="#CCD9E8" stroke-width="2" width="75" x="185" y="284"/>
  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="223" y="330">A</text>
