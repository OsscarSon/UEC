  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="650">AUG 同时通常是起始密码子，指定甲硫氨酸；CCU 对应脯氨酸。</text>
  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="676">遗传密码表按 mRNA 密码子查找；需区分模板 DNA、编码链 DNA 与 mRNA。</text>
