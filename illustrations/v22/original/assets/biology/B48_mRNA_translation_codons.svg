  <line stroke="#0B9488" stroke-linecap="round" stroke-width="4" x1="760" x2="760" y1="367" y2="390"/>
  <polygon fill="#0B9488" points="760,390 753.5,378.7416697508023 766.5,378.7416697508023"/>
