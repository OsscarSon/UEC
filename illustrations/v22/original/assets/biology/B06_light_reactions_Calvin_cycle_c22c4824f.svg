<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="700" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#dbe5ef" stroke-width="2" width="1064" x="18" y="18" /><rect fill="#132c4b" height="98" rx="20" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="31" font-weight="700" x="50" y="74">叶绿体中的光反应与卡尔文循环</text><text fill="#cde3fa" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="15" font-weight="400" x="930" y="72">生物｜3.6 植物的光合作用</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="48" y="149">光反应在类囊体膜；卡尔文循环主要在叶绿体基质</text><rect fill="#f4fbf4" height="358" rx="16" stroke="#c1e4c8" stroke-width="1.5" width="995" x="52" y="200" /><rect fill="#daf3da" height="257" rx="16" stroke="#86cfa0" stroke-width="1.5" width="401" x="85" y="243" /><rect fill="#e9e0fb" height="257" rx="16" stroke="#c4b2e7" stroke-width="1.5" width="402" x="611" y="243" /><text fill="#18845d" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="24" font-weight="700" x="115" y="285">光反应（类囊体膜）</text><text fill="#7758bb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="24" font-weight="700" x="645" y="285">卡尔文循环（基质）</text><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="400" x="118" y="352">输入：光、H₂O</text><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="400" x="118" y="400">输出：O₂</text><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="400" x="645" y="352">输入：CO₂</text><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="19" font-weight="400" x="645" y="400">输出：G3P（有机物前体）</text><line stroke="#2563eb" stroke-width="4" x1="487" x2="607" y1="316" y2="316" /><polygon fill="#2563eb" points="607,316 595.12984377594,321.3008858897744 595.12984377594,310.6991141102256" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="549" y="291">ATP、NADPH</text><line stroke="#c78c19" stroke-width="4" x1="607" x2="487" y1="462" y2="462" /><polygon fill="#c78c19" points="487,462 498.87015622406,456.6991141102256 498.87015622406,467.3008858897744" /><text fill="#c78c19" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="548" y="493">ADP + Pi、NADP⁺</text><rect fill="#edf6ff" height="43" rx="9" stroke="#dfebfa" stroke-width="1.5" width="1010" x="45" y="620" /><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">“暗反应”并非只能在黑暗中进行；其进行依赖 ATP、NADPH 等供应。</text></svg>