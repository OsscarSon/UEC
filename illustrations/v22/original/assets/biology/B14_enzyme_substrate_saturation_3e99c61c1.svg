art" x="857" y="421">• Vmax 取决于酶的量</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="857" y="474">• 此图不代表所有酶</text><rect fill="#edf7fc" height="80" rx="20" stroke="#cbdcf0" stroke-width="2" width="1090" x="55" y="640" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="83" y="689">这是特定条件下的定性曲线。温度、pH 或抑制剂改变时，平台和曲线可能改变。</text></svg>