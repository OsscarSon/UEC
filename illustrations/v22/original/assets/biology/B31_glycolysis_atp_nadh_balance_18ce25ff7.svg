<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="660" version="1.1" viewBox="0 0 1100 660" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="660" width="1100" x="0" y="0" /><rect fill="#112B51" height="96" width="1100" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="bold" x="40" y="62">糖酵解：ATP 与 NADH 的收支</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="42" y="133">每 1 分子葡萄糖在细胞质基质中经糖酵解形成 2 分子丙酮酸</text><rect fill="#F5F8FD" height="352" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="1020" x="40" y="165" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="65" y="207">物质和能量收支（按每 1 葡萄糖）</text><rect fill="#E6EFFF" height="100" rx="16" stroke="#2762CD" stroke-width="2" width="244" x="78" y="250" /><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="200" y="293">葡萄糖</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="200" y="326">6 个碳</text><line stroke="#2762CD" stroke-linecap="round" stroke-width="5" x1="338" x2="405" y1="300" y2="300" /><polygon fill="#2762CD" points="405,300 391.6950761583107,306.92668763312224 391.6950761583107,293.07331236687776" /><rect fill="#EFE9FC" height="100" rx="16" stroke="#8060C2" stroke-width="2" width="244" x="424" y="250" /><text fill="#8060C2" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="546" y="293">糖酵解</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="546" y="326">分多步完成</text><line stroke="#8060C2" stroke-linecap="round" stroke-width="5" x1="684" x2="751" y1="300" y2="300" /><polygon fill="#8060C2" points="751,300 737.6950761583107,306.92668763312224 737.6950761583107,293.07331236687776" /><rect fill="#E9F7F2" height="100" rx="16" stroke="#15855E" stroke-width="2" width="244" x="770" y="250" /><text fill="#15855E" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="892" y="293">2 丙酮酸</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="892" y="326">每个 3 个碳</text><text fill="#C7444A" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" x="115" y="428">ATP 消耗：2</text><text fill="#15855E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" x="390" y="428">ATP 产生：4</text><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" x="670" y="428">ATP 净得：2</text><text fill="#8060C2" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="388" y="482">NADH 净得：2</text><rect fill="#F5F8FD" height="91" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="1030" x="35" y="548" /><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="581">糖酵解不需要直接使用 O₂；能量投入阶段消耗 2 ATP，后续生成 4 ATP。</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="614">NADH 的后续再氧化依赖细胞条件；发酵可再生 NAD+，不额外净产生 ATP。</text></svg>