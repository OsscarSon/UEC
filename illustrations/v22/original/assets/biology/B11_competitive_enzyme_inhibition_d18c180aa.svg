<svg baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f6f9fe" height="700" rx="0" stroke="#f6f9fe" stroke-width="1.5" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#d8e4f0" stroke-width="1.5" width="1064" x="18" y="18" /><rect fill="#193452" height="97" rx="20" stroke="#193452" stroke-width="1.5" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="29" font-weight="700" x="47" y="77">酶的竞争性抑制：底物与抑制剂竞争活性位点</text><text fill="#d9edff" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="904" y="74">生物｜3.1 或 3.2</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="46" y="149">竞争性抑制剂占据酶活性位点，使底物结合受到影响</text><rect fill="#e5f4ee" height="386" rx="15" stroke="#cbdfe9" stroke-width="1.5" width="460" x="61" y="190" /><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="700" x="85" y="247">① 底物结合</text><path d="M 156 365 L 240 365 L 240 424 L 323 424 L 323 365 L 418 365 L 418 523 L 156 523 Z" fill="#9ad4ed" stroke="#397cab" stroke-width="3" /><rect fill="#f5ba53" height="78" rx="4" stroke="#f5ba53" stroke-width="1.5" width="46" x="259" y="320" /><line stroke="#f5ba53" stroke-width="3" x1="283" x2="283" y1="398" y2="416" /><polygon fill="#f5ba53" points="283,416 277.78041359066526,405.1946347717679 288.21958640933474,405.1946347717679" /><text fill="#bd7d13" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="282" y="304">底物</text><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="243" y="556">活性位点</text><rect fill="#fcf0f0" height="386" rx="15" stroke="#cbdfe9" stroke-width="1.5" width="460" x="577" y="190" /><text fill="#ca4b52" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="700" x="601" y="247">② 抑制剂占位</text><path d="M 672 365 L 756 365 L 756 424 L 839 424 L 839 365 L 934 365 L 934 523 L 672 523 Z" fill="#9ad4ed" stroke="#397cab" stroke-width="3" /><rect fill="#e77791" height="78" rx="4" stroke="#e77791" stroke-width="1.5" width="46" x="775" y="320" /><line stroke="#e77791" stroke-width="3" x1="799" x2="799" y1="398" y2="416" /><polygon fill="#e77791" points="799,416 793.7804135906653,405.1946347717679 804.2195864093347,405.1946347717679" /><text fill="#ca4b52" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="798" y="303">抑制剂</text><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="759" y="556">活性位点</text><rect fill="#edf6ff" height="47" rx="9" stroke="#dce8f4" stroke-width="1.5" width="1010" x="45" y="617" /><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">此图仅示意典型竞争性抑制作用；酶抑制并不都是竞争性，也不等于永久失活。</text></svg>