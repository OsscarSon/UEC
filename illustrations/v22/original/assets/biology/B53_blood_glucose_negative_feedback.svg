<svg baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="bold" x="50" y="66">血糖稳态：胰岛素与胰高血糖素</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="48" y="126">简化负反馈模型；两种激素作用有差异，并非简单完全相反</text><rect fill="#fff5ed" height="333" rx="15" stroke="#dae6f5" stroke-width="1.5" width="413" x="45" y="156" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="188">餐后血糖升高</text><rect fill="#eef8fe" height="333" rx="15" stroke="#dae6f5" stroke-width="1.5" width="432" x="479" y="156" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="497" y="188">空腹血糖降低</text><rect fill="white" height="58" rx="14" stroke="#ee9444" stroke-width="2" width="165" x="102" y="209" /><text fill="#ee9444" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="112" y="246">血糖升高</text><rect fill="white" height="58" rx="14" stroke="#ee9444" stroke-width="2" width="165" x="271" y="209" /><text fill="#ee9444" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="281" y="246">胰岛 β 细胞</text><rect fill="white" height="58" rx="14" stroke="#0f766e" stroke-width="2" width="255" x="101" y="335" /><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif