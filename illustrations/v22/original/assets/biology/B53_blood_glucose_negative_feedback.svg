 stroke-linecap="round" stroke-width="3" x1="700" x2="728" y1="366" y2="366" /><polygon fill="#0f766e" points="728,366 716.3513175321682,371.77132539055174 716.3513175321682,360.22867460944826" /><text fill="#ee9444" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="118" y="321">胰岛素分泌↑</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" text-anchor="start" x="566" y="321">胰高血糖素分泌↑</text><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="95" y="436">血糖回落至正常范围</text><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="538" y="436">血糖回升至正常范围</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">负反馈：偏离正常范围 → 激素调节 → 血糖趋向恢复；正常值受多因素影响。</text></svg>