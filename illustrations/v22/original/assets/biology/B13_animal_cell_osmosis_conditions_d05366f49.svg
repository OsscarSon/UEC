<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1200 760" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="760" width="1200" x="0" y="0" /><rect fill="#14294a" height="83" rx="23" width="1136" x="32" y="28" /><text fill="#ffffff" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start" x="65" y="84">动物细胞的渗透作用：三种外液</text><text fill="#66758a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="47" y="143">示意：水可通过细胞膜；比较细胞内外有效渗透浓度，其他条件相同</text><rect fill="#f4f8ff" height="406" rx="20" stroke="#cbdcf0" stroke-width="2" width="360" x="55" y="186" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="79" y="228">低渗外液</text><text fill="#66758a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="79" y="263">水净流入：细胞膨胀</text><circle cx="235" cy="418" fill="#dceafc" r="82" stroke="#2670dc" stroke-width="5" /><line stroke="#2670dc" stroke-linecap="round" stroke-width="5" x1="80" x2="142" y1="418" y2="418" /><polygon fill="#2670dc" points="142.0,418.0 129.657849257704,424.60842757805835 129.657849257704,411.39157242194165" /><line stroke="#2670dc" stroke-linecap="round" stroke-width="5" x1="390" x2="328" y1="418" y2="418" /><polygon fill="#2670dc" points="328.0,418.0 340.342150742296,411.39157242194165 340.342150742296,424.60842757805835" /><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="235" y="547">低渗</text><rect fill="#f4f8ff" height="406" rx="20" stroke="#cbdcf0" stroke-width="2" width="360" x="435" y="186" /><text fill="#14294a" font-family="Noto Sans CJK SC,Micros