<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="head" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L9 5 L0 10Z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="89" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="700" text-anchor="start" x="45" y="57">有氧呼吸：各阶段在细胞中的位置</text><text fill="#52677c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="45" y="123">以真核细胞为例；ATP 产量因细胞与条件而不同，不用固定数值代替</text><rect fill="#f7faff" height="490" rx="14" stroke="#d6e2ee" stroke-width="2" width="750" x="35" y="160" /><rect fill="#f5faf7" height="490" rx="14" stroke="#d6e2ee" stroke-width="2" width="350" x="810" y="160" /><path d="M160 365 C168 230 610 215 666 345 C714 480 600 560 410 560 C235 560 137 505 160 365 Z" fill="#fdf0e5" stroke="#b97813" stroke-width="6" /><path d="M195 367 C270 328 302 439 348 380 C399 321 415 465 464 397 C515 331 530 444 621 369" fill="none" stroke="#ecab69" stroke-width="10" /><text fill="#b97813" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="210" y="280">线粒体基质</text><text fill="#b97813" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="450" y="530">线粒体内膜（嵴）</text><rect fill="#e0f0ff" height="88" rx="14" stroke="#d6e2ee" stroke-width="2" width="140" x="57" y="297" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="127" y="332">细胞质基质</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="127" y="365">糖酵解</text><line marker-end="url(#head)" stroke="#2563eb" stroke-linecap="round" stroke-width="4" x1="200" x2="299" y1="338" y2="338" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="207" y="317">丙酮酸</text><rect fill="#f7d8e5" height="75" rx="14" stroke="#d6e2ee" stroke-width="2" width="170" x="335" y="327" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="420" y="361">连接反应</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="420" y="387">+ 三羧酸循环</text><line marker-end="url(#head)" stroke="#2563eb" stroke-linecap="round" stroke-width="4" x1="508" x2="587" y1="371" y2="371" /><rect fill="#cdebd9" height="65" rx="14" stroke="#d6e2ee" stroke-width="2" width="156" x="550" y="392" /><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="628" y="431">电子传递链</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="831" y="231">关键定位</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="276">糖酵解：细胞质基质</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="311">连接反应：线粒体基质</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="346">三羧酸循环：线粒体基质</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="381">电子传递链：内膜</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="416" /><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="451">氧气作为最终电子受体</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="486">参与生成水。</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="521" /><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="556">多数ATP由氧化磷酸化</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="830" y="591">阶段形成（并非全部）。</text></svg>