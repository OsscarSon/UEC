const ul=a=>'<ul>'+a.map(x=>'<li>'+fm(x)+'</li>').join('')+'</ul>',ol=a=>'<ol>'+a.map(x=>'<li>'+fm(x)+'</li>').join('')+'</ol>';
const dt=(t,b,o)=>`<details class="card"${o?' open':''}><summary>${t}</summary><div>${b}</div></details>`,LVC={基础:'#16a34a',中等:'#d97706',困难:'#b91c1c'};
function vLesson(k){const L=LS(k),d=find(k);if(!L||!d)return '<div class="card">这一章的讲解还没写。</div>';const z=zone(d),m=L.method;
let h=`<div class="card"><button data-a="tab" data-k="map">← 课程地图</button><h3 style="margin:10px 0 4px">${SN[d[0]]} 第${d[2]}章 ${esc(d[3])}</h3><div><span class="tag P${d[6][1]}">${d[6]}</span> ${z?`<span class="tag zb">${z}</span>`:''} <span class="tag">纲要 ${esc(L.syl)}</span></div><div class="mu" style="margin-top:6px">${fm(L.status)}</div></div>`;
L.sections.forEach((s,i)=>{h+=dt(`${s.id} ${esc(s.t)} <span class="tag">${esc(s.syl)}</span>`,s.body.map(p=>`<p>${fm(p)}</p>`).join('')+(s.figs?s.figs.map(f=>`<figure style="margin:8px 0"><img src="${f[0]}" alt="" style="width:100%;max-width:440px;display:block;border-radius:10px"><figcaption class="mu">${fm(f[1])}</figcaption></figure>`).join(''):'')+(s.f?'<div class="fm">'+s.f.map(x=>`<div><code>${esc(x)}</code></div>`).join('')+'</div>':'')+(s.terms?`<div class="mu">English：${esc(s.terms)}</div>`:'')+s.tips.map(t=>`<div class="tip"><b>${t[0]}</b> ${fm(t[1])}</div>`).join(''),i===0)});
h+=dt('考试答题方式',`<b>考试格式</b>${ul(m.format)}<b>解题步骤</b>${ol(m.steps)}<b>常见题型</b>${ul(m.types)}<b>答题检查要点（原创建议）</b>${ul(m.score)}`);
h+=dt('例题（含完整步骤）',L.ex.map((e,i)=>`<div style="margin-bottom:12px"><span class="tag">例${i+1} · ${e.lv}</span><p>${fm(e.q)}</p>${ol(e.steps)}<p><b>答：</b>${fm(e.ans)}</p><div class="mu">模拟检查建议（非官方）：${esc(e.pts)}</div></div>`).join(''));
h+=dt('练习与模拟题（基础→困难）',L.pr.map((e,i)=>`<div style="margin-bottom:10px"><span class="tag" style="color:${LVC[e.lv]}">${e.lv}</span> <b>${i+1}.</b> ${fm(e.q)}<details><summary class="mu">看答案与解析</summary><p><b>答：</b>${fm(e.ans)}</p><p>${fm(e.sol)}</p></details></div>`).join('')+'<div class="mu">以上均为原创题，不是历届统考真题。</div>');
h+=dt('视频讲解（待核）','<div class="mu">下面是搜索入口，不是已核对的视频。看完确认内容对得上，再把链接告诉我，我会标成已核对。</div>'+L.vid.map(v=>`<div style="margin-top:6px">${esc(v.t)}：<a href="https://search.bilibili.com/all?keyword=${encodeURIComponent(v.q)}" target="_blank" rel="noopener">B站</a> · <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.q)}" target="_blank" rel="noopener">YouTube</a></div>`).join(''));
h+=`<div class="card">${S.learn[k]?`<span class="mu">已学 ${S.learn[k]}</span>`:`<button data-a="learn" data-k="${k}">今天学完，开始间隔复习</button>`}</div>`;return h}
let tab='today',flt='全部',open='';
const chLine=(s,c)=>{const d=ch(s,c);return d?`<div class="row"><span><span class="dot" style="background:${SC[s]}"></span>第${c}章 ${esc(d[3])}</span><span>${LS(K(d))?`<button data-a="les" data-k="${K(d)}">讲解</button> `:''}${S.learn[K(d)]?`<span class="mu">已学 ${S.learn[K(d)]}</span>`:`<button data-a="learn" data-k="${K(d)}">学完</button>`}</span></div>`:''};
const slot=(id,t,body)=>{const k=today()+id;return `<div class="card ${S.done[k]?'done':''}"><div class="row"><b>${t}</b><button data-a="slot" data-k="${k}">${S.done[k]?'已完成 ✓':'完成'}</button></div>${body}</div>`};
function due(){const t=today(),o=[];for(const k in S.learn)for(const v of IV)if(!(S.rv[k]||[]).includes(v)&&days(S.learn[k],t)>=v)o.push([k,v,days(S.learn[k],t)-v]);return o}
function vToday(){const t=today(),st=S.start||t,n=days(st,t),wd=new Date().getDay();

if(n>27)h+='<div class="card">假期 4 周已结束。第一学期：平日 2 段（旧章节回忆/练题 + 当天课堂整理默写），周末 4–5 段，周日照常混合小卷。</div>';
else{const w=WK[Math.floor(n/7)];
if(n<2)h+='<div class="card"><b>摸底</b><div class="mu">每科从要补的章节各抽 5–8 题，不看书，看哪里薄弱，再调整进度。</div></div>';
if(wd===0)h+='<div class="card"><b>周日：混合小卷 60–90 分钟</b><div class="mu">限时、不看书 → 批改 → 错题写错因（概念/公式/计算/审题）→ 排下一周。不能删。</div></div>';
else{const c=SCH[wd];
[0,1].forEach(i=>{const s=c[i],[cs,nt]=w[s];h+=slot('s'+i,`<img class="sj" src="assets/${IM[s]}.webp" alt=""> 段${i+1} · ${SN[s]} 新内容`,cs.map(x=>chLine(s,x)).join('')+(nt?`<div class="mu">${nt}</div>`:''))});
const s3=c[2];h+=slot('s2','段3 · '+c[3],s3?`<div class="mu">${w[s3][0].map(x=>'第'+x+'章').join('、')} 练 3–5 题，限时</div>`:'<div class="mu">只重做错题本里的题</div>')}}
const d=due();h+=`<div class="card"><b>段4 · 间隔回忆${d.length?'（'+d.length+'）':''}</b>`+(d.length?d.map(([k,v,od])=>{const x=find(k);return `<div style="margin-top:8px"><span class="dot" style="background:${SC[x[0]]}"></span>${SN[x[0]]} 第${x[2]}章 ${esc(x[3])} <span class="mu">第${v}天回忆${od>0?' <span class="wa">逾期'+od+'天</span>':''}</span><div class="row"><span class="mu">合上书默写，做几题</span><button data-a="rv" data-k="${k}" data-v="${v}">回忆完成</button></div></div>`}).join(''):'<div class="mu">今天没有到期的回忆。在上面点“学完”后，第 1/3/7/14/30 天会自动出现。</div>')+'</div>';
return h}
function vMap(){const subs=['全部','物理','化学','生物','数学'];
let h='<div class="row" style="margin-bottom:10px">'+subs.map(s=>`<button class="chip ${flt===s?'on':''}" data-a="flt" data-k="${s}">${SN[s]||s}</button>`).join('')+'</div>';
