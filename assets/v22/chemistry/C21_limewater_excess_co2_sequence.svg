<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc"/><rect x="0" y="0" width="1200" height="104" fill="#163e78"/><text x="40" y="61" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="36" fill="#fff" font-weight="700" text-anchor="start">石灰水通 CO2：沉淀形成与过量再溶解</text><text x="40" y="90" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#deedff" font-weight="400" text-anchor="start">两步反应均守恒 · 适用一般稀澄清石灰水</text><rect x="28" y="140" width="1143" height="414" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/><text x="53" y="185" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">石灰水通入 CO2：先浑浊，过量可澄清</text><rect x="102" y="260" width="295" height="112" rx="18" fill="#eaf2ff" stroke="#c9d9ea" stroke-width="2"/><text x="250" y="324" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#1c4b8f" font-weight="700" text-anchor="middle">Ca(OH)2(aq)</text><rect x="467" y="260" width="295" height="112" rx="18" fill="#fff1ea" stroke="#c9d9ea" stroke-width="2"/><text x="615" y="324" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#c04b4b" font-weight="700" text-anchor="middle">CaCO3(s) ↓</text><rect x="832" y="260" width="295" height="112" rx="18" fill="#eaf8ef" stroke="#c9d9ea" stroke-width="2"/><text x="980" y="324" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#177b5b" font-weight="700" text-anchor="middle">Ca(HCO3)2(aq)</text><line x1="408" y1="318" x2="453" y2="318" stroke="#1c4b8f" stroke-width="5" stroke-linecap="round" /><polygon points="453,318 441.46906600386933,324.00312928203925 441.46906600386933,311.99687071796075" fill="#1c4b8f"/><line x1="773" y1="318" x2="818" y2="318" stroke="#177b5b" stroke-width="5" stroke-linecap="round" /><polygon points="818,318 806.4690660038693,324.00312928203925 806.4690660038693,311.99687071796075" fill="#177b5b"/><text x="415" y="239" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#1c4b8f" font-weight="700" text-anchor="start">少量 CO2</text><text x="772" y="239" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#177b5b" font-weight="700" text-anchor="start">继续通入 CO2</text><text x="600" y="441" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#143156" font-weight="700" text-anchor="middle">Ca(OH)2 + CO2 → CaCO3↓ + H2O</text><text x="600" y="497" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#143156" font-weight="700" text-anchor="middle">CaCO3 + CO2 + H2O → Ca(HCO3)2</text><rect x="42" y="578" width="1115" height="55" rx="12" fill="#fff7e8" stroke="#efd49b" stroke-width="2"/><text x="65" y="612" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#143156" font-weight="400" text-anchor="start">描述适用于一般稀澄清石灰水；不把沉淀再溶解视为生成了新的 Ca 元素。</text><text x="30" y="656" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#55718e" font-weight="400" text-anchor="start">UEC 2027 · 教学概念示意 · 使用前须学科审核</text></svg>