<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620" version="1.1" viewBox="0 0 1000 620" width="1000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="620" width="1000" x="0" y="0" /><rect fill="#173a68" height="76" rx="20" width="956" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="500" y="67">NaCl 型晶体：晶胞内离子计数</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="500" y="119">化学 7.3.1｜立方晶胞的角、面心、棱心与体心共享规则</text><rect fill="#f7fbff" height="350" rx="16" stroke="#bfd4e7" stroke-width="2" width="930" x="35" y="148" /><rect fill="#f8fbff" height="215" rx="16" stroke="#bfd4e7" stroke-width="2" width="242" x="70" y="180" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="88" y="212">Cl-：顶点</text><text fill="#15967a" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="normal" text-anchor="middle" x="191" y="266">8 个位置</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="191" y="331">8 × 1/8 = 1</text><rect fill="#f8fbff" height="215" rx="16" stroke="#bfd4e7" stroke-width="2" width="242" x="382" y="180" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="400" y="212">Cl-：面心</text><text fill="#15967a" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="normal" text-anchor="middle" x="503" y="266">6 个位置</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="503" y="331">6 × 1/2 = 3</text><rect fill="#f8fbff" height="215" rx="16" stroke="#bfd4e7" stroke-width="2" width="242" x="694" y="180" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="712" y="212">Na+：棱心+体心</text><text fill="#8059ac" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="normal" text-anchor="middle" x="815" y="266">13 个位置</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="815" y="331">12 × 1/4 + 1 = 4</text><rect fill="#e9f8f4" height="62" rx="16" stroke="#bfd4e7" stroke-width="2" width="878" x="60" y="418" /><text fill="#15967a" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="82" y="457">每晶胞：Cl- = 4，Na+ = 4，因此化学式比例 Na : Cl = 1 : 1</text><rect fill="#f5f9ff" height="80" rx="16" stroke="#bfd4e7" stroke-width="2" width="930" x="35" y="516" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="58" y="550">共享规则：顶点 1/8，棱心 1/4，面心 1/2，体心 1。</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="58" y="579">提示：这是 NaCl 型常规晶胞的计数，不是局部配位数。</text></svg>