<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="780px" version="1.1" viewBox="0 0 1200 780" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F9FD" height="780" width="1200" x="0" y="0" /><rect fill="#16345a" height="120" rx="26" width="1144" x="28" y="25" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="41" font-weight="700" text-anchor="start" x="65" y="86">Zn 与 Cu²⁺ 的电子转移</text><text fill="#DCEBFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="66" y="120">半反应与总离子方程式 · 电子数守恒</text><rect fill="white" height="560" rx="24" stroke="#D6E0EB" stroke-width="2" width="1140" x="30" y="160" /><rect fill="#F5F9FF" height="390" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="1050" x="74" y="195" /><rect fill="#FFF0F1" height="132" rx="16" stroke="#F4CAD0" stroke-width="1.8" width="440" x="110" y="240" /><text fill="#BE3B51" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" x="130" y="282">氧化（失电子）</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="130" y="339">Zn → Zn²⁺ + 2e⁻</text><rect fill="#ECF7FF" height="132" rx="16" stroke="#B8DFF9" stroke-width="1.8" width="440" x="645" y="240" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" x="665" y="282">还原（得电子）</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="665" y="339">Cu²⁺ + 2e⁻ → Cu</text><line stroke="#CF7415" stroke-linecap="round" stroke-width="6" x1="525" x2="673" y1="428" y2="428" /><polygon fill="#CF7415" points="673,428 661.4690660038693,434.00312928203925 661.4690660038693,421.99687071796075" /><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" x="600" y="402">电子从还原剂转移给氧化剂</text><rect fill="#F2F9F5" height="75" rx="16" stroke="#A8D8BC" stroke-width="1.8" width="940" x="130" y="480" /><text fill="#07966D" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="165" y="531">总离子方程式：Zn + Cu²⁺ → Zn²⁺ + Cu</text><rect fill="#EFF7FF" height="60" rx="16" stroke="#D3E5FB" stroke-width="1.8" width="1070" x="65" y="635" /><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="85" y="660">Zn 是还原剂（自身被氧化）；Cu²⁺ 是氧化剂（自身被还原）。</text></svg>