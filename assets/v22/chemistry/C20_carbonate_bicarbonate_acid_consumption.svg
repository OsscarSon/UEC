<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" width="1100" height="630"><rect width="1100" height="630" fill="#f7faff"/><rect x="20" y="15" width="1060" height="600" rx="22" fill="white" stroke="#d8e5f4" stroke-width="2"/><rect x="25" y="20" width="1050" height="76" rx="17" fill="#173a68"/><text x="55" y="69" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="white">碳酸盐与碳酸氢盐：反应与酸耗量</text><text x="55" y="131" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#576c84">假设加入足量强酸，比较每 1 mol 离子所消耗的 H(+) 与 CO2 生成量</text><rect x="50" y="165" width="485" height="338" rx="16" fill="#f5f9ff" stroke="#d2e2ef" stroke-width="2"/><rect x="565" y="165" width="485" height="338" rx="16" fill="#f5f9ff" stroke="#d2e2ef" stroke-width="2"/><text x="80" y="215" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#126b83">碳酸根 CO3(2-)</text><text x="595" y="215" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#126b83">碳酸氢根 HCO3(-)</text><text x="80" y="273" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#142e50">CO3(2-) + 2H(+)</text><text x="80" y="311" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#16766d">→ CO2↑ + H2O</text><text x="595" y="273" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#142e50">HCO3(-) + H(+)</text><text x="595" y="311" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#16766d">→ CO2↑ + H2O</text><rect x="80" y="355" width="422" height="100" rx="16" fill="#e6f5f0" stroke="#acdfd1" stroke-width="2"/><rect x="595" y="355" width="422" height="100" rx="16" fill="#e6f5f0" stroke="#acdfd1" stroke-width="2"/><text x="106" y="398" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#116655">消耗 H(+)：2 mol</text><text x="106" y="433" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#116655">生成 CO2：1 mol</text><text x="620" y="398" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#116655">消耗 H(+)：1 mol</text><text x="620" y="433" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#116655">生成 CO2：1 mol</text><rect x="50" y="530" width="1000" height="61" rx="16" fill="#eaf3ff" stroke="#cddff3" stroke-width="2"/><text x="75" y="568" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#142e50">比较前提：等物质的量的 CO3(2-) 与 HCO3(-)，强酸足量且反应完全。</text></svg>