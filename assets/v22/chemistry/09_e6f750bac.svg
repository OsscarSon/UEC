<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="780px" version="1.1" viewBox="0 0 1200 780" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F9FD" height="780" width="1200" x="0" y="0" /><rect fill="#16345a" height="120" rx="26" width="1144" x="28" y="25" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="41" font-weight="700" text-anchor="start" x="65" y="86">Al₂O₃ 与 Al(OH)₃ 的两性</text><text fill="#DCEBFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="66" y="120">与酸、强碱均可反应 · 采用高中常见偏铝酸盐简化表达</text><rect fill="white" height="560" rx="24" stroke="#D6E0EB" stroke-width="2" width="1140" x="30" y="160" /><rect fill="#F4F8FF" height="175" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="535" x="73" y="192" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="95" y="237">氧化铝 + 酸</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="93" y="298">Al₂O₃ + 6HCl → 2AlCl₃ + 3H₂O</text><rect fill="#F4F8FF" height="175" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="535" x="634" y="192" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="656" y="237">氧化铝 + 碱</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="654" y="298">Al₂O₃ + 2NaOH → 2NaAlO₂ + H₂O</text><rect fill="#F4F8FF" height="175" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="535" x="73" y="387" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="95" y="432">氢氧化铝 + 酸</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="93" y="493">Al(OH)₃ + 3HCl → AlCl₃ + 3H₂O</text><rect fill="#F4F8FF" height="175" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="535" x="634" y="387" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="656" y="432">氢氧化铝 + 碱</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="654" y="493">Al(OH)₃ + NaOH → NaAlO₂ + 2H₂O</text><rect fill="#EFF7FF" height="60" rx="16" stroke="#D3E5FB" stroke-width="1.8" width="1070" x="65" y="635" /><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="85" y="660">注意：NaAlO₂ 为教学简化表达；水溶液中也常用 [Al(OH)₄]⁻ 表示。</text></svg>