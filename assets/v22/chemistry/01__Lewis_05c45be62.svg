<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="780px" version="1.1" viewBox="0 0 1200 780" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F9FD" height="780" width="1200" x="0" y="0" /><rect fill="#16345a" height="120" rx="26" width="1144" x="28" y="25" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="41" font-weight="700" text-anchor="start" x="65" y="86">水分子的路易斯结构</text><text fill="#DCEBFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="66" y="120">H₂O · 成键电子对、孤电子对及价电子总数</text><rect fill="white" height="560" rx="24" stroke="#D6E0EB" stroke-width="2" width="1140" x="30" y="160" /><rect fill="#F5F9FF" height="415" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="670" x="74" y="185" /><circle cx="400" cy="380" fill="#FEE4E7" r="45" stroke="#BE3B51" stroke-width="2.6" /><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="400" y="389">O</text><circle cx="235" cy="460" fill="#F1F6FC" r="37" stroke="#809AB6" stroke-width="2.6" /><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="235" y="469">H</text><circle cx="565" cy="460" fill="#F1F6FC" r="37" stroke="#809AB6" stroke-width="2.6" /><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="565" y="469">H</text><line stroke="#21354A" stroke-linecap="round" stroke-width="6" x1="272" x2="357" y1="443" y2="400" /><line stroke="#21354A" stroke-linecap="round" stroke-width="6" x1="443" x2="528" y1="400" y2="443" /><circle cx="384" cy="312" fill="#2457F5" r="5" /><circle cx="416" cy="312" fill="#2457F5" r="5" /><circle cx="384" cy="330" fill="#2457F5" r="5" /><circle cx="416" cy="330" fill="#2457F5" r="5" /><rect fill="#F4F8FF" height="265" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="335" x="785" y="190" /><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="805" y="230">价电子：O 为 6 个，H 各 1 个</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="805" y="268">总价电子数：6 + 1 + 1 = 8</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="805" y="306">两个 O—H 单键：4 电子</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="805" y="344">O 上两对孤电子：4 电子</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="805" y="382">氧原子满足八电子规则</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="805" y="420">氢原子各满足二电子规则</text><rect fill="#EFF7FF" height="60" rx="16" stroke="#D3E5FB" stroke-width="1.8" width="1070" x="65" y="635" /><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="85" y="660">连接线代表一对共享电子；氧原子的两对孤电子不参与成键。</text></svg>