<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc" /><rect x="0" y="0" width="1200" height="104" fill="#163e78" /><text x="40" y="61" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="36" fill="#fff" font-weight="700" text-anchor="start">氯气在碱性条件下的歧化反应</text><text x="40" y="90" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#deedff" font-weight="400" text-anchor="start">Cl 的氧化数升降分两条路径</text><rect x="32" y="142" width="1135" height="425" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2" /><text x="57" y="187" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">冷、稀碱条件下氯气歧化</text><rect x="92" y="240" width="270" height="112" rx="18" fill="#eaf2ff" stroke="#c9d9ea" stroke-width="2" /><text x="228" y="298" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="30" fill="#1c4b8f" font-weight="700" text-anchor="middle">Cl2：Cl 为 0</text><rect x="800" y="195" width="280" height="100" rx="18" fill="#e6f6ee" stroke="#c9d9ea" stroke-width="2" /><text x="941" y="255" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#177b5b" font-weight="700" text-anchor="middle">Cl-：Cl 为 −1</text><rect x="800" y="350" width="280" height="100" rx="18" fill="#fff0e8" stroke="#c9d9ea" stroke-width="2" /><text x="941" y="410" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#c04b4b" font-weight="700" text-anchor="middle">ClO-：Cl 为 +1</text><line x1="380" y1="280" x2="755" y2="243" stroke="#177b5b" stroke-width="5" stroke-linecap="round" /><polygon points="755,243 744.1142334980693,250.1063413698924 742.9353404157403,238.15810067061173" fill="#177b5b" /><line x1="380" y1="310" x2="755" y2="387" stroke="#c04b4b" stroke-width="5" stroke-linecap="round" /><polygon points="755,387 742.4972710338423,390.561147062226 744.9121734106061,378.8002588637008" fill="#c04b4b" /><text x="574" y="228" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#177b5b" font-weight="700" text-anchor="middle">得电子 · 还原</text><text x="593" y="402" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#c04b4b" font-weight="700" text-anchor="middle">失电子 · 氧化</text><text x="582" y="495" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#143156" font-weight="700" text-anchor="middle">Cl2 + 2OH- → Cl- + ClO- + H2O</text><rect x="64" y="582" width="1068" height="50" rx="12" fill="#eaf2fc" stroke="#b6d1ee" stroke-width="2" /><text x="85" y="614" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#1c4b8f" font-weight="400" text-anchor="start">同种元素的一部分原子氧化，另一部分还原；总电子得失相等。</text><text x="30" y="656" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#55718e" font-weight="400" text-anchor="start">UEC 2027 · 教学概念示意 · 使用前须学科审核</text></svg>