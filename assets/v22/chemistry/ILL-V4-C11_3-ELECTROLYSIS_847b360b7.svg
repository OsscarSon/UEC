<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="740px" version="1.1" viewBox="0 0 1200 740" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f8fbff" height="740" width="1200" x="0" y="0" /><rect fill="#102d55" height="105" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="41" font-weight="bold" text-anchor="start" x="46" y="65">铝的电解冶炼：物质与电荷的方向</text><text fill="#cfdef4" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="47" y="94">化学 11.3 · Hall–Héroult 工艺的原理示意</text><rect fill="white" height="582" rx="16" stroke="#cfdef0" stroke-width="2" width="1146" x="27" y="124" /><rect fill="#eff7ff" height="82" rx="16" stroke="#1c68c8" stroke-width="2" width="478" x="93" y="177" /><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="332.0" y="226.0">阴极（负极）：Al(3+) 得电子</text><rect fill="#fff6ee" height="82" rx="16" stroke="#bd5c18" stroke-width="2" width="478" x="628" y="177" /><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="867.0" y="226.0">碳阳极（正极）：氧化反应</text><rect fill="#eff7ff" height="91" rx="16" stroke="#1c68c8" stroke-width="2" width="479" x="92" y="300" /><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="331.5" y="353.5">Al(3+) + 3e(-) → Al(l)</text><rect fill="#fff6ee" height="91" rx="16" stroke="#bd5c18" stroke-width="2" width="479" x="628" y="300" /><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="867.5" y="353.5">碳阳极逐渐消耗，生成 CO2</text><rect fill="#fff4dc" height="124" rx="14" stroke="#c59b50" stroke-width="2" width="840" x="180" y="427" /><rect fill="#fffaf0" height="87" rx="16" stroke="#744aa7" stroke-width="2" width="649" x="275" y="441" /><text fill="#744aa7" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="599.5" y="477.0">熔融氧化铝溶于冰晶石体系</text><text fill="#744aa7" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="599.5" y="508.0">降低操作温度，提供离子导电介质</text><rect fill="#f0faf5" height="53" rx="16" stroke="#157c64" stroke-width="2" width="659" x="270" y="572" /><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="599.5" y="606.5">总体简化式：2Al2O3 + 3C → 4Al + 3CO2</text><rect fill="#eef5ff" height="54" rx="12" width="1104" x="48" y="637" /><text fill="#102d55" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="68" y="671">工艺概览不按实际槽体比例；阳极实际产物可含 CO，方程式为常见理想化总式。</text></svg>