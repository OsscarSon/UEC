<svg baseProfile="full" height="780px" version="1.1" viewBox="0 0 1200 780" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F9FD" height="780" width="1200" x="0" y="0" /><rect fill="#16345a" height="120" rx="26" width="1144" x="28" y="25" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="41" font-weight="700" text-anchor="start" x="65" y="86">限量反应物：从粒子数理解</text><text fill="#DCEBFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="66" y="120">例：2 H₂ + O₂ → 2 H₂O · 假设起始 5 H₂ 和 2 O₂</text><rect fill="white" height="560" rx="24" stroke="#D6E0EB" stroke-width="2" width="1140" x="30" y="160" /><rect fill="#F5F9FF" height="390" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="1050" x="74" y="195" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="120" y="257">反应前</text><circle cx="130" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="151" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="235" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="256" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="340" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="361" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="445" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="466" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="550" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="571" cy="324" fill="#F0F8FF" r="13" stroke="#7B97B8" stroke-width="2" /><circle cx="145" cy="407" fill="#FFE6EA" r="17" stroke="#BE3B51" stroke-width="2" 