<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="780px" version="1.1" viewBox="0 0 1200 780" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F9FD" height="780" width="1200" x="0" y="0" /><rect fill="#16345a" height="120" rx="26" width="1144" x="28" y="25" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="41" font-weight="700" text-anchor="start" x="65" y="86">镁与钙：与水反应的差别</text><text fill="#DCEBFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="66" y="120">第 2 族 · 反应条件、产物和化学方程式</text><rect fill="white" height="560" rx="24" stroke="#D6E0EB" stroke-width="2" width="1140" x="30" y="160" /><rect fill="#F4F8FF" height="375" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="525" x="74" y="202" /><circle cx="158" cy="302" fill="#F9EAD4" r="54" stroke="#C78B34" stroke-width="2.6" /><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="158" y="311">Mg</text><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="31" font-weight="700" text-anchor="start" x="232" y="307">镁 Mg</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="22" font-weight="600" text-anchor="start" x="99" y="427">Mg + H₂O(g) → MgO + H₂↑</text><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="99" y="502">冷水反应极慢；与水蒸气加热反应</text><rect fill="#F4F8FF" height="375" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="525" x="632" y="202" /><circle cx="716" cy="302" fill="#F9EAD4" r="54" stroke="#C78B34" stroke-width="2.6" /><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="716" y="311">Ca</text><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="31" font-weight="700" text-anchor="start" x="790" y="307">钙 Ca</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="22" font-weight="600" text-anchor="start" x="657" y="427">Ca + 2H₂O → Ca(OH)₂ + H₂↑</text><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="657" y="502">与冷水反应，生成氢氧化钙及氢气</text><rect fill="#EFF7FF" height="60" rx="16" stroke="#D3E5FB" stroke-width="1.8" width="1070" x="65" y="635" /><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="85" y="660">镁与水蒸气的反应条件不可直接写成与冷水相同。</text></svg>