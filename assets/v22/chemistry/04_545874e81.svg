<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="780px" version="1.1" viewBox="0 0 1200 780" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F9FD" height="780" width="1200" x="0" y="0" /><rect fill="#16345a" height="120" rx="26" width="1144" x="28" y="25" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="41" font-weight="700" text-anchor="start" x="65" y="86">氧化数计算的代数方法</text><text fill="#DCEBFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="66" y="120">H₂SO₄、KMnO₄、NH₄⁺、H₂O₂ · 有序判断</text><rect fill="white" height="560" rx="24" stroke="#D6E0EB" stroke-width="2" width="1140" x="30" y="160" /><rect fill="#F4F8FF" height="180" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="526" x="73" y="193" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="93" y="236">H₂SO₄</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="93" y="287">2(+1) + x + 4(-2) = 0</text><text fill="#07966D" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="93" y="338">S = +6</text><rect fill="#F4F8FF" height="180" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="526" x="633" y="193" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="653" y="236">KMnO₄</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="653" y="287">(+1) + x + 4(-2) = 0</text><text fill="#07966D" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="653" y="338">Mn = +7</text><rect fill="#F4F8FF" height="180" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="526" x="73" y="393" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="93" y="436">NH₄⁺</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="93" y="487">x + 4(+1) = +1</text><text fill="#07966D" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="93" y="538">N = -3</text><rect fill="#F4F8FF" height="180" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="526" x="633" y="393" /><text fill="#2457F5" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="653" y="436">H₂O₂</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="653" y="487">2(+1) + 2x = 0</text><text fill="#07966D" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="653" y="538">O = -1</text><rect fill="#EFF7FF" height="60" rx="16" stroke="#D3E5FB" stroke-width="1.8" width="1070" x="65" y="635" /><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="85" y="660">中性化合物氧化数代数和为 0；多原子离子代数和等于离子电荷。</text></svg>