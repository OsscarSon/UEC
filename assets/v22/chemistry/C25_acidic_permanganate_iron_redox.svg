<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620" version="1.1" viewBox="0 0 1000 620" width="1000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="620" width="1000" x="0" y="0" /><rect fill="#173a68" height="76" rx="20" width="956" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="500" y="67">离子—电子法：酸性高锰酸根与亚铁离子</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="500" y="119">化学 8.4.2｜先分别配平两个半反应，再按电子守恒相加</text><rect fill="#f7fbff" height="352" rx="16" stroke="#bfd4e7" stroke-width="2" width="930" x="35" y="145" /><rect fill="#eef7ff" height="105" rx="16" stroke="#bfd4e7" stroke-width="2" width="868" x="65" y="180" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="83" y="212">还原半反应</text><text fill="#2673ba" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="26" font-weight="normal" text-anchor="start" x="92" y="260">MnO4- + 8H+ + 5e- → Mn2+ + 4H2O</text><rect fill="#f1faf6" height="104" rx="16" stroke="#bfd4e7" stroke-width="2" width="868" x="65" y="301" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="83" y="333">氧化半反应 × 5</text><text fill="#15967a" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="27" font-weight="normal" text-anchor="start" x="92" y="384">5Fe2+ → 5Fe3+ + 5e-</text><rect fill="#fff8eb" height="68" rx="16" stroke="#bfd4e7" stroke-width="2" width="928" x="36" y="430" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="normal" text-anchor="start" x="56" y="473">合并：MnO4- + 8H+ + 5Fe2+ → Mn2+ + 4H2O + 5Fe3+</text><rect fill="#f1f8ff" height="81" rx="16" stroke="#bfd4e7" stroke-width="2" width="928" x="36" y="514" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="60" y="550">核对：Mn = 1、Fe = 5、O = 4、H = 8；左右总电荷均为 +17。</text><text fill="#607389" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="60" y="579">限定条件：酸性溶液；碱性条件下不能照搬此半反应。</text></svg>