<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="780px" version="1.1" viewBox="0 0 1200 780" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F9FD" height="780" width="1200" x="0" y="0" /><rect fill="#16345a" height="120" rx="26" width="1144" x="28" y="25" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="41" font-weight="700" text-anchor="start" x="65" y="86">钠与钾：同族递变规律</text><text fill="#DCEBFF" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="66" y="120">第 1 族 · 从 Na 向下到 K，半径与第一电离能变化</text><rect fill="white" height="560" rx="24" stroke="#D6E0EB" stroke-width="2" width="1140" x="30" y="160" /><rect fill="#F5F9FF" height="360" rx="16" stroke="#B4CAE5" stroke-width="1.8" width="1035" x="80" y="190" /><circle cx="290" cy="380" fill="#EEEAFF" r="65" stroke="#856BD0" stroke-width="2.6" /><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="290" y="389">Na</text><circle cx="900" cy="380" fill="#EAF3FF" r="91" stroke="#2457F5" stroke-width="2.6" /><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="900" y="389">K</text><line stroke="#CF7415" stroke-linecap="round" stroke-width="8" x1="407" x2="750" y1="370" y2="370" /><polygon fill="#CF7415" points="750,370 738.4690660038693,376.00312928203925 738.4690660038693,363.99687071796075" /><text fill="#CF7415" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="31" font-weight="700" text-anchor="middle" x="573" y="325">同族向下</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="24" font-weight="600" text-anchor="middle" x="580" y="425">原子半径增大</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="24" font-weight="600" text-anchor="middle" x="580" y="464">第一电离能减小</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="24" font-weight="600" text-anchor="middle" x="580" y="503">失去最外层电子更容易</text><text fill="#21354A" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="24" font-weight="600" text-anchor="middle" x="580" y="542">与水反应一般更剧烈</text><rect fill="#EFF8F3" height="80" rx="16" stroke="#A8D5BD" stroke-width="1.8" width="1000" x="100" y="578" /><text fill="#07966D" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" x="150" y="625">Na：2,8,1     →     K：2,8,8,1</text><rect fill="#EFF7FF" height="60" rx="16" stroke="#D3E5FB" stroke-width="1.8" width="1070" x="65" y="635" /><text fill="#5D6B7C" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="85" y="660">同族趋势适用于比较一般化学活泼性；实际反应还受条件影响。</text></svg>