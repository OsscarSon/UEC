<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc"/><rect x="0" y="0" width="1200" height="104" fill="#163e78"/><text x="40" y="61" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="36" fill="#fff" font-weight="700" text-anchor="start">还原剂与氧化剂：锌铜电子转移</text><text x="40" y="90" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#deedff" font-weight="400" text-anchor="start">电子数守恒 · 不要混淆试剂与产物</text><rect x="35" y="140" width="545" height="400" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/><text x="60" y="185" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">还原剂：Zn</text><rect x="620" y="140" width="545" height="400" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/><text x="645" y="185" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">氧化剂：Cu2+</text><circle cx="300" cy="300" r="70" fill="#e6eefc" stroke="#1c4b8f" stroke-width="3"/><text x="300" y="311" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="39" fill="#1c4b8f" font-weight="700" text-anchor="middle">Zn</text><circle cx="890" cy="300" r="70" fill="#e3f4eb" stroke="#1c4b8f" stroke-width="3"/><text x="890" y="311" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="35" fill="#177b5b" font-weight="700" text-anchor="middle">Cu2+</text><line x1="410" y1="300" x2="770" y2="300" stroke="#f3a12b" stroke-width="7" stroke-linecap="round" /><polygon points="770,300 758.4690660038693,306.00312928203925 758.4690660038693,293.99687071796075" fill="#f3a12b"/><text x="590" y="277" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="26" fill="#143156" font-weight="700" text-anchor="middle">2e- 转移</text><text x="300" y="422" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#c04b4b" font-weight="700" text-anchor="middle">Zn → Zn2+ + 2e-</text><text x="890" y="422" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" fill="#177b5b" font-weight="700" text-anchor="middle">Cu2+ + 2e- → Cu</text><rect x="47" y="565" width="1115" height="65" rx="14" fill="#fff4e7" stroke="#e9d4b7" stroke-width="2"/><text x="80" y="605" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#143156" font-weight="400" text-anchor="start">还原剂自身被氧化；氧化剂自身被还原。总反应：Zn + Cu2+ → Zn2+ + Cu</text><text x="30" y="656" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#55718e" font-weight="400" text-anchor="start">UEC 2027 · 教学概念示意 · 使用前须学科审核</text></svg>