<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc" /><rect x="0" y="0" width="1200" height="104" fill="#163e78" /><text x="40" y="61" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="36" fill="#fff" font-weight="700" text-anchor="start">水分子间氢键：供体与受体</text><text x="40" y="90" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#deedff" font-weight="400" text-anchor="start">概念图；键角与距离非按比例绘制</text><rect x="35" y="140" width="1130" height="410" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2" /><text x="60" y="185" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">两个水分子之间的 O—H···O 氢键</text><text x="155" y="500" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#1c4b8f" font-weight="700" text-anchor="start">供体：O—H</text><text x="727" y="500" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#1c4b8f" font-weight="700" text-anchor="start">受体：另一分子的 O</text><rect x="55" y="571" width="1088" height="54" rx="12" fill="#fff5e6" stroke="#f1d59d" stroke-width="2" /><text x="80" y="606" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#143156" font-weight="400" text-anchor="start">共价键以实线表示；氢键以虚线表示。沸腾不意味着断裂分子内 O—H 共价键。</text><text x="30" y="656" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#55718e" font-weight="400" text-anchor="start">UEC 2027 · 教学概念示意 · 使用前须学科审核</text><line x1="320" y1="320" x2="420" y2="320" stroke="#405e81" stroke-width="5" /><line x1="320" y1="320" x2="294.9619995945559" y2="416.8147640378108" stroke="#405e81" stroke-width="5" /><line x1="775" y1="320" x2="836.2217280034449" y2="240.93104262561567" stroke="#405e81" stroke-width="5" /><line x1="775" y1="320" x2="836.2217280034449" y2="399.068