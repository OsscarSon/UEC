<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc"/><rect x="0" y="0" width="1200" height="104" fill="#163e78"/><text x="40" y="61" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="36" fill="#fff" font-weight="700" text-anchor="start">伦敦色散力：瞬时偶极与诱导偶极</text><text x="40" y="90" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#deedff" font-weight="400" text-anchor="start">示意模型，电荷偏移不是独立离子</text><rect x="35" y="140" width="540" height="410" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/><text x="60" y="185" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">瞬时偶极 → 诱导偶极</text><rect x="625" y="140" width="540" height="410" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/><text x="650" y="185" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">伦敦色散力的关键点</text><circle cx="160" cy="316" r="47" fill="#fce6de" stroke="#1c4b8f" stroke-width="3"/><text x="160" y="323" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#143156" font-weight="700" text-anchor="middle">δ+</text><circle cx="260" cy="316" r="47" fill="#dbeafe" stroke="#1c4b8f" stroke-width="3"/><text x="260" y="323" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#143156" font-weight="700" text-anchor="middle">δ−</text><circle cx="395" cy="316" r="47" fill="#fce6de" stroke="#1c4b8f" stroke-width="3"/><text x="395" y="323" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#143156" font-weight="700" text-anchor="middle">δ+</text><circle cx="495" cy="316" r="47" fill="#dbeafe" stroke="#1c4b8f" stroke-width="3"/><text x="495" y="323" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#143156" font-weight="700" text-anchor="middle">δ−</text><line x1="308" y1="316" x2="345" y2="316" stroke="#9a83d7" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 7"/><text x="300" y="384" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#1c4b8f" font-weight="700" text-anchor="middle">瞬时电荷分布波动</text><text x="895" y="230" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#143156" font-weight="400" text-anchor="start">• 非极性粒子也有色散力</text><text x="895" y="292" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#143156" font-weight="400" text-anchor="start">• 极化率越大，常越显著</text><text x="895" y="354" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" fill="#143156" font-weight="400" text-anchor="start">• 不是永久偶极—偶极作用</text><text x="895" y="421" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#143156" font-weight="400" text-anchor="start">• 凝聚态性质还受形状影响</text><rect x="70" y="572" width="1060" height="56" rx="14" fill="#e7f4ed" stroke="#b5dfc5" stroke-width="2"/><text x="92" y="610" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#177b5b" font-weight="400" text-anchor="start">注意：这里只表示电子密度变化，不表示电子整颗转移或形成新共价键。</text><text x="30" y="656" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#55718e" font-weight="400" text-anchor="start">UEC 2027 · 教学概念示意 · 使用前须学科审核</text></svg>