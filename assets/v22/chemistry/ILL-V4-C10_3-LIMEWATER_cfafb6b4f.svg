<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="740px" version="1.1" viewBox="0 0 1200 740" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f8fbff" height="740" width="1200" x="0" y="0" /><rect fill="#102d55" height="105" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="41" font-weight="bold" text-anchor="start" x="46" y="65">石灰水与过量 CO2：先浑浊后澄清</text><text fill="#cfdef4" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="47" y="94">化学 10.3 · 碳酸钙沉淀与碳酸氢钙生成</text><rect fill="white" height="582" rx="16" stroke="#cfdef0" stroke-width="2" width="1146" x="27" y="124" /><rect fill="#eef6ff" height="100" rx="16" stroke="#1c68c8" stroke-width="2" width="315" x="71" y="183" /><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="228.5" y="225.5">澄清石灰水</text><text fill="#1c68c8" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="228.5" y="256.5">Ca(OH)2(aq)</text><rect fill="#fff8ef" height="100" rx="16" stroke="#bd5c18" stroke-width="2" width="314" x="447" y="183" /><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="604.0" y="225.5">通入少量 CO2</text><text fill="#bd5c18" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="604.0" y="256.5">生成 CaCO3(s) ↓</text><rect fill="#effaf2" height="100" rx="16" stroke="#157c64" stroke-width="2" width="314" x="817" y="183" /><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="974.0" y="225.5">继续通入过量 CO2</text><text fill="#157c64" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="974.0" y="256.5">生成 Ca(HCO3)2(aq)</text><line stroke="#1c68c8" stroke-width="4" x1="392" x2="437" y1="232" y2="232" /><polygon fill="#1c68c8" points="437,232 422.39057695500304,238.52416724895312 422.39057695500304,225.47583275104688" /><line stroke="#1c68c8" stroke-width="4" x1="767" x2="808" y1="232" y2="232" /><polygon fill="#1c68c8" points="808,232 793.3905769550031,238.52416724895312 793.3905769550031,225.47583275104688" /><rect fill="none" height="175" rx="13" stroke="#102d55" stroke-width="5" width="170" x="170" y="350" /><rect fill="#b7e0fa" height="86" opacity="0.5" rx="2" width="146" x="182" y="428" /><rect fill="none" height="175" rx="13" stroke="#102d55" stroke-width="5" width="170" x="544" y="350" /><rect fill="#b7e0fa" height="86" opacity="0.5" rx="2" width="146" x="556" y="428" /><circle cx="565" cy="446" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="594" cy="465" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="623" cy="484" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="652" cy="450" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="681" cy="469" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="583" cy="488" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="612" cy="454" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="641" cy="473" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="670" cy="492" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="572" cy="458" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="601" cy="477" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="630" cy="496" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="659" cy="462" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="688" cy="481" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><circle cx="590" cy="447" fill="#f8fafb" r="3" stroke="#102d55" stroke-width="2" /><rect fill="none" height="175" rx="13" stroke="#102d55" stroke-width="5" width="170" x="912" y="350" /><rect fill="#b7e0fa" height="86" opacity="0.5" rx="2" width="146" x="924" y="428" /><rect fill="#f8f5ff" height="60" rx="16" stroke="#744aa7" stroke-width="2" width="1020" x="90" y="556" /><text fill="#744aa7" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="600.0" y="594.0">Ca(OH)2 + CO2 → CaCO3↓ + H2O       CaCO3 + CO2 + H2O → Ca(HCO3)2</text><rect fill="#eef5ff" height="54" rx="12" width="1104" x="48" y="637" /><text fill="#102d55" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="68" y="671">澄清—浑浊—澄清仅在适当浓度与反应条件下；不应假设任意 CO2 通量都会瞬时完成。</text></svg>