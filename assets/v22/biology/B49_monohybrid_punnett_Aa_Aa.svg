  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="676">此示例不能直接套用于不完全显性、共显性、多基因或连锁等情况。</text>
