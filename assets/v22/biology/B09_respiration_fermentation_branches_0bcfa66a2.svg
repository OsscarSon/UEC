<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100"><defs /><rect fill="#f6f9fe" height="700" rx="0" stroke="#f6f9fe" stroke-width="1.5" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#d8e4f0" stroke-width="1.5" width="1064" x="18" y="18" /><rect fill="#193452" height="97" rx="20" stroke="#193452" stroke-width="1.5" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="29" font-weight="700" x="47" y="77">丙酮酸后续途径：有氧呼吸与发酵</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="46" y="149">糖酵解在细胞质基质发生，产生丙酮酸并净生成 ATP</text><rect fill="#e7f0ff" height="103" rx="15" stroke="#bad3ed" stroke-width="1.5" width="410" x="345" y="195" /><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="550" y="252">葡萄糖 → 糖酵解 → 丙酮酸</text><line stroke="#2064c8" stroke-width="5" x1="445" x2="278" y1="300" y2="350" /><polygon fill="#2064c8" points="278,350 286.85427732503604,341.90050785225685 289.848457200719,351.90106863703807" /><line stroke="#7155bb" stroke-width="5" x1="650" x2="811" y1="300" y2="350" /><polygon fill="#7155bb" points="811,350 799.1327539172224,351.7800197782051 802.2288641470873,341.8105448380402" /><rect fill="#eff9f1" height="213" rx="15" stroke="#c7e6ce" stroke-width="1.5" width="430" x="65" y="361" /><rect fill="#f5f0ff" height="213" rx="15" stroke="#e1d5fb" stroke-width="1.5" width="429" x="604" y="361" /><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="700" x="97" y="412">有氧路径（真核细胞）</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="89" y="463">丙酮酸氧化 → 柠檬酸循环</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="88" y="512">电子传递链：O₂为最终电子受体</text><text fill="#7155bb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="700" x="641" y="412">缺氧条件下：发酵</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="19" font-weight="400" x="636" y="460">乳酸发酵 / 酒精发酵</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="636" y="508">目的之一：再生 NAD⁺</text><rect fill="#edf6ff" height="47" rx="9" stroke="#dce8f4" stroke-width="1.5" width="1010" x="45" y="617" /><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">发酵本身不额外产生 ATP；发酵相关净 ATP 来自前面的糖酵解。</text></svg>