<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="bold" x="50" y="66">人体双循环：肺循环与体循环</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="48" y="126">箭头表示血液流向；红/蓝仅示意富氧与较低氧含量的血液</text><rect fill="#f3faff" height="342" rx="15" stroke="#dae6f5" stroke-width="1.5" width="422" x="46" y="155" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="64" y="187">肺循环（右心室 → 肺 → 左心房）</text><rect fill="#fff7f3" height="342" rx="15" stroke="#dae6f5" stroke-width="1.5" width="418" x="492" y="155" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="510" y="187">体循环（左心室 → 全身 → 右心房）</text><rect fill="#2563eb" height="63" opacity="0.13" rx="18" stroke="#2563eb" stroke-width="2" width="124" x="96" y="252" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="159" y="290">右心室</text><rect fill="#0f766e" height="63" opacity="0.13" rx="18" stroke="#0f766e" stroke-width="2" width="124" x="309" y="252" /><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="372" y="290">肺</text><rect fill="#dc4b4b" height="63" opacity="0.13" rx="18" stroke="#dc4b4b" stroke-width="2" width="124" x="96" y="378" /><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="159" y="416">左心房</text><rect fill="#dc4b4b" height="63" opacity="0.13" rx="18" stroke="#dc4b4b" stroke-width="2" width="124" x="550" y="252" /><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="613" y="290">左心室</text><rect fill="#8055c8" height="63" opacity="0.13" rx="18" stroke="#8055c8" stroke-width="2" width="124" x="764" y="252" /><text fill="#8055c8" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="827" y="290">全身组织</text><rect fill="#2563eb" height="63" opacity="0.13" rx="18" stroke="#2563eb" stroke-width="2" width="124" x="550" y="378" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="613" y="416">右心房</text><line stroke="#2563eb" stroke-linecap="round" stroke-width="3" x1="220" x2="310" y1="282" y2="282" /><polygon fill="#2563eb" points="310,282 298.3513175321682,287.77132539055174 298.3513175321682,276.22867460944826" /><line stroke="#dc4b4b" stroke-linecap="round" stroke-width="3" x1="391" x2="391" y1="315" y2="397" /><polygon fill="#dc4b4b" points="391,397 385.22867460944826,385.3513175321682 396.77132539055174,385.3513175321682" /><line stroke="#dc4b4b" stroke-linecap="round" stroke-width="3" x1="373" x2="220" y1="410" y2="410" /><polygon fill="#dc4b4b" points="220,410 231.64868246783183,404.22867460944826 231.64868246783183,415.77132539055174" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="233" y="269">肺动脉</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="285" y="397">肺静脉</text><line stroke="#dc4b4b" stroke-linecap="round" stroke-width="3" x1="674" x2="765" y1="282" y2="282" /><polygon fill="#dc4b4b" points="765,282 753.3513175321682,287.77132539055174 753.3513175321682,276.22867460944826" /><line stroke="#2563eb" stroke-linecap="round" stroke-width="3" x1="852" x2="852" y1="317" y2="396" /><polygon fill="#2563eb" points="852,396 846.2286746094483,384.3513175321682 857.7713253905517,384.3513175321682" /><line stroke="#2563eb" stroke-linecap="round" stroke-width="3" x1="833" x2="674" y1="410" y2="410" /><polygon fill="#2563eb" points="674,410 685.6486824678318,404.22867460944826 685.6486824678318,415.77132539055174" /><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="683" y="269">主动脉</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="709" y="399">腔静脉</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="87" y="475">肺部进行 O2 和 CO2 交换</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="547" y="475">组织处进行物质交换</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">右心泵向肺；左心泵向全身。肺动脉含氧较低、肺静脉含氧较高。</text></svg>