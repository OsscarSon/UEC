<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="bold" x="50" y="67">植物蒸腾作用：水分运输的路径</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" x="48" y="126">简化的土壤→根→茎→叶→空气过程；仅展示主要过程</text><rect fill="#f4f8ff" height="338" rx="15" stroke="#dae6f5" stroke-width="1.5" width="868" x="44" y="154" /><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="62" y="186">水分路径与驱动力</text><rect fill="#dd8c35" height="124" opacity="0.1" rx="18" stroke="#dd8c35" stroke-width="2" width="128" x="87" y="257" /><text fill="#dd8c35" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="151.0" y="326">土壤与根</text><rect fill="#2563eb" height="124" opacity="0.1" rx="18" stroke="#2563eb" stroke-width="2" width="128" x="298" y="257" /><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="362.0" y="326">木质部</text><rect fill="#0f766e" height="124" opacity="0.1" rx="18" stroke="#0f766e" stroke-width="2" width="128" x="511" y="257" /><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="575.0" y="326">叶片</text><rect fill="#8055c8" height="124" opacity="0.1" rx="18" stroke="#8055c8" stroke-width="2" width="125" x="725" y="257" /><text fill="#8055c8" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="787.5" y="326">大气</text><line stroke="#2563eb" stroke-linecap="round" stroke-width="4" x1="219" x2="294" y1="319" y2="319" /><polygon fill="#2563eb" points="294,319 284.3465918192059,324.2736809246462 284.3465918192059,313.7263190753538" /><line stroke="#2563eb" stroke-linecap="round" stroke-width="4" x1="431" x2="506" y1="319" y2="319" /><polygon fill="#2563eb" points="506,319 496.3465918192059,324.2736809246462 496.3465918192059,313.7263190753538" /><line stroke="#2563eb" stroke-linecap="round" stroke-width="4" x1="645" x2="719" y1="319" y2="319" /><polygon fill="#2563eb" points="719,319 709.3465918192059,324.2736809246462 709.3465918192059,313.7263190753538" /><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="359" y="234">蒸腾拉力</text><text fill="#8055c8" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="737" y="234">经气孔扩散</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="77" y="424">根系吸水</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="300" y="424">内聚力与附着力</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="517" y="424">叶肉细胞壁蒸发</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="733" y="424">湿度梯度</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">蒸腾拉力是水分上升的重要驱动力；气孔开闭、湿度、温度、风速会影响蒸腾。</text></svg>