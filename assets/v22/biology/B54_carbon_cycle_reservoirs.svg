ght="normal" text-anchor="start" x="695" y="286">分解呼吸</text><rect fill="#fff1de" height="39" rx="12" stroke="#edb86a" width="263" x="350" y="436" /><text fill="#ee9444" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="367" y="460">化石燃料燃烧 → CO2</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">重点：碳可在生物群落与非生物环境之间循环；能量则单向流动并逐级耗散。</text></svg>