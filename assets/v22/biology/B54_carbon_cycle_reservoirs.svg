<svg baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="bold" x="50" y="66">生态系统碳循环：碳库与主要过程</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="48" y="126">箭头代表碳的流动，并不表示所有过程发生速率相同</text><rect fill="#f4f8ff" height="333" rx="15" stroke="#dae6f5" stroke-width="1.5" width="865" x="45" y="156" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="188">碳储存与交换</text><rect fill="#2563eb" height="62" opacity="0.12" rx="15" stroke="#2563eb" stroke-width="2" width="220" x="360" y="198" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="470.0" y="236">大气 CO2</text><rect fill="#0f766e" height="65" opacity="0.12" rx="15" stroke="#0f766e" stroke-width="2" width="220" x="87" y="346" /><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="197.0" y="384">生产者（植物）</text><rect fill="#ee9444" height="65" opacity="0.12" rx="15" stroke="#ee9444" stroke-width="2" width="202" x="379" y="346" /><text fill="#ee9444" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="480.0" y="384">消费者</text><rect fill="#8055c8" height="65" opacity="0.12" rx="15" stroke="#8055c8" stroke-width="2" width="200" x="672" y="346" /><text fill=