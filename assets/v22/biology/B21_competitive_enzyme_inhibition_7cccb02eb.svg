<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="head" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L9 5 L0 10Z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="89" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="700" text-anchor="start" x="45" y="57">竞争性抑制：底物与抑制剂竞争活性位点</text><text fill="#52677c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="45" y="123">概念示意：竞争性抑制通常增加表观 Kₘ，理想可逆情况下 Vmax 保持不变</text><rect fill="#f7faff" height="490" rx="14" stroke="#d6e2ee" stroke-width="2" width="735" x="35" y="160" /><rect fill="#f5faf7" height="490" rx="14" stroke="#d6e2ee" stroke-width="2" width="350" x="800" y="160" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="135" y="222">无抑制剂</text><path d="M170 390 L170 315 L215 315 L215 356 L253 356 L253 315 L301 315 L301 390 Z" fill="#c5e2fc" stroke="#2563eb" stroke-width="3" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="230" y="437">酶活性位点</text><circle cx="230" cy="290" fill="#59b89c" r="22" stroke="none" stroke-width="2" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="230" y="300">S</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="175" y="501">底物可与酶结合</text><text fill="#cf4556" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="510" y="222">存在竞争性抑制剂</text><path d="M545 390 L545 315 L590 315 L590 356 L628 356 L628 315 L676 315 L676 390 Z" fill="#c5e2fc" stroke="#2563eb" stroke-width="3" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="605" y="437">酶活性位点</text><circle cx="605" cy="290" fill="#59b89c" r="22" stroke="none" stroke-width="2" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="605" y="300">S</text><circle cx="605" cy="342" fill="#e89094" r="18" stroke="none" stroke-width="2" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="605" y="349">I</text><text fill="#cf4556" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="550" y="501">抑制剂占据活性位点</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="819" y="231">动力学结论</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="822" y="275">竞争性抑制剂与底物</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="822" y="314">争夺同一活性位点。</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="822" y="353" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="822" y="392">可逆竞争性抑制模型：</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="822" y="431">Vmax 不变</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="822" y="470">表观 Kₘ 增大</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="822" y="509" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="822" y="548">提高底物浓度可以</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="822" y="587">减弱抑制效果。</text></svg>