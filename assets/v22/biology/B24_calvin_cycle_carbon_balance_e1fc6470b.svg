<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="head" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L9 5 L0 10Z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="89" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="700" text-anchor="start" x="45" y="57">卡尔文循环：固定3个CO₂的碳数核算</text><text fill="#52677c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="45" y="123">生物 3.6：净输出1个 G3P(3C)，其余5个 G3P 再生3个 RuBP</text><rect fill="#f7faff" height="490" rx="14" stroke="#d6e2ee" stroke-width="2" width="1125" x="35" y="160" /><rect fill="#deebff" height="110" rx="14" stroke="#d6e2ee" stroke-width="2" width="260" x="75" y="265" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="205.0" y="315">3 CO₂ + 3 RuBP</text><rect fill="#f9e4cc" height="110" rx="14" stroke="#d6e2ee" stroke-width="2" width="260" x="470" y="265" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="600.0" y="315">6 PGA（每个3C）</text><rect fill="#e7ddff" height="110" rx="14" stroke="#d6e2ee" stroke-width="2" width="260" x="830" y="265" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="960.0" y="315">6 G3P（每个3C）</text><line marker-end="url(#head)" stroke="#2563eb" stroke-linecap="round" stroke-width="4" x1="337" x2="460" y1="317" y2="317" /><line marker-end="url(#head)" stroke="#2563eb" stroke-linecap="round" stroke-width="4" x1="734" x2="822" y1="317" y2="317" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="400" y="287">固定</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="780" y="286">还原</text><text fill="#7750b0" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="610" y="404">还原阶段需 6 ATP 与 6 NADPH</text><line marker-end="url(#head)" stroke="#11816c" stroke-linecap="round" stroke-width="4" x1="965" x2="965" y1="377" y2="490" /><rect fill="#e2f4e9" height="64" rx="14" stroke="#d6e2ee" stroke-width="2" width="260" x="830" y="501" /><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="960" y="542">净输出 1 G3P</text><line stroke="#b97813" stroke-dasharray="9 5" stroke-linecap="round" stroke-width="3" x1="833" x2="632" y1="329" y2="560" /><line marker-end="url(#head)" stroke="#b97813" stroke-linecap="round" stroke-width="3" x1="630" x2="227" y1="560" y2="560" /><text fill="#b97813" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="415" y="535">5 G3P + 3 ATP → 再生 3 RuBP</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="84" y="219">碳数：3 CO₂(3C) + 3 RuBP(15C) → 6 PGA(18C) → 6 G3P(18C)</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="87" y="613">合计：每净输出一个 G3P（3C），共消耗 9 ATP 和 6 NADPH。</text></svg>