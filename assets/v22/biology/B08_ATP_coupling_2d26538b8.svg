<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100"><defs /><rect fill="#f6f9fe" height="700" rx="0" stroke="#f6f9fe" stroke-width="1.5" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#d8e4f0" stroke-width="1.5" width="1064" x="18" y="18" /><rect fill="#193452" height="97" rx="20" stroke="#193452" stroke-width="1.5" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="29" font-weight="700" x="47" y="77">ATP 水解与细胞做功：能量耦联</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="46" y="149">常见细胞条件下水解ΔG&lt;0；方向依浓度、pH等条件，须经具体机制耦联</text><rect fill="#eef5ff" height="286" rx="15" stroke="#d9e7ef" stroke-width="1.5" width="280" x="58" y="224" /><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="24" font-weight="700" x="76" y="285">ATP 水解</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="76" y="351">ATP + H₂O → ADP + Pi</text><line stroke="#2064c8" stroke-width="4" x1="344" x2="400" y1="352" y2="352" /><polygon fill="#2064c8" points="400,352 390.0950818741206,356.78462087522354 390.0950818741206,347.21537912477646" /><rect fill="#fff9ec" height="286" rx="15" stroke="#d9e7ef" stroke-width="1.5" width="280" x="411" y="224" /><text fill="#bd7d13" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="24" font-weight="700" x="429" y="285">能量耦联</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="429" y="351">经酶促过程传递自由能</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="429" y="404">不是“能量物质”流动</text><line stroke="#bd7d13" stroke-width="4" x1="697" x2="753" y1="352" y2="352" /><polygon fill="#bd7d13" points="753,352 743.0950818741205,356.78462087522354 743.0950818741205,347.21537912477646" /><rect fill="#edf8f3" height="286" rx="15" stroke="#d9e7ef" stroke-width="1.5" width="280" x="764" y="224" /><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="24" font-weight="700" x="782" y="285">吸能细胞过程</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="782" y="351">主动运输、合成、运动</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="782" y="410">例如逆浓度梯度运输</text><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="471">整体水解 ΔG &lt; 0</text><text fill="#bd7d13" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="427" y="471">合成 ATP 需要另有能量来源</text><rect fill="#edf6ff" height="47" rx="9" stroke="#dce8f4" stroke-width="1.5" width="1010" x="45" y="617" /><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">能量释放不是仅由“断开某一根高能键”引起；应比较整个水解过程的自由能。</text></svg>