<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px"><defs><marker id="arr_B17_catalase_controlled_experiment" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="90" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="38" font-weight="700" text-anchor="start" x="55" y="56">酶实验：控制变量与过氧化氢分解</text><text fill="#51667c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="56" y="120">等体积介质对照；总液量/pH一致；用稀H₂O₂、护目镜，勿封死产气容器</text><rect fill="#f7faff" height="480" rx="18" stroke="#d6e3f1" stroke-width="2" width="720" x="45" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="67" y="195">相同体积、浓度 H2O2；相同温度与反应时间</text><path d="M 202 325 L 214 325 L 214 510 Q 214 545 250 545 Q 286 545 286 510 L 286 325 L 298 325" fill="#dcefff" stroke="#142c4c" stroke-width="3" /><rect fill="#9bd4ff" height="69" opacity="0.65" width="68" x="216" y="453" /><circle cx="237" cy="440" fill="white" r="5" stroke="#2563eb" stroke-width="2" /><circle cx="250" cy="414" fill="white" r="5" stroke="#2563eb" stroke-width="2" /><circle cx="263" cy="388" fill="white" r="5" stroke="#2563eb" stroke-width="2" /><circle cx="237" cy="362" fill="white" r="5" stroke="#2563eb" stroke-width="2" /><circle cx="250" cy="336" fill="white" r="5" stroke="#2563eb" stroke-width="2" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="250" y="277">实验组</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="250" y="585">加入酶液</text><path d="M 512 325 L 524 325 L 524 510 Q 524 545 560 545 Q 596 545 596 510 L 596 325 L 608 325" fill="#dcefff" stroke="#142c4c" stroke-width="3" /><rect fill="#9bd4ff" height="69" opacity="0.65" width="68" x="526" y="453" /><circle cx="547" cy="440" fill="white" r="4" stroke="#2563eb" stroke-width="2" /><text fill="#51667c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="560" y="277">对照组</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="560" y="585">等体积同介质无酶液</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="404" y="377">气泡只作定性观察</text><rect fill="#f5fbf8" height="480" rx="18" stroke="#d6e3f1" stroke-width="2" width="362" x="793" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="815" y="195">知识与注意事项</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="235">反应：</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="267">2H2O2 → 2H2O + O2</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="299" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="331">酶的作用：</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="363">降低活化能，</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="395">不改变平衡位置。</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="427" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="459">控制：温度、pH、</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="491">底物浓度及用量一致。</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="816" y="523" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="816" y="555">定量另收集O₂测初速</text></svg>