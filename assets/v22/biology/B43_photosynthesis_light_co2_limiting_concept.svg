<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f7fafc" /><rect x="0" y="0" width="1200" height="104" fill="#163e78" /><text x="40" y="61" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="36" fill="#fff" font-weight="700" text-anchor="start">光强与 CO2 供应的光合限制因素示意</text><text x="40" y="90" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#deedff" font-weight="400" text-anchor="start">模型示意 · 无真实实验数据，不应读出定量数值</text><rect x="35" y="143" width="550" height="418" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2" /><text x="60" y="188" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">同一温度下：光照强度影响</text><rect x="615" y="143" width="550" height="418" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2" /><text x="640" y="188" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" fill="#1c4b8f" font-weight="700" text-anchor="start">其他条件改变可改变平台高度</text><line x1="95" y1="500" x2="510" y2="500" stroke="#143156" stroke-width="3" stroke-linecap="round" /><polygon points="510,500 498.46906600386933,506.00312928203925 498.46906600386933,493.99687071796075" fill="#143156" /><line x1="95" y1="500" x2="95" y2="209" stroke="#143156" stroke-width="3" stroke-linecap="round" /><polygon points="95,209 101.00312928203928,220.5309339961307 88.99687071796072,220.5309339961307" fill="#143156" /><line x1="670" y1="500" x2="1085" y2="500" stroke="#143156" stroke-width="3" stroke-linecap="round" /><polygon points="1085,500 1073.4690660038693,506.00312928203925 1073.4690660038693,493.99687071796075" fill="#143156" /><line x1="670" y1="500" x2="670" y2="209" stroke="#143156" stroke-width="3" stroke-linecap="round" /><polygon points="670,209 676.0031292820393,220.5309339961307 663.9968707179607,220.5309339961307" fill="#143156" /><path d="M 95 498 C 160 331,250 257,470 253" fill="none" stroke="#177b5b" stroke-width="6" /><path d="M 670 498 C 739 300,845 255,1115 253" fill="none" stroke="#1c4b8f" stroke-width="6" /><path d="M 670 498 C 747 373,852 337,1115 334" fill="none" stroke="#c04b4b" stroke-width="5" stroke-dasharray="12 8" /><text x="285" y="540" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#143156" font-weight="400" text-anchor="start">光照强度 →</text><text x="875" y="540" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#143156" font-weight="400" text-anchor="start">光照强度 →</text><text x="122" y="208" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#143156" font-weight="400" text-anchor="start">总光合速率（示意）</text><text x="697" y="208" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#143156" font-weight="400" text-anchor="start">总光合速率（示意）</text><text x="875" y="215" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1c4b8f" font-weight="700" text-anchor="start">CO2供应较足</text><text x="876" y="375" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#c04b4b" font-weight="700" text-anchor="start">CO2供应较少</text><rect x="52" y="584" width="1098" height="47" rx="12" fill="#eef7ed" stroke="#b8d6b6" stroke-width="2" /><text x="73" y="615" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#177b5b" font-weight="400" text-anchor="start">仅表示定性趋势；温度、CO2、光照等条件会共同限制光合作用，曲线非实验测值。</text><text x="30" y="656" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#55718e" font-weight="400" text-anchor="start">UEC 2027 · 教学概念示意 · 使用前须学科审核</text></svg>