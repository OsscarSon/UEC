<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px"><defs/><rect fill="#f7faff" height="590" width="960" x="0" y="0"/><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18"/><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18"/><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="bold" x="50" y="67">人体水分稳态：ADH 的负反馈调节</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" x="48" y="126">ADH 为抗利尿激素；下图为血浆渗透压升高时的典型调节通路</text><rect fill="#f4f8ff" height="338" rx="15" stroke="#dae6f5" stroke-width="1.5" width="870" x="44" y="154"/><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="62" y="186">典型情境：失水使血浆渗透压升高</text><rect fill="white" height="97" rx="17" stroke="#2563eb" stroke-width="2" width="180" x="69" y="256"/><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="159.0" y="310">血浆渗透压↑</text><rect fill="white" height="97" rx="17" stroke="#8055c8" stroke-width="2" width="180" x="284" y="256"/><text fill="#8055c8" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="374.0" y="310">下丘脑感受</text><rect fill="white" height="97" rx="17" stroke="#dd8c35" stroke-width="2" width="180" x="500" y="256"/><text fill="#dd8c35" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="590.0" y="310">ADH 释放↑</text><rect fill="white" height="97" rx="17" stroke="#0f766e" stroke-width="2" width="180" x="713" y="256"/><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="803.0" y="310">集合管重吸收水↑</text><line stroke="#556a83" stroke-linecap="round" stroke-width="3" x1="250" x2="280" y1="303" y2="303"/><polygon fill="#556a83" points="280,303 270.3465918192059,308.2736809246462 270.3465918192059,297.7263190753538"/><line stroke="#556a83" stroke-linecap="round" stroke-width="3" x1="465" x2="496" y1="303" y2="303"/><polygon fill="#556a83" points="496,303 486.3465918192059,308.2736809246462 486.3465918192059,297.7263190753538"/><line stroke="#556a83" stroke-linecap="round" stroke-width="3" x1="680" x2="709" y1="303" y2="303"/><polygon fill="#556a83" points="709,303 699.3465918192059,308.2736809246462 699.3465918192059,297.7263190753538"/><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="bold" text-anchor="start" x="111" y="236">渗透压感受器</text><text fill="#dd8c35" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="521" y="236">垂体后叶释放 ADH</text><line stroke="#0f766e" stroke-linecap="round" stroke-width="3" x1="807" x2="807" y1="363" y2="419"/><line stroke="#0f766e" stroke-linecap="round" stroke-width="3" x1="807" x2="195" y1="419" y2="419"/><polygon fill="#0f766e" points="195,419 204.6534081807941,413.7263190753538 204.6534081807941,424.2736809246462"/><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="502" y="401">尿量减少、尿液更浓；血浆渗透压趋于正常</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515"/><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">水过多时 ADH 通常减少，集合管重吸收水减少，尿液趋于稀释。</text></svg>