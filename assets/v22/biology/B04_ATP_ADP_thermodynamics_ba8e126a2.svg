<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100"><defs /><rect fill="#f7faff" height="700" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#dbe5ef" stroke-width="2" width="1064" x="18" y="18" /><rect fill="#132c4b" height="98" rx="20" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="31" font-weight="700" x="50" y="74">ATP 与 ADP：水解和再合成</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="48" y="149">常见细胞条件下水解ΔG&lt;0；方向依浓度、pH等条件，须经具体机制耦联</text><rect fill="#eff6ff" height="370" rx="16" stroke="#ccdef2" stroke-width="1.5" width="960" x="70" y="190" /><rect fill="#e0edff" height="120" rx="16" stroke="#9ebce5" stroke-width="1.5" width="272" x="145" y="310" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="29" font-weight="700" text-anchor="middle" x="281" y="369">ATP + H₂O</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="281" y="400">相对较高自由能态</text><rect fill="#def2eb" height="120" rx="16" stroke="#a4d7c3" stroke-width="1.5" width="273" x="681" y="310" /><text fill="#18845d" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="29" font-weight="700" text-anchor="middle" x="817" y="369">ADP + Pi</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="818" y="400">无机磷酸 Pi</text><line stroke="#2563eb" stroke-width="5" x1="427" x2="670" y1="335" y2="335" /><polygon fill="#2563eb" points="670,335 658.12984377594,340.3008858897744 658.12984377594,329.6991141102256" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="547" y="307">水解：ΔG ＜ 0</text><line stroke="#18845d" stroke-width="5" x1="671" x2="428" y1="410" y2="410" /><polygon fill="#18845d" points="428,410 439.87015622406,404.6991141102256 439.87015622406,415.3008858897744" /><text fill="#18845d" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="545" y="458">再合成：需要能量输入</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="548" y="515">ATP 水解本身不是“单根化学键断裂直接放能”；需要考虑反应物和产物整体。</text><rect fill="#edf6ff" height="43" rx="9" stroke="#dfebfa" stroke-width="1.5" width="1010" x="45" y="620" /><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">再合成所需能量可来自细胞呼吸、光合作用等；Pi 表示无机磷酸。</text></svg>