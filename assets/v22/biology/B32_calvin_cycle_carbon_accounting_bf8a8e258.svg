<svg baseProfile="full" height="660" version="1.1" viewBox="0 0 1100 660" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="660" width="1100" x="0" y="0" /><rect fill="#112B51" height="96" width="1100" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="bold" x="40" y="62">卡尔文循环：固定 3 CO2 的碳原子守恒</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="42" y="133">3 个 CO2 与 3 个五碳 RuBP 共同参与固定；不是 CO2 先变为 RuBP</text><rect fill="#F5F8FD" height="374" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="1028" x="36" y="155" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="61" y="197">碳数守恒 · 每 3 CO2 为一个核算单位</text><rect fill="#EAF1FC" height="75" rx="14" stroke="#2762CD" stroke-width="2" width="178" x="65" y="225" /><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="154" y="257">3 CO2</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="154" y="284">3 C</text><rect fill="#EAF1FC" height="75" rx="14" stroke="#8060C2" stroke-width="2" width="178" x="65" y="330" /><text fill="#8060C2" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="154" y="362">3 RuBP</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="154" y="389">15 C</text><line stroke="#2762CD" stroke-linecap="round" stroke-width="3" x1="248" x2="337" y1="261" y2="311" /><polygon fill="#2762CD" points="337,311 322.00761031661943,310.522243177272 328.7929392384718,298.44435769637477" /><line stroke="#8060C2" stroke-linecap="round" stroke-width="3" x1="248" x2="337" y1="365" y2="320" /><polygon fill="#8060C2" points="337,320 328.2519755769249,332.1849115176632 322.001056378953,319.82198243722996" /><rect fill="#EEF4FB" height="91" rx="15" stroke="#112B51" stroke-width="2" width="130" x="342" y="269" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="407" y="307">CO2 固定</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="407" y="335">（Rubisco）</text><line stroke="#112B51" stroke-linecap="round" stroke-width="4" x1="479" x2="532" y1="313" y2="313" /><polygon fill="#112B51" points="532,313 518.6950761583107,319.92668763312224 518.6950761583107,306.07331236687776" /><rect fill="#FFF2E4" height="95" rx="15" stroke="#E68A2E" stroke-width="2" width="145" x="542" y="266" /><text fill="#E68A2E" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="614" y="306">6 PGA</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="614" y="337">18 C</text><line stroke="#112B51" stroke-linecap="round" stroke-width="4" x1="694" x2="747" y1="313" y2="313" /><polygon fill="#112B51" points="747,313 733.6950761583107,319.92668763312224 733.6950761583107,306.07331236687776" /><rect fill="#E8F8ED" height="95" rx="15" stroke="#15855E" stroke-width="2" width="148" x="757" y="266" /><text fill="#15855E" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="831" y="306">6 G3P</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="831" y="337">18 C</text><line stroke="#15855E" stroke-linecap="round" stroke-width="3" x1="831" x2="831" y1="365" y2="405" /><polygon fill="#15855E" points="831,405 824.0733123668778,391.6950761583107 837.9266876331222,391.6950761583107" /><line stroke="#15855E" stroke-linecap="round" stroke-width="3" x1="831" x2="691" y1="406" y2="406" /><polygon fill="#15855E" points="691,406 704.3049238416893,399.07331236687776 704.3049238416893,412.92668763312224" /><line stroke="#E68A2E" stroke-linecap="round" stroke-width="3" x1="831" x2="974" y1="406" y2="406" /><polygon fill="#E68A2E" points="974,406 960.6950761583107,412.92668763312224 960.6950761583107,399.07331236687776" /><text fill="#15855E" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" x="510" y="455">5 G3P 回收</text><text fill="#15855E" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" x="510" y="481">再生 3 RuBP（15 C）</text><text fill="#E68A2E" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" x="880" y="456">1 G3P</text><text fill="#E68A2E" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" x="870" y="482">净输出（3 C）</text><text fill="#8060C2" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" x="64" y="503">消耗：9 ATP + 6 NADPH</text><rect fill="#F5F8FD" height="91" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="1030" x="35" y="548" /><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="581">碳核算：3 RuBP（15 C）+ 3 CO2（3 C）→ 6 PGA（18 C）→ 6 G3P（18 C）。</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="614">1 个 G3P（3 C）净输出，5 个 G3P（15 C）再生 3 个 RuBP（15 C）。</text></svg>