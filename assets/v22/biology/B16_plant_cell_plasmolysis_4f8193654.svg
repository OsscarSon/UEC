<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1200 760" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="760" width="1200" x="0" y="0" /><rect fill="#14294a" height="83" rx="23" width="1136" x="32" y="28" /><text fill="#ffffff" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start" x="65" y="84">植物细胞的质壁分离与复原</text><text fill="#66758a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="47" y="143">示意：成熟植物细胞置于高渗溶液，失水后原生质层与细胞壁分离；回到低渗条件可复原</text><rect fill="#f4f8ff" height="416" rx="20" stroke="#cbdcf0" stroke-width="2" width="358" x="55" y="186" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="79" y="228">吸水膨胀（膨压）</text><rect fill="#e4f4ce" height="191" rx="20" stroke="#6c9e41" stroke-width="11" width="218" x="127" y="316" /><rect fill="#bce0f4" height="173.81" rx="22" stroke="#138a67" stroke-width="5" width="198.38" x="136.81" y="324.595" /><circle cx="237" cy="410" fill="#8c6dc6" r="20" /><line stroke="#2670dc" stroke-linecap="round" stroke-width="4" x1="79" x2="115" y1="414" y2="414" /><polygon fill="#2670dc" points="115.0,414.0 102.657849257704,420.60842757805835 102.657849257704,407.39157242194165" /><text fill="#138a67" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="234" y="547">水净流入</text><rect fill="#f4f8ff" height="416" rx="20" stroke="#cbdcf0" stroke-width="2" width="358" x="435" y="186" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="459" y="228">高渗外液：质壁分离</text><rect fill="#e4f4ce" height="191" rx="20" stroke="#6c9e41" stroke-width="11" width="218" x="507" y="316" /><rect fill="#bce0f4" height="126.06" rx="22" stroke="#e99b25" stroke-width="5" width="143.88" x="544.06" y="348.47" /><circle cx="617" cy="410" fill="#8c6dc6" r="20" /><line stroke="#e99b25" stroke-linecap="round" stroke-width="4" x1="740" x2="772" y1="412" y2="412" /><polygon fill="#e99b25" points="772.0,412.0 759.657849257704,418.60842757805835 759.657849257704,405.39157242194165" /><text fill="#e99b25" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="614" y="547">水净流出</text><rect fill="#f4f8ff" height="416" rx="20" stroke="#cbdcf0" stroke-width="2" width="358" x="815" y="186" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="839" y="228">回到低渗：复原</text><rect fill="#e4f4ce" height="191" rx="20" stroke="#6c9e41" stroke-width="11" width="218" x="887" y="316" /><rect fill="#bce0f4" height="169.99" rx="22" stroke="#2670dc" stroke-width="5" width="194.02" x="898.99" y="326.505" /><circle cx="997" cy="410" fill="#8c6dc6" r="20" /><line stroke="#2670dc" stroke-linecap="round" stroke-width="4" x1="839" x2="875" y1="414" y2="414" /><polygon fill="#2670dc" points="875.0,414.0 862.657849257704,420.60842757805835 862.657849257704,407.39157242194165" /><text fill="#138a67" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="994" y="547">水净流入</text><rect fill="#edf7fc" height="80" rx="20" stroke="#cbdcf0" stroke-width="2" width="1090" x="55" y="640" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="83" y="689">绿色外框为细胞壁，彩色内框为原生质层的简化边界。实际复原受细胞活性及环境条件限制。</text></svg>