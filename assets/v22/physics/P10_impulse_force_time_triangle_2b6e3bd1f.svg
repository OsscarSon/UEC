<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1200 760" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="760" width="1200" x="0" y="0" /><rect fill="#14294a" height="83" rx="23" width="1136" x="32" y="28" /><text fill="#ffffff" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start" x="65" y="84">冲量：力—时间图像的面积</text><text fill="#66758a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="47" y="143">一个向右的水平合力先线性增至 6 N，再减至 0；作用时间为 4 s</text><rect fill="#f4f8ff" height="426" rx="20" stroke="#cbdcf0" stroke-width="2" width="746" x="52" y="170" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="76" y="212">合力 F 随时间 t 的变化</text><line stroke="#14294a" stroke-linecap="round" stroke-width="3" x1="150" x2="720" y1="530" y2="530" /><polygon fill="#14294a" points="720.0,530.0 707.657849257704,536.6084275780584 707.657849257704,523.3915724219416" /><line stroke="#14294a" stroke-linecap="round" stroke-width="3" x1="150" x2="150" y1="530" y2="242" /><polygon fill="#14294a" points="150.0,242.0 156.60842757805835,254.342150742296 143.39157242194165,254.342150742296" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" x="720" y="558">t / s</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" x="93" y="233">F / N</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="150" x2="150" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="150" y="561">0</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="275" x2="275" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="275" y="561">1</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="400" x2="400" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="400" y="561">2</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="525" x2="525" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="525" y="561">3</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="650" x2="650" y1="522" y2="538" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="650" y="561">4</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="142" x2="158" y1="530" y2="530" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="128" y="535">0</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="142" x2="158" y1="452" y2="452" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="128" y="457">2</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="142" x2="158" y1="374" y2="374" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="128" y="379">4</text><line stroke="#14294a" stroke-linecap="round" stroke-width="2" x1="142" x2="158" y1="296" y2="296" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="end" x="128" y="301">6</text><polygon fill="#d9e7fb" points="150,530 400,296 650,530" /><line stroke="#2670dc" stroke-linecap="round" stroke-width="5" x1="150" x2="400" y1="530" y2="296" /><line stroke="#2670dc" stroke-linecap="round" stroke-width="5" x1="400" x2="650" y1="296" y2="530" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="400" y="465">A = ½ × 4 × 6</text><rect fill="#e8f2ff" height="360" rx="20" stroke="#cbdcf0" stroke-width="2" width="327" x="823" y="192" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="847" y="234">动量定理</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" x="844" y="258">冲量 I = ∫ F dt</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" x="844" y="306">= 三角形面积</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" x="844" y="354">= ½ × 4 s × 6 N</text><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" x="844" y="402"> = 12 N·s</text><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" x="844" y="450" /><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" x="844" y="498">Δp = I = +12 kg·m/s</text><rect fill="#edf7fc" height="80" rx="20" stroke="#cbdcf0" stroke-width="2" width="1090" x="55" y="640" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="83" y="689">必须是合力—时间图才能直接等于动量变化；正面积代表向右的冲量。</text></svg>