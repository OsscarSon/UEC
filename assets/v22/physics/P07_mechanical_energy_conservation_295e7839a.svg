<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100"><defs /><rect fill="#f6f9fe" height="700" rx="0" stroke="#f6f9fe" stroke-width="1.5" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#d8e4f0" stroke-width="1.5" width="1064" x="18" y="18" /><rect fill="#193452" height="97" rx="20" stroke="#193452" stroke-width="1.5" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="29" font-weight="700" x="47" y="77">机械能守恒：重力势能与动能互换</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="46" y="149">忽略阻力，只受重力时，重力势能减小、动能增加</text><rect fill="#eff6ff" height="385" rx="15" stroke="#c9d8ea" stroke-width="1.5" width="650" x="58" y="190" /><line stroke="#193452" stroke-width="3" x1="124" x2="665" y1="528" y2="528" /><polygon fill="#193452" points="665,528 654.1946347717678,533.2195864093347 654.1946347717678,522.7804135906653" /><line stroke="#193452" stroke-width="3" x1="124" x2="124" y1="528" y2="239" /><polygon fill="#193452" points="124,239 129.21958640933477,249.80536522823212 118.78041359066523,249.80536522823212" /><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="423" y="563">下落距离（相对总高度）</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="82" y="232">能量</text><polyline fill="none" points="125,278 628,508" stroke="#177b59" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polyline fill="none" points="125,508 628,278" stroke="#2064c8" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><polyline fill="none" points="125,260 628,260" stroke="#bd7d13" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#bd7d13" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700" x="410" y="247">总机械能 E = 常量</text><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700" x="175" y="295">重力势能 Eₚ</text><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700" x="514" y="298">动能 Eₖ</text><rect fill="#f3f9f2" height="385" rx="15" stroke="#d5e8d4" stroke-width="1.5" width="320" x="732" y="190" /><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="700" x="756" y="248">能量关系</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="24" font-weight="400" x="751" y="312">E = Eₖ + Eₚ</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="400" x="753" y="367">Eₖ = ½mv²</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="400" x="753" y="422">Eₚ = mgh</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="745" y="502">高度零点必须先选定</text><rect fill="#edf6ff" height="47" rx="9" stroke="#dce8f4" stroke-width="1.5" width="1010" x="45" y="617" /><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">本图不考虑阻力及其他形式能量；曲线表示同一物体下落过程的理想线性比例。</text></svg>