<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px"><defs><marker id="head" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L9 5 L0 10Z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="89" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="700" text-anchor="start" x="45" y="57">斜面受力分解：沿面与垂直面</text><text fill="#52677c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="45" y="123">示例：质量 2 kg，斜面角 30°，g = 10 N/kg；忽略摩擦</text><rect fill="#f7faff" height="480" rx="14" stroke="#d6e2ee" stroke-width="2" width="730" x="40" y="160" /><rect fill="#f5faf7" height="480" rx="14" stroke="#d6e2ee" stroke-width="2" width="350" x="800" y="160" /><polygon fill="#e6eef9" points="125,565 690,565 690,240" stroke="#142c4c" stroke-width="3" /><text fill="#7155bb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="435" y="561.3097345132744">mg = 20 N</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="311.39745962155615" y="208.30973451327435">N</text><text fill="#ca4b52" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="233.39745962155615" y="443.30973451327435">mg sin30°</text><text fill="#b97813" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="165" y="555">30°</text><text fill="#bd7d13" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="518.6025403784438" y="498.3097345132744">mg cos30°</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="700" text-anchor="start" x="825" y="225">受力关系</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="271">重力：mg = 20 N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="307">沿斜面：mg sin30°</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="824" y="343">= 10 N（向下）</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="379">垂直斜面：mg cos30°</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="824" y="415">≈ 17.32 N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="451">法向支持力 N ≈ 17.32 N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="487" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="824" y="523">加速度 a = g sin30°</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="824" y="559">= 5 m/s²（沿面向下）</text><rect x="376" y="341.30973451327435" width="88" height="54" rx="4" fill="#bfdefd" stroke="#2563eb" stroke-width="2" transform="rotate(-30 420 368.30973451327435)" /><line x1="420" y1="368.30973451327435" x2="420" y2="568.3097345132744" stroke="#7155bb" stroke-width="4" /><polygon points="420,568.3097345132744 425.0,556.3097345132744 415.0,556.3097345132744" fill="#7155bb" /><line x1="420" y1="368.30973451327435" x2="333.39745962155615" y2="218.30973451327435" stroke="#177b59" stroke-width="4" /><polygon points="333.39745962155615,218.30973451327435 335.06733260263394,231.2020393586876 343.72758664047836,226.2020393586876" fill="#177b59" /><line x1="420" y1="368.30973451327435" x2="333.39745962155615" y2="418.30973451327435" stroke="#ca4b52" stroke-width="4" stroke-dasharray="9 5" /><polygon points="333.39745962155615,418.30973451327435 346.2897644669694,416.63986153219656 341.2897644669694,407.97960749435214" fill="#ca4b52" /><line x1="420" y1="368.30973451327435" x2="506.60254037844385" y2="518.3097345132744" stroke="#bd7d13" stroke-width="4" stroke-dasharray="9 5" /><polygon points="506.60254037844385,518.3097345132744 504.93266739736606,505.41742966786114 496.27241335952164,510.41742966786114" fill="#bd7d13" /><polyline points="333.39745962155615,418.30973451327435 420,568.3097345132744 506.60254037844385,518.3097345132744" fill="none" stroke="#8091a5" stroke-dasharray="4 5" stroke-width="2" /></svg>