<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620px" version="1.1" viewBox="0 0 1000 620" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="620" width="1000" x="0" y="0" /><rect fill="#173a68" height="78" rx="17" width="950" x="25" y="20" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="500" y="68">电容器：电荷与电压的关系</text><text fill="#637b91" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="500" y="126">理想线性电容器：Q = CU；C 为常数，Q 与 U 成正比</text><rect fill="#f2f8fd" height="385" rx="16" stroke="#c5dae9" stroke-width="2" width="910" x="45" y="153" /><line stroke="#173a68" stroke-width="3" x1="139" x2="139" y1="479" y2="206" /><line stroke="#173a68" stroke-width="3" x1="139" x2="139" y1="479" y2="204" /><line stroke="#173a68" stroke-width="3" x1="139" x2="146.2498883260884" y1="204" y2="214.79069595805788" /><line stroke="#173a68" stroke-width="3" x1="139" x2="131.7501116739116" y1="204" y2="214.79069595805788" /><line stroke="#173a68" stroke-width="3" x1="139" x2="620" y1="479" y2="479" /><line stroke="#173a68" stroke-width="3" x1="139" x2="621" y1="479" y2="479" /><line stroke="#173a68" stroke-width="3" x1="621" x2="610.2093040419421" y1="479" y2="486.2498883260884" /><line stroke="#173a68" stroke-width="3" x1="621" x2="610.2093040419421" y1="479" y2="471.7501116739116" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="65" y="205">Q (μC)</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="634" y="488">U (V)</text><line stroke="#247ac7" stroke-width="5" x1="139" x2="559" y1="479" y2="227" /><circle cx="139" cy="479.0" fill="#db615c" r="5" /><text fill="#637b91" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="139" y="500">0</text><circle cx="223" cy="428.6" fill="#db615c" r="5" /><circle cx="307" cy="378.2" fill="#db615c" r="5" /><text fill="#637b91" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="307" y="500">4</text><circle cx="391" cy="327.8" fill="#db615c" r="5" /><circle cx="475" cy="277.4" fill="#db615c" r="5" /><text fill="#637b91" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="475" y="500">8</text><circle cx="559" cy="227.0" fill="#db615c" r="5" /><text fill="#637b91" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="559" y="500">10</text><text fill="#15977a" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="528" y="275">斜率 C = Q/U = 2 μF</text><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="528" y="327">例：U = 10 V，Q = 20 μC</text><text fill="#637b91" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="528" y="378">此图为理想电容器线性模型</text><rect fill="#f2f8fd" height="56" rx="16" stroke="#c5dae9" stroke-width="2" width="910" x="45" y="547" /><text fill="#173a68" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="70" y="582">注：图上数值是教学示例，不是特定实验测量结果。</text></svg>