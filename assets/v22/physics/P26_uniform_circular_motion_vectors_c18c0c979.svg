<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="660" version="1.1" viewBox="0 0 1100 660" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="660" width="1100" x="0" y="0" /><rect fill="#112B51" height="96" width="1100" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="bold" x="40" y="62">匀速圆周运动：速度与向心加速度</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="42" y="133">速度方向沿切线；即使速率不变，速度方向仍持续变化</text><rect fill="#F5F8FD" height="365" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="690" x="37" y="156" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="62" y="198">圆周上的瞬时向量</text><circle cx="366" cy="354" fill="none" r="147" stroke="#A6C6F5" stroke-width="4" /><circle cx="513.0" cy="354.0" fill="#2762CD" r="9" /><line stroke="#15855E" stroke-linecap="round" stroke-width="5" x1="513.0" x2="513.0" y1="354.0" y2="281.0" /><polygon fill="#15855E" points="513.0,281.0 519.9266876331222,294.3049238416893 506.07331236687776,294.3049238416893" /><line stroke="#C7444A" stroke-linecap="round" stroke-width="5" x1="513.0" x2="431.0" y1="354.0" y2="354.0" /><polygon fill="#C7444A" points="431.0,354.0 444.3049238416893,347.07331236687776 444.3049238416893,360.92668763312224" /><circle cx="366.0" cy="207.0" fill="#2762CD" r="9" /><line stroke="#15855E" stroke-linecap="round" stroke-width="5" x1="366.0" x2="293.0" y1="207.0" y2="207.0" /><polygon fill="#15855E" points="293.0,207.0 306.3049238416893,200.07331236687776 306.3049238416893,213.92668763312224" /><line stroke="#C7444A" stroke-linecap="round" stroke-width="5" x1="366.0" x2="366.0" y1="207.0" y2="289.0" /><polygon fill="#C7444A" points="366.0,289.0 359.07331236687776,275.6950761583107 372.92668763312224,275.6950761583107" /><circle cx="219.0" cy="354.0" fill="#2762CD" r="9" /><line stroke="#15855E" stroke-linecap="round" stroke-width="5" x1="219.0" x2="219.0" y1="354.0" y2="427.0" /><polygon fill="#15855E" points="219.0,427.0 212.07331236687776,413.6950761583107 225.92668763312224,413.6950761583107" /><line stroke="#C7444A" stroke-linecap="round" stroke-width="5" x1="219.0" x2="301.0" y1="354.0" y2="354.0" /><polygon fill="#C7444A" points="301.0,354.0 287.6950761583107,360.92668763312224 287.6950761583107,347.07331236687776" /><circle cx="366.0" cy="501.0" fill="#2762CD" r="9" /><line stroke="#15855E" stroke-linecap="round" stroke-width="5" x1="366.0" x2="439.0" y1="501.0" y2="501.0" /><polygon fill="#15855E" points="439.0,501.0 425.6950761583107,507.92668763312224 425.6950761583107,494.07331236687776" /><line stroke="#C7444A" stroke-linecap="round" stroke-width="5" x1="366.0" x2="366.0" y1="501.0" y2="419.0" /><polygon fill="#C7444A" points="366.0,419.0 372.92668763312224,432.3049238416893 359.07331236687776,432.3049238416893" /><text fill="#15855E" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="bold" x="76" y="460">v：沿切线</text><text fill="#C7444A" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="bold" x="76" y="491">a：指向圆心</text><circle cx="366" cy="354" fill="#112B51" r="5" /><rect fill="#F5F8FD" height="365" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="317" x="747" y="156" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="772" y="198">大小关系</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" x="772" y="236">速度大小：v（不变）</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" x="772" y="284">速度方向：持续改变</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" x="772" y="332">向心加速度：</text><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="bold" x="772" y="380">a = v2 / r</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" x="772" y="428">向心力合力：</text><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="bold" x="772" y="476">F = mv2 / r</text><rect fill="#F5F8FD" height="91" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="1030" x="35" y="548" /><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="581">红色箭头是加速度方向，不是额外的一种“向心力”。</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="614">图中箭头长度仅示方向，未按任何具体物体的比例绘制。</text></svg>