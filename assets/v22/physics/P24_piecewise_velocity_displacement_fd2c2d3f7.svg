<svg baseProfile="full" height="660" version="1.1" viewBox="0 0 1100 660" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="660" width="1100" x="0" y="0" /><rect fill="#112B51" height="96" width="1100" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="bold" x="40" y="62">分段速度—时间图：位移与路程</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="42" y="133">示例：先正向运动，再反向运动；速度带有正负号</text><rect fill="#F5F8FD" height="365" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="670" x="37" y="156" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="62" y="198">速度 v / (m/s)</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="120" x2="620" y1="405" y2="405" /><polygon fill="#112B51" points="620,405 606.6950761583107,411.92668763312224 606.6950761583107,398.07331236687776" /><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="120" x2="120" y1="535" y2="227" /><polygon fill="#112B51" points="120,227 126.92668763312224,240.30492384168926 113.07331236687776,240.30492384168926" /><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="120" x2="120" y1="535" y2="240" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="120" y="434">0</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="120" x2="120" y1="399" y2="411" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="276" y="434">2</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="276" x2="276" y1="399" y2="411" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="432" y="434">4</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="432" x2="432" y1="399" y2="411" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="588" y="434">6</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="588" x2="588" y1="399" y2="411" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="bold" x="625" y="432">t / s</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" text-anchor="end" x="92" y="479">-2</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="115" x2="126" y1="473" y2="473" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" text-anchor="end" x="92" y="343">2</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="115" x2="126" y1="337" y2="337" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" text-anchor="end" x="92" y="275">4</text><line stroke="#112B51" stroke-linecap="round" stroke-width="2" x1="115" x2="126" y1="269" y2="269" /><line stroke="#2762CD" stroke-linecap="round" stroke-width="6" x1="120" x2="276" y1="337" y2="337" /><line stroke="#2762CD" stroke-linecap="round" stroke-width="6" x1="276" x2="276" y1="337" y2="473" /><line stroke="#2762CD" stroke-linecap="round" stroke-width="6" x1="276" x2="432" y1="473" y2="473" /><line stroke="#2762CD" stroke-linecap="round" stroke-width="6" x1="432" x2="432" y1="473" y2="269" /><line stroke="#2762CD" stroke-linecap="round" stroke-width="6" x1="432" x2="588" y1="269" y2="269" /><rect fill="#15855E" height="68" opacity="0.13" width="156" x="120" y="337" /><rect fill="#C7444A" height="68" opacity="0.13" width="156" x="276" y="405" /><rect fill="#15855E" height="136" opacity="0.13" width="156" x="432" y="269" /><rect fill="#F5F8FD" height="365" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="335" x="731" y="156" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="756" y="198">由图像面积计算</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" x="756" y="247">0–2 s：+2 × 2 = +4 m</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" x="756" y="296">2–4 s：−2 × 2 = −4 m</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" x="756" y="345">4–6 s：+4 × 2 = +8 m</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="bold" x="756" y="394">位移 = +8 m</text><text fill="#C7444A" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="bold" x="756" y="443">路程 = 4+4+8 = 16 m</text><rect fill="#F5F8FD" height="91" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="1030" x="35" y="548" /><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="581">位移 = v–t 图像的有向面积；路程 = 各段面积绝对值之和。</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="614">转折处为理想化速度突变示例，不代表物体真实瞬时改变速度。</text></svg>