<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1200 760" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="760" width="1200" x="0" y="0" /><rect fill="#14294a" height="83" rx="23" width="1136" x="32" y="28" /><text fill="#ffffff" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start" x="65" y="84">完全非弹性碰撞：动量守恒</text><text fill="#66758a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="47" y="143">一维水平轨道、外力冲量可忽略；2 kg 小车追上静止的 1 kg 小车，碰后粘在一起</text><rect fill="#f4f8ff" height="425" rx="20" stroke="#cbdcf0" stroke-width="2" width="1080" x="64" y="178" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" x="88" y="220">碰撞前</text><rect fill="#2670dc" height="102" opacity="0.23" rx="17" stroke="#2670dc" stroke-width="3" width="175" x="210" y="252" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" x="297" y="312">2 kg</text><text fill="#2670dc" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="297" y="407">3 m/s →</text><rect fill="#e99b25" height="102" opacity="0.23" rx="17" stroke="#e99b25" stroke-width="3" width="175" x="620" y="252" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" x="707" y="312">1 kg</text><text fill="#e99b25" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="707" y="407">0 m/s</text><line stroke="#2670dc" stroke-linecap="round" stroke-width="6" x1="406" x2="534" y1="305" y2="305" /><polygon fill="#2670dc" points="534.0,305.0 521.657849257704,311.60842757805835 521.657849257704,298.39157242194165" /><line stroke="#abb5c5" stroke-linecap="round" stroke-width="5" x1="116" x2="1019" y1="369" y2="369" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" x="90" y="488">碰撞后：两车粘合，共同向右运动</text><rect fill="#2670dc" height="82" opacity="0.22" rx="12" stroke="#2670dc" stroke-width="3" width="177" x="258" y="508" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" x="346" y="563">2 kg</text><rect fill="#e99b25" height="82" opacity="0.22" rx="12" stroke="#e99b25" stroke-width="3" width="177" x="436" y="508" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" x="524" y="563">1 kg</text><line stroke="#138a67" stroke-linecap="round" stroke-width="6" x1="664" x2="858" y1="542" y2="542" /><polygon fill="#138a67" points="858.0,542.0 845.657849257704,548.6084275780584 845.657849257704,535.3915724219416" /><text fill="#138a67" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" x="893" y="548">v = 2 m/s</text><rect fill="#edf7fc" height="80" rx="20" stroke="#cbdcf0" stroke-width="2" width="1090" x="55" y="640" /><text fill="#14294a" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" x="83" y="689">动量：2×3 + 1×0 = (2+1)×2 = 6 kg·m/s。动能：前 9 J，后 6 J，损失 3 J。</text></svg>