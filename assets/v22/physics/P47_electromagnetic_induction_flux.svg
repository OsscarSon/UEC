  <text fill="#173B63" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="72" y="676">改变磁场、回路面积或夹角也可能改变磁通量；静止且磁通不变时不产生感应电动势。</text>
