<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="660" version="1.1" viewBox="0 0 1100 660" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="660" width="1100" x="0" y="0" /><rect fill="#112B51" height="96" width="1100" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="bold" x="40" y="62">水平碰撞：动量守恒与动能变化</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="42" y="133">一维完全非弹性碰撞示例：两物体碰撞后粘在一起</text><rect fill="#F5F8FD" height="365" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="655" x="37" y="156" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="62" y="198">碰撞前 → 碰撞后</text><line stroke="#9EB0C4" stroke-linecap="round" stroke-width="5" x1="95" x2="636" y1="416" y2="416" /><rect fill="#78B1F0" height="80" rx="12" width="125" x="111" y="336" /><rect fill="#F4B46C" height="80" rx="12" width="125" x="430" y="336" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="173" y="387">2 kg</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="490" y="387">1 kg</text><line stroke="#2762CD" stroke-linecap="round" stroke-width="6" x1="183" x2="298" y1="321" y2="321" /><polygon fill="#2762CD" points="298,321 284.6950761583107,327.92668763312224 284.6950761583107,314.07331236687776" /><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="185" y="289">3 m/s →</text><text fill="#E68A2E" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" x="485" y="289">静止</text><line stroke="#112B51" stroke-linecap="round" stroke-width="3" x1="305" x2="393" y1="478" y2="478" /><polygon fill="#112B51" points="393,478 379.6950761583107,484.92668763312224 379.6950761583107,471.07331236687776" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="344" y="501">碰撞</text><rect fill="#E2F0FF" height="72" rx="15" width="265" x="735" y="205" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="868" y="250">(2 kg + 1 kg)</text><line stroke="#15855E" stroke-linecap="round" stroke-width="5" x1="862" x2="1007" y1="305" y2="305" /><polygon fill="#15855E" points="1007,305 993.6950761583107,311.92668763312224 993.6950761583107,298.07331236687776" /><text fill="#15855E" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="bold" x="927" y="292">2 m/s</text><rect fill="#F5F8FD" height="166" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="353" x="713" y="354" /><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" x="738" y="396">动量与动能核对</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="733" y="417">p前 = 2×3 = 6 kg·m/s</text><text fill="#112B51" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="733" y="453">p后 = 3×2 = 6 kg·m/s</text><text fill="#2762CD" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="bold" x="733" y="489">K前 = 9 J；K后 = 6 J</text><rect fill="#F5F8FD" height="91" rx="18" ry="18" stroke="#D9E3EF" stroke-width="2" width="1030" x="35" y="548" /><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="581">动量守恒，动能减少 3 J；减少的动能转为内能、形变等形式。</text><text fill="#63788F" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" x="60" y="614">成立条件：碰撞过程可忽略水平方向的外冲量；此处取向右为正。</text></svg>