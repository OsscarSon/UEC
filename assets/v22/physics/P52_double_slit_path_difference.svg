<svg baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="bold" x="50" y="66">双缝干涉：光程差与亮纹条件</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="48" y="126">远屏近轴近似，双缝间距 d，屏距 L，单色相干光</text><rect fill="#f4f8ff" height="332" rx="15" stroke="#dae6f5" stroke-width="1.5" width="570" x="45" y="153" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="185">光程示意（不按比例）</text><rect fill="#17345d" height="198" width="18" x="140" y="225" /><rect fill="white" height="18" width="18" x="140" y="272" /><rect fill="white" height="18" width="18" x="140" y="355" /><rect fill="#cad5e8" height="267" width="14" x="530" y="190" /><circle cx="147" cy="281" fill="#2563eb" r="5" /><circle cx="147" cy="364" fill="#2563eb" r="5" /><circle cx="537" cy="284" fill="#dc4b4b" r="6" /><line stroke="#2563eb" stroke-linecap="round" stroke-width="3" x1="147" x2="537" y1="281" y2="284" /><line stroke="#dc4b4b" stroke-linecap="round" stroke-width="3" x1="147" x2="537" y1="364" y2="284" /><line stroke="#556a83" stroke-dasharray="5 5" stroke-linecap="round" stroke-width="1.4" x1="147" x2="537" y1="323" y2="323" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="97" y="285">S1</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="96" y="368">S2</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="551" y="290">P</text><line stroke="#556a83" stroke-linecap="round" stroke-width="2" x1="184" x2="184" y1="281" y2="364" /><polygon fill="#556a83" points="184,364 178.22867460944823,352.3513175321682 189.77132539055177,352.3513175321682" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="199" y="330">d</text><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="310" y="469">L ≫ d；光程差 δ ≈ d sintheta</text><rect fill="#f4f8ff" height="332" rx="15" stroke="#dae6f5" stroke-width="1.5" width="270" x="640" y="153" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="658" y="185">亮纹与暗纹条件</text><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="657" y="222">亮纹（相长）</text><text fill="#0f766e" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="658" y="264">δ = mlambda</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="655" y="319">暗纹（相消）</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" text-anchor="start" x="654" y="361">δ = (m + ½)lambda</text><text fill="#556a83" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="656" y="427">m 为整数</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">小角度近似：相邻亮纹间距 delta_y ≈ lambdaL/d；需同频、相干的双缝光。</text></svg>