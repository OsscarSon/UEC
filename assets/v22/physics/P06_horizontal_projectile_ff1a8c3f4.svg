" /><line stroke="#168e94" stroke-width="3" x1="620" x2="677" y1="495" y2="495" /><polygon fill="#168e94" points="677,495 668.8959760788259,498.9146898070011 668.8959760788259,491.0853101929989" /><line stroke="#7155bb" stroke-width="3" x1="620" x2="620" y1="495" y2="565" /><polygon fill="#7155bb" points="620,565 616.0853101929989,556.8959760788259 623.9146898070011,556.8959760788259" /><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="700" x="257" y="231">轨迹：抛物线</text><text fill="#168e94" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="228" y="580">水平分速度 vₓ</text><text fill="#7155bb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="465" y="580">竖直分速度 vᵧ</text><rect fill="#f2f7ff" height="410" rx="15" stroke="#dce7f8" stroke-width="1.5" width="300" x="753" y="177" /><text fill="#2064c8" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="700" x="779" y="241">运动方程</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="400" x="780" y="304">x = v₀t</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="20" font-weight="400" x="778" y="358">下落距离 h = ½gt²</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="19" font-weight="400" x="778" y="418">vₓ = v₀（恒定）</text><text fill="#193452" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="19" font-weight="400" x="778" y="469">vᵧ = gt（向下）</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="15" font-weight="400" x="773" y="538">取起点为原点，竖直向下为正</text><rect fill="#edf6ff" height="47" rx="9" stroke="#dce8f4" stroke-width="1.5" width="1010" x="45" y="617" /><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">图以屏幕向下为下落方向；方程使用“竖直向下为正”的坐标约定。</text></svg>