<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100"><defs /><rect fill="#f6f9fe" height="700" rx="0" stroke="#f6f9fe" stroke-width="1.5" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#d8e4f0" stroke-width="1.5" width="1064" x="18" y="18" /><rect fill="#193452" height="97" rx="20" stroke="#193452" stroke-width="1.5" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="29" font-weight="700" x="47" y="77">斜面受力：重力分解与法向支持力</text><text fill="#576b7f" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="46" y="149">无摩擦斜面上的重力分解；没有额外约束时物块沿斜面加速</text><rect fill="#eff6ff" height="407" rx="15" stroke="#c9d8ea" stroke-width="1.5" width="655" x="55" y="180" /><polyline fill="none" points="125,510 585,244 585,510 125,510" stroke="#7a95b1" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#d9eafb" height="61" rx="7" stroke="#2064c8" stroke-width="3" transform="rotate(-30 362 369)" width="86" x="319" y="339" /><text fill="#7155bb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700" x="385" y="563">mg（竖直向下）</text><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="22" font-weight="700" x="270.71796769724494" y="238.0">N</text><text fill="#ca4b52" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="700" x="192.71796769724494" y="433.0">mg sinθ</text><text fill="#bd7d13" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="700" x="441.28203230275506" y="490.0">mg cosθ</text><rect fill="#f1f8f6" height="407" rx="15" stroke="#cce5db" stroke-width="1.5" width="310" x="738" y="180" /><text fill="#177b59" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="700" x="762" y="239">分解关系</text>