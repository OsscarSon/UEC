<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="700" version="1.1" viewBox="0 0 1100 700" width="1100"><defs /><rect fill="#f7faff" height="700" width="1100" x="0" y="0" /><rect fill="white" height="664" rx="22" stroke="#dbe5ef" stroke-width="2" width="1064" x="18" y="18" /><rect fill="#132c4b" height="98" rx="20" width="1064" x="18" y="18" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="31" font-weight="700" x="50" y="74">水平面上的受力图：辨认四个力</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="18" font-weight="400" x="48" y="149">选定研究对象，再从接触与相互作用找出真实力</text><rect fill="#eff6ff" height="410" rx="16" stroke="#ccdef2" stroke-width="1.5" width="610" x="55" y="178" /><line stroke="#5b687b" stroke-width="5" x1="100" x2="615" y1="445" y2="445" /><line stroke="#b1bfcc" stroke-width="1" x1="105" x2="92" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="130" x2="117" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="155" x2="142" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="180" x2="167" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="205" x2="192" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="230" x2="217" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="255" x2="242" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="280" x2="267" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="305" x2="292" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="330" x2="317" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="355" x2="342" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="380" x2="367" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="405" x2="392" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="430" x2="417" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="455" x2="442" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="480" x2="467" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="505" x2="492" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="530" x2="517" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="555" x2="542" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="580" x2="567" y1="445" y2="458" /><line stroke="#b1bfcc" stroke-width="1" x1="605" x2="592" y1="445" y2="458" /><rect fill="#d7e7ff" height="83" rx="10" stroke="#7697c1" stroke-width="1.5" width="135" x="290" y="360" /><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="356" y="408">物块 m</text><line stroke="#0b9488" stroke-width="5" x1="357" x2="357" y1="367" y2="230" /><polygon fill="#0b9488" points="357,230 362.3008858897744,241.87015622406 351.6991141102256,241.87015622406" /><text fill="#0b9488" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="21" font-weight="700" x="390" y="245">支持力 N</text><line stroke="#7758bb" stroke-width="5" x1="358" x2="358" y1="440" y2="558" /><polygon fill="#7758bb" points="358,558 352.6991141102256,546.12984377594 363.3008858897744,546.12984377594" /><text fill="#7758bb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="21" font-weight="700" x="397" y="555">重力 mg</text><line stroke="#2563eb" stroke-width="5" x1="425" x2="573" y1="401" y2="401" /><polygon fill="#2563eb" points="573,401 561.12984377594,406.3008858897744 561.12984377594,395.6991141102256" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="19" font-weight="700" x="488" y="378">拉力 F</text><line stroke="#dc4d54" stroke-width="5" x1="290" x2="165" y1="402" y2="402" /><polygon fill="#dc4d54" points="165,402 176.87015622406,396.6991141102256 176.87015622406,407.3008858897744" /><text fill="#dc4d54" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="19" font-weight="700" x="142" y="380">摩擦力 f</text><rect fill="#f0f8f7" height="410" rx="16" stroke="#cce6e0" stroke-width="1.5" width="366" x="685" y="178" /><text fill="#0b9488" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="21" font-weight="700" x="715" y="245">竖直方向（无加速度）</text><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="700" x="725" y="296">N − mg = 0</text><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="21" font-weight="700" x="715" y="380">水平方向</text><text fill="#132c4b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="700" x="725" y="433">F − f = ma</text><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="16" font-weight="400" x="710" y="523">受力图仅画作用在物块上的力。</text><rect fill="#edf6ff" height="43" rx="9" stroke="#dfebfa" stroke-width="1.5" width="1010" x="45" y="620" /><text fill="#5b687b" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="17" font-weight="400" x="65" y="647">前提：水平地面，拉力水平。若有额外竖直力、斜拉力或竖直加速度，方程需调整。</text></svg>