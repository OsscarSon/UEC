<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr_P12_braking_velocity_and_distance" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="90" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="38" font-weight="700" text-anchor="start" x="55" y="56">刹车运动：速度—时间图与位移</text><text fill="#51667c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="56" y="120">示例模型：初速 20 m/s，恒定加速度 −4 m/s^2，5 s 后停止</text><rect fill="#f7faff" height="480" rx="18" stroke="#d6e3f1" stroke-width="2" width="720" x="45" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="67" y="195">速度—时间关系：v = 20 − 4t</text><line marker-end="url(#arr_P12_braking_velocity_and_distance)" stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="130" x2="700" y1="555" y2="555" /><line marker-end="url(#arr_P12_braking_velocity_and_distance)" stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="130" x2="130" y1="555" y2="225" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="690" y="591">t / s</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="83" y="238">v / (m/s)</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="130" x2="130" y1="547" y2="563" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="130" y="588">0</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="232" x2="232" y1="547" y2="563" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="232" y="588">1</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="334" x2="334" y1="547" y2="563" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="334" y="588">2</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="436" x2="436" y1="547" y2="563" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="436" y="588">3</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="538" x2="538" y1="547" y2="563" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="538" y="588">4</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="640" x2="640" y1="547" y2="563" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="640" y="588">5</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="555" y2="555" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="113" y="561">0</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="490" y2="490" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="113" y="496">5</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="425" y2="425" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="113" y="431">10</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="360" y2="360" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="113" y="366">15</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="295" y2="295" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="113" y="301">20</text><polyline fill="none" points="130,295 640,555" stroke="#2563eb" stroke-linejoin="round" stroke-width="5" /><polygon fill="#dbeafe" opacity="0.82" points="130,555 130,295 640,555" /><polyline fill="none" points="130,295 640,555" stroke="#2563eb" stroke-linejoin="round" stroke-width="5" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="385" y="430">三角形面积 = 位移</text><rect fill="#f5fbf8" height="480" rx="18" stroke="#d6e3f1" stroke-width="2" width="360" x="795" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="817" y="195">计算与检验</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="823" y="242">停止时间：</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="823" y="279">0 = 20 − 4t</text><text fill="#0f977c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="823" y="316">t = 5 s</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="823" y="353" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="823" y="390">位移：</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="823" y="427">s = ½ × 5 × 20</text><text fill="#0f977c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="823" y="464">s = 50 m</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="823" y="501" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="823" y="538">注意：面积有方向</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="823" y="575">本例速度始终非负</text></svg>