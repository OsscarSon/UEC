<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="head" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L9 5 L0 10Z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="89" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="700" text-anchor="start" x="45" y="57">电阻串联与并联：电流和电压规律</text><text fill="#52677c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="45" y="123">理想导线与电源；示例：R₁=2 Ω，R₂=4 Ω，电源 U=12 V</text><rect fill="#f7faff" height="490" rx="14" stroke="#d6e2ee" stroke-width="2" width="550" x="40" y="160" /><rect fill="#f7faff" height="490" rx="14" stroke="#d6e2ee" stroke-width="2" width="550" x="610" y="160" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" x="68" y="215">串联</text><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" x="637" y="215">并联</text><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="100" x2="190" y1="304" y2="304" /><rect fill="#ffecd9" height="46" rx="4" stroke="#a76d2a" stroke-width="2" width="85" x="190" y="281" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="232" y="311">2 Ω</text><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="275" x2="300" y1="304" y2="304" /><rect fill="#ffecd9" height="46" rx="4" stroke="#a76d2a" stroke-width="2" width="85" x="300" y="281" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="342" y="311">4 Ω</text><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="385" x2="490" y1="304" y2="304" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="100" x2="100" y1="304" y2="475" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="490" x2="490" y1="304" y2="475" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="100" x2="271" y1="475" y2="475" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="271" x2="301" y1="475" y2="475" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="301" x2="301" y1="451" y2="499" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="314" x2="314" y1="461" y2="489" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="314" x2="344" y1="475" y2="475" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="344" x2="490" y1="475" y2="475" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="68" y="549">R总 = 2 + 4 = 6 Ω</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="68" y="590">I = U/R总 = 12/6 = 2 A</text><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="670" x2="670" y1="300" y2="470" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="1060" x2="1060" y1="300" y2="470" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="670" x2="820" y1="320" y2="320" /><rect fill="#ffecd9" height="46" rx="4" stroke="#a76d2a" stroke-width="2" width="85" x="820" y="297" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="862" y="327">2 Ω</text><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="905" x2="1060" y1="320" y2="320" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="670" x2="820" y1="415" y2="415" /><rect fill="#ffecd9" height="46" rx="4" stroke="#a76d2a" stroke-width="2" width="85" x="820" y="392" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="862" y="422">4 Ω</text><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="905" x2="1060" y1="415" y2="415" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="670" x2="827" y1="470" y2="470" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="827" x2="857" y1="470" y2="470" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="857" x2="857" y1="446" y2="494" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="870" x2="870" y1="456" y2="484" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="870" x2="900" y1="470" y2="470" /><line stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="900" x2="1060" y1="470" y2="470" /><text fill="#11816c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="636" y="549">1/R总 = 1/2 + 1/4</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="636" y="586">R总 = 4/3 Ω</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="636" y="620">I总 = 12/(4/3) = 9 A</text></svg>