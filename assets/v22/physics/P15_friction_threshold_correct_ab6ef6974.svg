<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1200 720" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr_P15_friction_threshold_correct" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker></defs><rect fill="white" height="720" width="1200" x="0" y="0" /><rect fill="#142c4c" height="90" width="1200" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="38" font-weight="700" text-anchor="start" x="55" y="56">静摩擦的自适应与最大值</text><text fill="#51667c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="56" y="120">质量 m=2 kg，水平地面 μs=0.40，g=10 N/kg；只讨论尚未滑动阶段</text><rect fill="#f7faff" height="480" rx="18" stroke="#d6e3f1" stroke-width="2" width="710" x="45" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="67" y="195">静摩擦 fs 对施力 F 的响应</text><line marker-end="url(#arr_P15_friction_threshold_correct)" stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="130" x2="705" y1="570" y2="570" /><line marker-end="url(#arr_P15_friction_threshold_correct)" stroke="#142c4c" stroke-linecap="round" stroke-width="3" x1="130" x2="130" y1="570" y2="240" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="680" y="609">F / N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="65" y="235">fs / N</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="130" x2="130" y1="564" y2="576" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="130" y="600">0</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="570" y2="570" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="112" y="575">0</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="230" x2="230" y1="564" y2="576" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="230" y="600">2</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="502" y2="502" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="112" y="507">2</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="330" x2="330" y1="564" y2="576" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="330" y="600">4</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="434" y2="434" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="112" y="439">4</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="430" x2="430" y1="564" y2="576" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="430" y="600">6</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="366" y2="366" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="112" y="371">6</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="530" x2="530" y1="564" y2="576" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="530" y="600">8</text><line stroke="#51667c" stroke-linecap="round" stroke-width="1" x1="123" x2="137" y1="298" y2="298" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="112" y="303">8</text><polyline fill="none" points="130,570 530,298" stroke="#2563eb" stroke-linejoin="round" stroke-width="6" /><circle cx="530" cy="298" fill="#d34f55" r="9" stroke="none" stroke-width="2" /><text fill="#d34f55" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="555" y="283">临界值 (8 N, 8 N)</text><line stroke="#51667c" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="2" x1="530" x2="530" y1="298" y2="570" /><text fill="#2563eb" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="350" y="410">fs = F</text><rect fill="#fff9f0" height="480" rx="18" stroke="#d6e3f1" stroke-width="2" width="365" x="790" y="155" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="812" y="195">计算与边界</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="236">N = mg = 20 N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="274">fs,max = μsN</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="312" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="350">= 0.40 × 20</text><text fill="#d34f55" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="815" y="388">= 8 N</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="426" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="464">例：F=5 N 时</text><text fill="#d34f55" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="815" y="502">fs=5 N，物体仍静止</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="540" /><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="578">超过最大值后是否滑动：</text><text fill="#142c4c" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="815" y="616">须结合其他受力判断</text></svg>