<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="bold" x="50" y="67">加热曲线：温度变化与潜热</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" x="48" y="126">纯物质在恒定压强下受热；图中时间和温度均为示意，不代表任何特定物质</text><rect fill="#f4f8ff" height="343" rx="15" stroke="#dae6f5" stroke-width="1.5" width="580" x="45" y="151" /><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="183">温度—供热量图</text><line stroke="#556a83" stroke-linecap="round" stroke-width="2" x1="104" x2="573" y1="450" y2="450" /><polygon fill="#556a83" points="573,450 563.3465918192059,455.2736809246462 563.3465918192059,444.7263190753538" /><line stroke="#556a83" stroke-linecap="round" stroke-width="2" x1="104" x2="104" y1="450" y2="209" /><polygon fill="#556a83" points="104,209 109.27368092464623,218.6534081807941 98.72631907535377,218.6534081807941" /><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="end" x="568" y="477">供热量 Q</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="98" y="196">温度 T</text><polyline fill="none" points="104,415 212,345 326,345 421,235 545,235" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="155" y="380">固体升温</text><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="265" y="326">熔化平台</text><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="371" y="296">液体升温</text><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="478" y="215">沸腾平台</text><line stroke="#b9c4d8" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1.4" x1="212" x2="212" y1="345" y2="449" /><line stroke="#b9c4d8" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1.4" x1="326" x2="326" y1="345" y2="449" /><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="260" y="466">ΔQ = mL(熔化)</text><rect fill="#f4f8ff" height="343" rx="15" stroke="#dae6f5" stroke-width="1.5" width="267" x="645" y="151" /><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="663" y="183">计算公式</text><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="670" y="234">温度升高</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="670" y="272">Q = mcΔT</text><text fill="#dd8c35" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="670" y="334">相变平台</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="670" y="372">Q = mL</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="669" y="423">m：质量  L：比潜热</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="669" y="454">c：比热容</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">理想恒压相变过程中，温度平台对应吸热但温度不变；总热量须分段相加。</text></svg>