<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1000 640" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="640" width="1000" x="0" y="0" /><rect fill="#142c4a" height="86" width="1000" x="0" y="0" /><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31px" font-weight="bold" x="44" y="56">自由落体：v–t 图与位移面积</text><text fill="#617389" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17px" x="44" y="111">物理 · 直线运动（具体节号待核） · 教学示意</text><rect fill="#f0f5fa" height="454" rx="18" ry="18" stroke="#d9e4f0" stroke-width="2" width="610" x="36" y="140" /><text fill="#2867ad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23px" font-weight="bold" x="59" y="180">忽略空气阻力，取向下为正</text><line stroke="#142c4a" stroke-width="2.3" x1="115" x2="588" y1="540" y2="540" /><polygon fill="#142c4a" points="588,540 578.9955289764732,544.3496553411123 578.9955289764732,535.6503446588877" /><line stroke="#142c4a" stroke-width="2.3" x1="115" x2="115" y1="540" y2="215" /><polygon fill="#142c4a" points="115,215 119.34965534111231,224.00447102352678 110.6503446588877,224.00447102352678" /><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="592" y="547">t / s</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="105" y="204">v / (m/s)</text><polygon fill="#bad9f3" opacity="0.82" points="115.0,540.0 509.2857142857143,540.0 509.2857142857143,272.5714285714286" /><line stroke="#2867ad" stroke-width="4" x1="115.0" x2="509.2857142857143" y1="540.0" y2="272.5714285714286" /><circle cx="509.2857142857143" cy="272.5714285714286" fill="#bd4052" r="6" /><line stroke="#617389" stroke-dasharray="5,5" stroke-width="1.6" x1="509.2857142857143" x2="509.2857142857143" y1="272.5714285714286" y2="540" /><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="502.2857142857143" y="565">3</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="91" y="232">30</text><text fill="#2867ad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23px" font-weight="bold" x="455" y="295">v = gt</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18px" font-weight="normal" x="290" y="481">位移 = 三角形面积</text><rect fill="#f0f5fa" height="454" rx="18" ry="18" stroke="#d9e4f0" stroke-width="2" width="295" x="670" y="140" /><text fill="#2867ad" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23px" font-weight="bold" x="693" y="180">计算示例</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19px" font-weight="normal" x="689" y="247">g = 10 m/s²</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19px" font-weight="normal" x="689" y="311">t = 3 s</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19px" font-weight="normal" x="689" y="375">末速度 = gt = 30 m/s</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19px" font-weight="normal" x="689" y="439">位移 = ½ × 3 × 30</text><text fill="#142c4a" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19px" font-weight="normal" x="689" y="503">= 45 m（向下）</text><text fill="#617389" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17px" font-weight="normal" x="42" y="622">使用前提：由静止释放；g 近似恒定；忽略空气阻力。</text></svg>