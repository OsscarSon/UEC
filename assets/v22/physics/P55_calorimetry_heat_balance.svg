<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="590px" version="1.1" viewBox="0 0 960 590" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f7faff" height="590" width="960" x="0" y="0" /><rect fill="white" height="550" rx="22" stroke="#dbe7f5" stroke-width="2" width="916" x="22" y="18" /><rect fill="#17345d" height="76" rx="22" width="916" x="22" y="18" /><text fill="white" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="bold" x="50" y="67">混合量热：热量守恒与温度平衡</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" x="48" y="126">假设容器绝热、无相变，忽略容器吸热；热水与冷水的比热容相同</text><rect fill="#f4f8ff" height="333" rx="15" stroke="#dae6f5" stroke-width="1.5" width="520" x="45" y="157" /><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="63" y="189">两份水混合</text><rect fill="white" height="140" rx="12" stroke="#556a83" stroke-width="2" width="111" x="137" y="244" /><rect fill="#dc4b4b" height="85" opacity="0.23" rx="8" width="103" x="141" y="295" /><text fill="#dc4b4b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="192" y="228">热水</text><text fill="#dc4b4b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="192" y="325">80 °C</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="192" y="410">0.20 kg</text><rect fill="white" height="140" rx="12" stroke="#556a83" stroke-width="2" width="111" x="347" y="244" /><rect fill="#2563eb" height="85" opacity="0.23" rx="8" width="103" x="351" y="295" /><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="402" y="228">冷水</text><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="402" y="325">20 °C</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="402" y="410">0.30 kg</text><line stroke="#0f766e" stroke-linecap="round" stroke-width="3" x1="259" x2="343" y1="330" y2="330" /><polygon fill="#0f766e" points="343,330 333.3465918192059,335.2736809246462 333.3465918192059,324.7263190753538" /><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="270" y="312">混合</text><rect fill="#f4f8ff" height="333" rx="15" stroke="#dae6f5" stroke-width="1.5" width="330" x="581" y="157" /><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="599" y="189">热平衡计算</text><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="599" y="227">热水放热 = 冷水吸热</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="598" y="269">0.20c(80 − T)</text><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="598" y="304">= 0.30c(T − 20)</text><text fill="#556a83" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="598" y="354">16 − 0.2T = 0.3T − 6</text><text fill="#2563eb" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="bold" text-anchor="start" x="600" y="399">T = 44 °C</text><text fill="#0f766e" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="600" y="455">20 °C &lt; T &lt; 80 °C ✓</text><rect fill="#eaf4ff" height="37" rx="12" width="860" x="49" y="515" /><text fill="#17345d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="66" y="540">一般式：ΣQ = 0；若容器吸热或向环境散热，必须把相应热量项加入方程。</text></svg>