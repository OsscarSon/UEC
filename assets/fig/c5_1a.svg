idth="1"/><circle cx="180.0" cy="144.0" r="4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="180" y="160" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="normal">极小的带正电的核</text><text x="180" y="176" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="normal">电子绕核运动</text><text x="180" y="192" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">原子内部大部分是空的</text><ellipse cx="298" cy="100" rx="16" ry="16" fill="none" stroke="#9ca3af" stroke-width="1.2"/><ellipse cx="298" cy="100" rx="30" ry="30" fill="none" stroke="#9ca3af" stroke-width="1.2"/><ellipse cx="298" cy="100" rx="44" ry="44" fill="none" stroke="#9ca3af" stroke-width="1.2"/><circle cx="298" cy="100" r="4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><circle cx="314" cy="100" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><circle cx="277" cy="79" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><circle cx="329" cy="131" r="3.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><path d="M322,66 Q334,56 326,48" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#o)" stroke-linejoin="round" stroke-linecap="round"/><text x="298" y="160" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="normal">电子在特定能级上运动</text><text x="298" y="176" text-anchor="middle" fill="#ea580c" font-size="10" font-weight="normal">跃迁时吸收或放出光子</text><text x="298" y="194" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">能解释氢原子光谱</text><text x="180" y="220" text-anchor="middle" fill="#555" font-size="11" font-weight="normal">每个模型都是为了解释当时的实验事实而提出的</text></svg>