<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 224" font-family="-apple-system,PingFang SC,Noto Sans SC,sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><rect width="360" height="224" rx="10" fill="#fff" stroke="#ddd"/><text x="16" y="22" text-anchor="start" fill="#555" font-size="11" font-weight="normal">① 先配 C</text><text x="180" y="41" text-anchor="middle" font-size="14" fill="#222">C₂H₆ + O₂ → <tspan fill="#dc2626">2</tspan>CO₂ + H₂O</text><text x="16" y="62" text-anchor="start" fill="#555" font-size="11" font-weight="normal">② 再配 H</text><text x="180" y="81" text-anchor="middle" font-size="14" fill="#222">C₂H₆ + O₂ → 2CO₂ + <tspan fill="#dc2626">3</tspan>H₂O</text><text x="16" y="102" text-anchor="start" fill="#555" font-size="11" font-weight="normal">③ 最后配 O（用分数）</text><text x="180" y="121" text-anchor="middle" font-size="14" fill="#222">C₂H₆ + <tspan fill="#dc2626">7/2</tspan> O₂ → 2CO₂ + 3H₂O</text><text x="16" y="142" text-anchor="start" fill="#555" font-size="11" font-weight="normal">④ 同乘 2，化为整数</text><text x="180" y="161" text-anchor="middle" font-size="14" fill="#222"><tspan fill="#dc2626">2</tspan>C₂H₆ + <tspan fill="#dc2626">7</tspan>O₂ → <tspan fill="#dc2626">4</tspan>CO₂ + <tspan fill="#dc2626">6</tspan>H₂O</text><text x="16" y="182" text-anchor="start" fill="#555" font-size="11" font-weight="normal">⑤ 检查</text><text x="180" y="201" text-anchor="middle" font-size="14" fill="#222">C：4 = 4　H：12 = 12　O：14 = 14</text></svg>