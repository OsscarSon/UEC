<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-sol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-cool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">固体与气体溶解度曲线、饱和区及结晶分离方法（化中 p.74–80）</text>

  <!-- Left Panel: Solid Solubility Curve -->
  <rect x="24" y="48" width="424" height="328" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="236" y="68" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">一、典型固体物质在水中的溶解度曲线（图 18-16 / 18-17）</text>

  <!-- Grid & Axes -->
  <!-- Plot area: x from 72 to 412 (width 340, 0-100C => 3.4 px/C), y from 276 down to 96 (height 180, 0-200g => 0.9 px/g) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="72" y1="240" x2="412" y2="240"/>
    <line x1="72" y1="204" x2="412" y2="204"/>
    <line x1="72" y1="168" x2="412" y2="168"/>
    <line x1="72" y1="132" x2="412" y2="132"/>
    <line x1="72" y1="96" x2="412" y2="96"/>
    <line x1="140" y1="96" x2="140" y2="276"/>
    <line x1="208" y1="96" x2="208" y2="276"/>
    <line x1="276" y1="96" x2="276" y2="276"/>
    <line x1="344" y1="96" x2="344" y2="276"/>
  </g>
  <line x1="72" y1="276" x2="420" y2="276" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-sol)"/>
  <line x1="72" y1="276" x2="72" y2="86" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-sol)"/>

  <!-- Axis Labels -->
  <text x="58" y="84" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#334155">s/(g/100g水)</text>
  <text x="415" y="294" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#334155">温度/℃</text>
  <text x="66" y="280" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">0</text>
  <text x="66" y="244" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">40</text>
  <text x="66" y="208" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">80</text>
  <text x="66" y="172" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">120</text>
  <text x="66" y="136" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">160</text>
  <text x="66" y="100" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">200</text>
  <text x="140" y="290" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">20</text>
  <text x="208" y="290" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">40</text>
  <text x="276" y="290" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">60</text>
  <text x="344" y="290" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">80</text>
  <text x="412" y="290" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">100</text>

  <!-- Curves -->
  <!-- NH4NO3: (0,120)->(72,168), (20,190)->(140,105) -->
  <path d="M 72 168 Q 112 142 145 98" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <text x="150" y="108" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">NH₄NO₃</text>

  <!-- KNO3: (0,13.3)->(72,264), (20,31.6)->(140,247.5), (40,63.9)->(208,218.5), (60,110)->(276,177), (80,169)->(344,123.9), (90,201)->(378,95) -->
  <path d="M 72 264 Q 140 250 208 218.5 T 344 124 L 375 96" fill="none" stroke="#db2777" stroke-width="2.6"/>
  <text x="338" y="108" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#db2777">KNO₃ (陡升型)</text>

  <!-- KNO3 cooling crystallization guide: 80C (344,124) -> 20C (140,247.5) -->
  <circle cx="344" cy="124" r="3.5" fill="#2563eb"/>
  <circle cx="140" cy="247.5" r="3.5" fill="#2563eb"/>
  <path d="M 344 124 L 140 124 L 140 242" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr-cool)"/>
  <text x="242" y="118" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1d4ed8">降温结晶(80℃→20℃)</text>

  <!-- NaCl: (0,35.7)->(72,243.9) to (100,39.8)->(412,240.2) -->
  <path d="M 72 244 L 412 240" fill="none" stroke="#059669" stroke-width="2.4"/>
  <text x="355" y="233" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#059669">NaCl (平缓型)</text>

  <!-- Ca(OH)2 inset note curve at bottom of plot -->
  <path d="M 72 269 Q 240 271 412 273.5" fill="none" stroke="#9333ea" stroke-width="2"/>
  <text x="275" y="266" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#7e22ce">Ca(OH)₂ (极微溶，随T升高而减小 0.18→0.07g)</text>

  <!-- Region labels -->
  <rect x="82" y="182" width="110" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="137" y="197" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#92400e">曲线上方(KNO₃):</text>
  <text x="137" y="211" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#92400e">过饱和(不稳定析晶)</text>

  <rect x="255" y="192" width="146" height="32" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="328" y="206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#1e3a8a">曲线上：饱和溶液</text>
  <text x="328" y="219" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e40af">曲线下方：不饱和溶液</text>

  <!-- Bottom summary box in left panel -->
  <rect x="34" y="302" width="404" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="320" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">结晶提纯与盐碱湖口诀（p.78–80）：</text>
  <text x="44" y="338" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#334155">1. KNO₃ 混少量 NaCl → <tspan font-weight="700" fill="#db2777">冷却热饱和溶液（降温结晶）</tspan>提纯 KNO₃（冬天捞碱）。</text>
  <text x="44" y="355" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#334155">2. NaCl 溶解度受温度影响小 → <tspan font-weight="700" fill="#059669">蒸发溶剂结晶</tspan>（盐田法晒盐）。</text>

  <!-- Right Panel: Gas Solubility & Dynamic Equilibrium -->
  <rect x="460" y="48" width="276" height="328" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="598" y="68" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">二、气体溶解度（图 18-19）与动态平衡</text>

  <!-- Gas vs Temp -->
  <rect x="474" y="80" width="248" height="104" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
  <text x="598" y="96" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#be123c">1. 温度升高 → 气体溶解度减小</text>
  <line x1="504" y1="162" x2="626" y2="162" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-sol)"/>
  <line x1="504" y1="162" x2="504" y2="106" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-sol)"/>
  <path d="M 506 112 Q 535 142 618 154" fill="none" stroke="#e11d48" stroke-width="2.2"/>
  <text x="500" y="114" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#475569">s</text>
  <text x="625" y="174" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#475569">T/℃</text>
  <text x="634" y="128" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#881337">O₂ 随水温</text>
  <text x="634" y="142" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#881337">升高而下降</text>
  <text x="634" y="156" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#9f1239">(黄昏鱼浮头)</text>

  <!-- Gas vs Pressure -->
  <rect x="474" y="194" width="248" height="104" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="598" y="210" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">2. 压强增大 → 气体溶解度增大</text>
  <line x1="504" y1="276" x2="626" y2="276" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-sol)"/>
  <line x1="504" y1="276" x2="504" y2="220" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-sol)"/>
  <line x1="504" y1="276" x2="616" y2="224" stroke="#2563eb" stroke-width="2.2"/>
  <text x="500" y="228" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#475569">s</text>
  <text x="625" y="288" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#475569">P/10⁵ Pa</text>
  <text x="634" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e3a8a">加压制汽水</text>
  <text x="634" y="256" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e3a8a">开盖减压</text>
  <text x="634" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#1d4ed8">(CO₂ 逸出)</text>

  <!-- Dynamic equilibrium card -->
  <rect x="474" y="306" width="248" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="598" y="324" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#166534">饱和溶液的溶解-结晶平衡（p.75）</text>
  <text x="598" y="342" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">未溶解固态溶质 ⇌ 溶液中的溶质</text>
  <text x="598" y="357" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#15803d">溶解速率 = 结晶速率；加“晶种”破除过饱和</text>
</svg>
