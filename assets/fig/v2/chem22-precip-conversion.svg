<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-conv-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-conv-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-conv-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#0f172a">溶度积原理、分步沉淀先后顺序与沉淀转化双向路径（化中 p.224–229）</text>

  <!-- Left Panel: Qc vs Ksp & Fractional Precipitation -->
  <rect x="24" y="52" width="346" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="197" y="74" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">一、溶度积原理与分步沉淀判据</text>

  <!-- Three states of Qc vs Ksp -->
  <rect x="38" y="88" width="102" height="72" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="89" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#065f46">Qc &lt; Ksp</text>
  <text x="89" y="127" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#047857">不饱和溶液</text>
  <text x="89" y="145" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#064e3b">无沉淀 / 继续溶解</text>

  <rect x="146" y="88" width="102" height="72" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="197" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Qc = Ksp</text>
  <text x="197" y="127" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1d4ed8">恰好饱和溶液</text>
  <text x="197" y="145" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1e3a8a">沉淀 ⇌ 溶解平衡</text>

  <rect x="254" y="88" width="102" height="72" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="305" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Qc &gt; Ksp</text>
  <text x="305" y="127" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#b91c1c">过饱和溶液</text>
  <text x="305" y="145" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f1d1d">有固体沉淀析出</text>

  <!-- Fractional Precipitation Example (Activity 2) -->
  <rect x="38" y="174" width="318" height="186" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="197" y="195" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f172a">分步沉淀实例（活动2：莫尔法滴定）</text>
  <text x="197" y="213" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#334155">[Cl⁻]=0.005 mol/L + [CrO₄²⁻]=0.01 mol/L ← 滴入 AgNO₃</text>

  <!-- Step 1 -->
  <rect x="52" y="226" width="290" height="44" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="64" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1e293b">① 先析出白色 AgCl↓（所需 [Ag⁺] 更小）</text>
  <text x="64" y="261" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">[Ag⁺] = Ksp / [Cl⁻] = 3.54 × 10⁻⁸ mol/L</text>

  <path d="M 197 270 L 197 288" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-conv-blue)"/>
  <text x="208" y="283" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1d4ed8">Cl⁻ 几乎沉完，[Ag⁺] 继续升高</text>

  <!-- Step 2 -->
  <rect x="52" y="290" width="290" height="44" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="64" y="308" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#991b1b">② 后析出砖红色 Ag₂CrO₄↓（指示终点）</text>
  <text x="64" y="325" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f1d1d">[Ag⁺] = √(Ksp / [CrO₄²⁻]) = 3.0 × 10⁻⁵ mol/L</text>

  <text x="197" y="351" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#0f172a">口诀：先达 Ksp（所需沉淀剂浓度更低）者先沉淀！</text>

  <!-- Right Panel: Precipitate Conversion -->
  <rect x="384" y="52" width="352" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="560" y="74" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">二、沉淀转化的本质与两大应用方向</text>

  <!-- Path 1: Forward (Larger Ksp -> Smaller Ksp) -->
  <rect x="398" y="88" width="324" height="106" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="560" y="108" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">方向1：易向更难溶转化（活动3：Ksp 依次骤减）</text>

  <rect x="408" y="122" width="84" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="139" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">AgCl (白)</text>
  <text x="450" y="155" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">1.77×10⁻¹⁰</text>

  <path d="M 492 142 L 520 142" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-conv-amber)"/>
  <text x="506" y="133" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#92400e">+Br⁻</text>

  <rect x="522" y="122" width="84" height="40" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="564" y="139" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#854d0e">AgBr(淡黄)</text>
  <text x="564" y="155" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#a16207">5.35×10⁻¹³</text>

  <path d="M 606 142 L 626 142" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-conv-amber)"/>
  <text x="616" y="133" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#92400e">+I⁻</text>

  <rect x="628" y="122" width="84" height="40" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="670" y="139" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#713f12">AgI (黄)</text>
  <text x="670" y="155" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#854d0e">8.51×10⁻¹⁷</text>

  <text x="560" y="183" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#78350f">含氟牙膏：Ca₅(PO₄)₃(OH) + F⁻ → Ca₅(PO₄)₃F（更抗酸防龋）</text>

  <!-- Path 2: Reverse under high reagent concentration -->
  <rect x="398" y="206" width="324" height="156" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="560" y="226" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">方向2：高浓度试剂使“更难溶 → 较易溶”（除水垢/制钡盐）</text>

  <rect x="410" y="242" width="92" height="48" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="456" y="261" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#0f172a">BaSO₄ / CaSO₄</text>
  <text x="456" y="278" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">不溶于酸的沉淀</text>

  <path d="M 504 266 L 548 266" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-conv-blue)"/>
  <text x="526" y="253" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8">饱和</text>
  <text x="526" y="282" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8">Na₂CO₃</text>

  <rect x="550" y="242" width="84" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="592" y="261" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">BaCO₃ / CaCO₃</text>
  <text x="592" y="278" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1d4ed8">疏松易溶于酸</text>

  <path d="M 636 266 L 664 266" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-conv-green)"/>
  <text x="650" y="256" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#047857">+H⁺</text>

  <rect x="666" y="242" width="46" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="689" y="261" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">溶解</text>
  <text x="689" y="278" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#047857">CO₂↑</text>

  <text x="560" y="314" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1e293b">BaSO₄(s) + CO₃²⁻(aq) ⇌ BaCO₃(s) + SO₄²⁻(aq)</text>
  <text x="560" y="334" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.8" fill="#334155">虽 Ksp(BaSO₄)=1.07×10⁻¹⁰ &lt; Ksp(BaCO₃)=2.58×10⁻⁹，</text>
  <text x="560" y="350" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.8" fill="#1d4ed8">但高浓 CO₃²⁻ 使 Qc(BaCO₃) &gt; Ksp，多次换液即可转化！</text>
</svg>
