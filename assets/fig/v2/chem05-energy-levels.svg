<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="auto">
  <rect x="0" y="0" width="760" height="420" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="396" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="40" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">氢原子玻尔能阶跃迁与多电子能级交错排布图（化上 p.115–125）</text>

  <!-- Left Panel: Bohr Hydrogen Energy Levels & Balmer Spectrum -->
  <rect x="26" y="56" width="346" height="338" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="26" y="56" width="346" height="34" rx="10" fill="#2563eb"/>
  <text x="199" y="78" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">一、玻尔理论：氢原子能阶跃迁与可见光区线光谱</text>

  <!-- Energy level lines (n=1 to n=6) -->
  <line x1="62" y1="312" x2="224" y2="312" stroke="#1e293b" stroke-width="2.5"/>
  <text x="44" y="316" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">n=1</text>
  <text x="230" y="316" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">基态 (K层)</text>

  <line x1="62" y1="228" x2="224" y2="228" stroke="#1e293b" stroke-width="2.2"/>
  <text x="44" y="232" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">n=2</text>
  <text x="230" y="232" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">巴耳末系终点</text>

  <line x1="62" y1="176" x2="224" y2="176" stroke="#334155" stroke-width="1.8"/>
  <text x="44" y="180" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#334155">n=3</text>

  <line x1="62" y1="146" x2="224" y2="146" stroke="#334155" stroke-width="1.6"/>
  <text x="44" y="150" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#334155">n=4</text>

  <line x1="62" y1="126" x2="224" y2="126" stroke="#475569" stroke-width="1.4"/>
  <text x="44" y="130" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#475569">n=5</text>

  <line x1="62" y1="110" x2="224" y2="110" stroke="#475569" stroke-width="1.2"/>
  <text x="44" y="114" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#475569">n=6</text>
  <text x="230" y="115" font-family="PingFang SC, sans-serif" font-size="11" fill="#475569">高能激发态</text>

  <!-- Transition arrows downward to n=2 -->
  <defs>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#7c3aed"/></marker>
    <marker id="arr-up" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="arr-dark" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#0f172a"/></marker>
  </defs>

  <!-- Absorb arrow n=1 -> n=4 -->
  <line x1="76" y1="308" x2="76" y2="152" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-up)"/>
  <text x="82" y="274" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c">吸能跃迁</text>

  <!-- Emission arrows to n=2 -->
  <line x1="128" y1="178" x2="128" y2="222" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)"/>
  <line x1="154" y1="148" x2="154" y2="222" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <line x1="180" y1="128" x2="180" y2="222" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <line x1="206" y1="112" x2="206" y2="222" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-purple)"/>

  <text x="232" y="160" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">高→低放光：</text>
  <text x="232" y="178" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">ΔE = E高 − E低 = hν</text>
  <text x="232" y="196" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">能阶不连续 ⇒ 线光谱</text>

  <!-- Spectrum bar (Fig 5-15 textbook wavelengths) -->
  <rect x="44" y="330" width="310" height="24" rx="4" fill="#1e293b"/>
  <line x1="78" y1="331" x2="78" y2="353" stroke="#a855f7" stroke-width="3"/>
  <line x1="104" y1="331" x2="104" y2="353" stroke="#3b82f6" stroke-width="3"/>
  <line x1="152" y1="331" x2="152" y2="353" stroke="#22c55e" stroke-width="3"/>
  <line x1="296" y1="331" x2="296" y2="353" stroke="#ef4444" stroke-width="3"/>
  <text x="78" y="368" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#6b21a8">紫 4.10</text>
  <text x="114" y="368" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#1d4ed8">蓝 4.34</text>
  <text x="158" y="368" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#15803d">绿 4.86</text>
  <text x="296" y="368" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#b91c1c">红 6.56 (×10⁻⁷m)</text>
  <text x="199" y="384" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#334155">图 5-15 氢原子可见光区四条特征线光谱</text>

  <!-- Right Panel: Aufbau Energy Interleaving & Filling Order -->
  <rect x="388" y="56" width="346" height="338" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="388" y="56" width="346" height="34" rx="10" fill="#7c3aed"/>
  <text x="561" y="78" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">二、多电子能量最低原理：能阶交错与填充次序</text>

  <!-- Diagonal Filling Grid (Fig 5-24) -->
  <g font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
    <!-- Row n=1 -->
    <circle cx="430" cy="116" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="430" y="120" fill="#1e293b">1s</text>
    <!-- Row n=2 -->
    <circle cx="430" cy="152" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="430" y="156" fill="#1e293b">2s</text>
    <circle cx="484" cy="152" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="484" y="156" fill="#1e293b">2p</text>
    <!-- Row n=3 -->
    <circle cx="430" cy="188" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="430" y="192" fill="#1e293b">3s</text>
    <circle cx="484" cy="188" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="484" y="192" fill="#1e293b">3p</text>
    <circle cx="538" cy="188" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="538" y="192" fill="#92400e">3d</text>
    <!-- Row n=4 -->
    <circle cx="430" cy="224" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="430" y="228" fill="#92400e">4s</text>
    <circle cx="484" cy="224" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="484" y="228" fill="#1e293b">4p</text>
    <circle cx="538" cy="224" r="14" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="538" y="228" fill="#1e293b">4d</text>
    <circle cx="592" cy="224" r="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="592" y="228" fill="#1e293b">4f</text>
    <!-- Row n=5 -->
    <circle cx="430" cy="260" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="430" y="264" fill="#1e293b">5s</text>
    <circle cx="484" cy="260" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="484" y="264" fill="#1e293b">5p</text>
    <circle cx="538" cy="260" r="14" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="538" y="264" fill="#1e293b">5d</text>
    <circle cx="592" cy="260" r="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="592" y="264" fill="#1e293b">5f</text>
  </g>

  <!-- Diagonal arrows (top-right to bottom-left) -->
  <line x1="444" y1="106" x2="416" y2="128" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-purple)"/>
  <line x1="444" y1="142" x2="416" y2="164" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-purple)"/>
  <line x1="498" y1="142" x2="416" y2="200" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-purple)"/>
  <line x1="498" y1="178" x2="416" y2="236" stroke="#d97706" stroke-width="2" marker-end="url(#arr-up)"/>
  <line x1="552" y1="178" x2="416" y2="272" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-purple)"/>
  <line x1="552" y1="214" x2="470" y2="272" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-purple)"/>

  <!-- Annotation Box on Right -->
  <rect x="618" y="102" width="104" height="172" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="670" y="122" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#5b21b6">能级交错核心</text>
  <text x="670" y="142" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0f172a">E(4s) &lt; E(3d)</text>
  <text x="670" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">₁₉K: 排完 3p</text>
  <text x="670" y="176" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">先填 4s¹ 再填 3d</text>
  <line x1="628" y1="188" x2="712" y2="188" stroke="#e2e8f0"/>
  <text x="670" y="206" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#b45309">特例（p.125–126）</text>
  <text x="670" y="224" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#78350f">₂₄Cr: 3d⁵ 4s¹</text>
  <text x="670" y="240" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#78350f">（d半满更稳）</text>
  <text x="670" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#78350f">₂₉Cu: 3d¹⁰ 4s¹</text>
  <text x="670" y="271" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#78350f">（d全满更稳）</text>

  <!-- Bottom Sequence Strip -->
  <rect x="404" y="290" width="316" height="88" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="562" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#5b21b6">三大排布规律（p.123–126）</text>
  <text x="414" y="330" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">1. 能量最低：1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p</text>
  <text x="414" y="348" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">2. 鲍利不相容：每轨域最多 2 个自旋相反电子（↑↓）</text>
  <text x="414" y="366" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">3. 汉德规则：简并轨域先分占且自旋平行（↑ ↑ ↑）</text>
</svg>
