<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="42" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#0f172a">化学反应与物质组成的三大基本定量定律（化上 p.45–50）</text>

  <!-- Card 1: Conservation -->
  <rect x="28" y="62" width="222" height="308" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <rect x="28" y="62" width="222" height="42" rx="10" fill="#10b981"/>
  <text x="139" y="88" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1. 物质不灭定律</text>
  <text x="139" y="126" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#065f46">研究：同一反应 前 vs 后</text>
  <rect x="44" y="140" width="190" height="58" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="139" y="164" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">∑m(参加反应物) = ∑m(产物)</text>
  <text x="139" y="185" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">微观：原子种类·数目·质量不变</text>
  <text x="42" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#065f46">活动探究1（p.46）：</text>
  <text x="42" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1e293b">• 白磷密闭燃烧：细沙+塞紧+冷却</text>
  <text x="42" y="260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1e293b">• BaCl₂ + H₂SO₄ → BaSO₄↓</text>
  <rect x="44" y="280" width="190" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="139" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309">高频陷阱</text>
  <text x="139" y="320" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#78350f">① 未反应过量物质不可计入</text>
  <text x="139" y="338" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#78350f">② 气体或 MgO 白烟易致失重</text>

  <!-- Card 2: Definite Proportions -->
  <rect x="269" y="62" width="222" height="308" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="269" y="62" width="222" height="42" rx="10" fill="#3b82f6"/>
  <text x="380" y="88" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2. 定比定律（定组成）</text>
  <text x="380" y="126" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1e40af">研究：同一种纯净化合物</text>
  <rect x="285" y="140" width="190" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="380" y="164" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">m(A) : m(B) = 常数（纯物）</text>
  <text x="380" y="185" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">示例：任何纯水 H : O = 1 : 8</text>
  <text x="283" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1e40af">活动探究2（p.48）：</text>
  <text x="283" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1e293b">• 2.0 g NaOH + 6.25 g 胆矾</text>
  <text x="283" y="260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1e293b">• 4.0 g NaOH 仍仅得 2.45 g 沉淀</text>
  <rect x="285" y="280" width="190" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309">高频陷阱</text>
  <text x="380" y="320" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#78350f">① 适用于纯净物，混合物不适用</text>
  <text x="380" y="338" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#78350f">② 限量试剂决定最终产物质量</text>

  <!-- Card 3: Multiple Proportions -->
  <rect x="510" y="62" width="222" height="308" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <rect x="510" y="62" width="222" height="42" rx="10" fill="#8b5cf6"/>
  <text x="621" y="88" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3. 倍比定律（道尔顿）</text>
  <text x="621" y="126" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">研究：同两元素 ≥2 种化合物</text>
  <rect x="526" y="140" width="190" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="621" y="164" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">固定 m(甲) ⇒ m(乙₁):m(乙₂)</text>
  <text x="621" y="185" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">必成简单整数比（= 下标比）</text>
  <text x="524" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">经典例证（p.50）：</text>
  <text x="524" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1e293b">• CO vs CO₂（同取 12 g C）：</text>
  <text x="524" y="260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#1e293b">  O 质量 16 g : 32 g = 1 : 2</text>
  <rect x="526" y="280" width="190" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="621" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309">高频陷阱</text>
  <text x="621" y="320" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#78350f">① 不可拿两化合物百分比直接相除</text>
  <text x="621" y="338" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#78350f">② 必先算 m(乙)/m(甲) 再求比</text>
</svg>
