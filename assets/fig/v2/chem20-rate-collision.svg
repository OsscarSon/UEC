<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">化学反应速率曲线特征、接触面积对比与有效碰撞模型（化中 p.156–166）</text>

  <!-- Left Panel: Curves -->
  <rect x="24" y="50" width="346" height="326" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="197" y="71" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">一、反应速率图像与常见对比曲线</text>

  <!-- Sub-graph 1: V-t curve (Instantaneous rate + Lump vs Powder) -->
  <rect x="36" y="82" width="322" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="197" y="99" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">1. 生成物体积 V–t 曲线：切线斜率 dV/dt = 瞬时速率</text>

  <!-- Axes 1 -->
  <line x1="66" y1="204" x2="218" y2="204" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <line x1="66" y1="204" x2="66" y2="112" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <text x="58" y="120" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#334155">V</text>
  <text x="215" y="216" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#334155">t</text>

  <!-- Solid curve: lump a g -->
  <path d="M 66 204 Q 100 132 162 126 L 204 126" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <!-- Dashed curve: powder b g (b < a), steeper initial slope, lower plateau -->
  <path d="M 66 204 Q 78 148 112 146 L 204 146" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Tangent indicator at t1 -->
  <line x1="76" y1="194" x2="108" y2="132" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="88" cy="171" r="3" fill="#2563eb"/>
  <text x="114" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">块状 a g (高平台)</text>
  <text x="116" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#dc2626">粉末 b g (b&lt;a, 初速大)</text>

  <!-- Note box on right of sub-graph 1 -->
  <rect x="226" y="112" width="124" height="98" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="234" y="129" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1e40af">读图铁律（思考题20b）</text>
  <text x="234" y="146" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e293b">• 看斜率：越陡速率越大</text>
  <text x="234" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e293b">• 看拐点：越早平越快</text>
  <text x="234" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e293b">• 看平台：由限量物质定</text>
  <text x="234" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#dc2626">  b &lt; a → 产气平台更低</text>

  <!-- Sub-graph 2: R-t curve for Mg + HCl (exothermic) -->
  <rect x="36" y="232" width="322" height="134" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="197" y="249" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">2. 放热反应速率 R–t 曲线（如 Mg + 稀 HCl，思考题20e）</text>

  <!-- Axes 2 -->
  <line x1="66" y1="348" x2="218" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <line x1="66" y1="348" x2="66" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <text x="58" y="270" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#334155">R</text>
  <text x="215" y="360" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#334155">t</text>

  <!-- Bell-like R-t curve -->
  <path d="M 66 322 Q 98 272 118 274 Q 148 278 188 348" fill="none" stroke="#ea580c" stroke-width="2.4"/>
  <line x1="115" y1="274" x2="115" y2="348" stroke="#64748b" stroke-width="1.1" stroke-dasharray="3,3"/>
  <line x1="154" y1="296" x2="154" y2="348" stroke="#64748b" stroke-width="1.1" stroke-dasharray="3,3"/>
  <text x="115" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">t₁</text>
  <text x="154" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">t₂</text>

  <rect x="226" y="262" width="124" height="92" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="234" y="279" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#9a3412">两阶段主导因素变化</text>
  <text x="234" y="297" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#c2410c">0→t₁（速率增大）：</text>
  <text x="234" y="312" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e293b">反应放热升温占主导</text>
  <text x="234" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1d4ed8">t₁→t₂（速率减小）：</text>
  <text x="234" y="345" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e293b">c(H⁺) 大幅下降占主导</text>

  <!-- Right Panel: Collision Theory & Rate Law -->
  <rect x="382" y="50" width="354" height="326" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="559" y="71" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">二、碰撞学说（图 20-11）与速率方程式</text>

  <!-- Case 1: Insufficient Energy -->
  <rect x="394" y="84" width="104" height="162" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="446" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">① 能量不足</text>
  <!-- Molecules HI + HI -->
  <circle cx="422" cy="126" r="8" fill="#64748b"/><circle cx="433" cy="131" r="5" fill="#cbd5e1"/>
  <circle cx="468" cy="131" r="8" fill="#64748b"/><circle cx="457" cy="126" r="5" fill="#cbd5e1"/>
  <line x1="436" y1="128" x2="452" y2="128" stroke="#dc2626" stroke-width="1.5"/>
  <!-- Bounce apart -->
  <text x="446" y="158" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#dc2626">E &lt; Eₐ 弹回</text>
  <circle cx="418" cy="186" r="8" fill="#64748b"/><circle cx="429" cy="191" r="5" fill="#cbd5e1"/>
  <circle cx="474" cy="191" r="8" fill="#64748b"/><circle cx="463" cy="186" r="5" fill="#cbd5e1"/>
  <path d="M 436 184 L 418 184" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-r)"/>
  <path d="M 456 184 L 474 184" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-r)"/>
  <text x="446" y="218" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f1d1d">普通分子碰撞</text>
  <text x="446" y="234" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">无效碰撞</text>

  <!-- Case 2: Poor Orientation -->
  <rect x="507" y="84" width="104" height="162" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="559" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#b45309">② 取向不好</text>
  <!-- Molecules misaligned -->
  <circle cx="536" cy="128" r="8" fill="#64748b"/><circle cx="525" cy="128" r="5" fill="#cbd5e1"/>
  <circle cx="582" cy="128" r="8" fill="#64748b"/><circle cx="570" cy="128" r="5" fill="#cbd5e1"/>
  <text x="559" y="158" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#d97706">E ≥ Eₐ 但方向错</text>
  <circle cx="532" cy="188" r="8" fill="#64748b"/><circle cx="521" cy="188" r="5" fill="#cbd5e1"/>
  <circle cx="586" cy="188" r="8" fill="#64748b"/><circle cx="575" cy="188" r="5" fill="#cbd5e1"/>
  <path d="M 548 184 L 530 184" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <path d="M 570 184 L 588 184" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text x="559" y="218" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#78350f">未有效接触成键</text>
  <text x="559" y="234" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#b45309">无效碰撞</text>

  <!-- Case 3: Effective Collision -->
  <rect x="620" y="84" width="104" height="162" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="672" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#15803d">③ 有效碰撞</text>
  <!-- Aligned HI + HI -> H2 + I2 -->
  <circle cx="652" cy="124" r="8" fill="#2563eb"/><circle cx="652" cy="136" r="5" fill="#93c5fd"/>
  <circle cx="692" cy="124" r="8" fill="#2563eb"/><circle cx="692" cy="136" r="5" fill="#93c5fd"/>
  <text x="672" y="158" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#16a34a">E ≥ Eₐ 且取向对</text>
  <!-- Products I2 and H2 -->
  <circle cx="652" cy="186" r="8" fill="#2563eb"/><circle cx="668" cy="186" r="8" fill="#2563eb"/>
  <circle cx="690" cy="186" r="5" fill="#16a34a"/><circle cx="700" cy="186" r="5" fill="#16a34a"/>
  <text x="672" y="205" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#15803d">生成 I₂ + H₂</text>
  <text x="672" y="221" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#166534">增大浓度→活化分子数↑</text>
  <text x="672" y="235" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#15803d">(但活化分子百分数不变)</text>

  <!-- Bottom Rate Law Box -->
  <rect x="394" y="256" width="330" height="108" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="559" y="275" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">速率方程式与反应级数（化中 p.164–168）</text>
  <text x="559" y="295" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">R = k [A]ᵐ [B]ⁿ　（总反应级数 = m + n）</text>
  <text x="406" y="316" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.2" fill="#1e293b">• 质量作用定律（m=a, n=b）仅适用基元反应；非基元反应需实验测定</text>
  <text x="406" y="334" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.2" fill="#1e293b">• 多步反应的整体速率由最慢一步（决速步骤）决定</text>
  <text x="406" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.2" font-weight="700" fill="#b91c1c">• 速率常数 k 与浓度无关，仅随温度、催化剂、固体表面积变化</text>
</svg>