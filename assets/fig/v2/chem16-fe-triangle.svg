<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-fe1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-fe2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-fe3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="38" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#0f172a">“铁三角” Fe—Fe²⁺—Fe³⁺ 氧化还原转化与离子检验全图（化上 p.414–422）</text>

  <!-- Left: Iron Triangle -->
  <rect x="24" y="54" width="430" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="239" y="76" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">一、铁的价态转化“铁三角”</text>

  <!-- Top Node: Fe(0) -->
  <rect x="182" y="92" width="114" height="46" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="239" y="112" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Fe (0 价)</text>
  <text x="239" y="129" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">3d⁶4s² · 仅作还原剂</text>

  <!-- Bottom Left: Fe2+ -->
  <rect x="44" y="276" width="124" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="106" y="297" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#065f46">Fe²⁺ (+2 价)</text>
  <text x="106" y="315" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#047857">浅绿色 · 既氧化又还原</text>

  <!-- Bottom Right: Fe3+ -->
  <rect x="310" y="276" width="124" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="372" y="297" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#92400e">Fe³⁺ (+3 价)</text>
  <text x="372" y="315" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#b45309">棕黄色 · 3d⁵ 半满较稳定</text>

  <!-- Fe -> Fe2+ (weak oxidant) & Fe2+ -> Fe (Zn/CO) -->
  <path d="M 182 126 Q 108 175 96 274" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-fe1)"/>
  <text x="100" y="182" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">弱氧化剂</text>
  <text x="95" y="198" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#991b1b">HCl / 稀H₂SO₄ / Cu²⁺ / S</text>

  <path d="M 134 276 Q 170 205 206 140" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-fe2)"/>
  <text x="190" y="218" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">Zn / Al / CO(Δ)</text>

  <!-- Fe -> Fe3+ (strong oxidant) & Fe3+ -> Fe (CO) -->
  <path d="M 296 126 Q 372 175 384 274" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-fe1)"/>
  <text x="380" y="182" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">强氧化剂</text>
  <text x="382" y="198" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#991b1b">Cl₂ / 浓H₂SO₄(Δ) / 浓HNO₃(Δ)</text>

  <path d="M 342 276 Q 306 205 272 140" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-fe2)"/>
  <text x="292" y="218" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">CO / Al 高温炼铁</text>

  <!-- Fe2+ <-> Fe3+ -->
  <path d="M 170 288 L 308 288" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-fe1)"/>
  <text x="239" y="278" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">+ Cl₂ / H₂O₂(H⁺) / KMnO₄(H⁺)</text>

  <path d="M 308 314 L 170 314" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-fe3)"/>
  <text x="239" y="334" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#047857">+ Fe(防氧化) / Cu(蚀刻PCB) / H₂S</text>

  <!-- Special note Fe + H2O(g) -->
  <rect x="44" y="346" width="390" height="22" rx="5" fill="#f1f5f9"/>
  <text x="239" y="361" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#334155">特例：3Fe(s) + 4H₂O(g) —高温→ Fe₃O₄(s) + 4H₂(g)（Fe₃O₄ = FeO·Fe₂O₃）</text>

  <!-- Right: Ion Tests Table -->
  <rect x="468" y="54" width="268" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="602" y="76" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">二、Fe²⁺ 与 Fe³⁺ 检验（p.421–422）</text>

  <!-- Test 1: KSCN -->
  <rect x="480" y="88" width="244" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="490" y="106" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#991b1b">1. 硫氰化钾（KSCN）— 专检 Fe³⁺</text>
  <text x="490" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1e293b">• Fe³⁺：立刻呈血红色 [Fe(SCN)]²⁺</text>
  <text x="490" y="141" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">• Fe²⁺：无明显变化（加氯水后变红）</text>

  <!-- Test 2: NaOH -->
  <rect x="480" y="158" width="244" height="68" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="490" y="176" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#92400e">2. 碱溶液（NaOH）</text>
  <text x="490" y="194" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1e293b">• Fe³⁺：红褐色絮状沉淀 Fe(OH)₃</text>
  <text x="490" y="211" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• Fe²⁺：白絮沉淀→灰绿→红褐(氧化)</text>

  <!-- Test 3: Cyanide complexes -->
  <rect x="480" y="234" width="244" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="490" y="252" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1e40af">3. 铁氰化钾 / 亚铁氰化钾</text>
  <text x="490" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• Fe³⁺ + 黄血盐 K₄[Fe(CN)₆] → 深蓝沉淀</text>
  <text x="490" y="287" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• Fe²⁺ + 赤血盐 K₃[Fe(CN)₆] → 深蓝沉淀</text>

  <!-- Test 4: H2S -->
  <rect x="480" y="310" width="244" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="490" y="328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#334155">4. 通入硫化氢气体（H₂S）</text>
  <text x="490" y="346" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• Fe²⁺ → 黑色 FeS↓　• Fe³⁺ → 黄色 S↓</text>
</svg>