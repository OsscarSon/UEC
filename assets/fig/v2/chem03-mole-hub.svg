<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="100%" height="auto">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="390" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="366" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="42" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#0f172a">以物质的量 (n) 为中心的定量换算枢纽（化上 p.66–70）</text>

  <!-- Center Hub -->
  <rect x="275" y="148" width="210" height="86" rx="14" fill="#0f766e" stroke="#065f46" stroke-width="2"/>
  <text x="380" y="182" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#ffffff">物质的量 n (mol)</text>
  <text x="380" y="206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">计量桥梁 · 必须指明微粒名称/化学式</text>
  <text x="380" y="224" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#d1fae5">方程式系数比 = 各物质 Δn 之比</text>

  <!-- Top Left: Mass m -->
  <rect x="34" y="74" width="180" height="84" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="124" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">宏观质量 m (g)</text>
  <text x="124" y="124" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1e293b">n = m / M    |    m = n · M</text>
  <text x="124" y="144" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#475569">M 单位 g·mol⁻¹，数值等于 Mr/Ar</text>
  <line x1="216" y1="128" x2="274" y2="165" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="274" y1="180" x2="216" y2="143" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Top Right: Particle Count N -->
  <rect x="546" y="74" width="180" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="636" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">微粒数目 N (个)</text>
  <text x="636" y="124" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1e293b">n = N / N_A   |   N = n · N_A</text>
  <text x="636" y="144" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#78350f">N_A ≈ 6.02 × 10²³ mol⁻¹</text>
  <line x1="544" y1="128" x2="486" y2="165" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="486" y1="180" x2="544" y2="143" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Bottom Left: Gas Volume V -->
  <rect x="34" y="246" width="196" height="88" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="132" y="274" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">气体体积 V (L) [限气体]</text>
  <text x="132" y="296" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1e293b">n = V / V_m   |   V = n · V_m</text>
  <text x="132" y="318" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6d28d9">标况(0℃,1 atm): V_m ≈ 22.4 L/mol</text>
  <line x1="232" y1="264" x2="282" y2="232" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Bottom Right: Ion / Atom Breakdown -->
  <rect x="526" y="246" width="200" height="88" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="626" y="274" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">分子内微粒 / 电子拆分</text>
  <text x="626" y="296" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1e293b">1 mol Na₂SO₄·10H₂O 含：</text>
  <text x="626" y="316" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#7f1d1d">2 mol Na⁺ + 1 mol SO₄²⁻ + 14 mol O</text>
  <line x1="482" y1="226" x2="526" y2="256" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr)"/>

  <text x="380" y="358" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#475569">严防陷阱：标况下 H₂O / Br₂ / CCl₄ 为液态，严禁套用 22.4 L/mol；1 mol 必须指明粒子级别。</text>
</svg>
