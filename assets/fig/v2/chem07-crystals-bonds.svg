<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="100%" height="auto">
  <rect x="0" y="0" width="760" height="410" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="386" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="40" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">四大晶体类型的微粒、作用力与物理性质全对照（化上 表7-6 &amp; 7-9, p.183–190）</text>

  <!-- Col 1: Ionic -->
  <rect x="24" y="58" width="170" height="326" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <rect x="24" y="58" width="170" height="36" rx="10" fill="#2563eb"/>
  <text x="109" y="81" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1. 离子晶体</text>
  <text x="109" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">微粒：阴、阳离子</text>
  <text x="109" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#1e293b">作用力：离子键（强静电）</text>
  <rect x="34" y="148" width="150" height="62" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="109" y="166" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">代表与熔点</text>
  <text x="109" y="184" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#334155">NaCl (801℃)、BaCl₂ (1560℃)</text>
  <text x="109" y="201" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">无独立分子，化学式即实验式</text>
  <text x="36" y="232" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">• 熔沸点：较高</text>
  <text x="36" y="252" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">• 硬度：较硬而脆（错位斥）</text>
  <rect x="34" y="270" width="150" height="100" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="109" y="290" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">导电性（核心判据）</text>
  <text x="109" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">固态：不导电（离子固定）</text>
  <text x="109" y="328" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">熔融态：导电！</text>
  <text x="109" y="346" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">水溶液：多能导电</text>
  <text x="109" y="362" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#475569">（注：受离子半径与电荷影响）</text>

  <!-- Col 2: Atomic/Covalent Network -->
  <rect x="204" y="58" width="170" height="326" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <rect x="204" y="58" width="170" height="36" rx="10" fill="#dc2626"/>
  <text x="289" y="81" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2. 原子晶体</text>
  <text x="289" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">微粒：原子（空间网状）</text>
  <text x="289" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#1e293b">作用力：共价键（极强）</text>
  <rect x="214" y="148" width="150" height="62" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="289" y="166" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#991b1b">代表与熔点</text>
  <text x="289" y="184" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#334155">金刚石 (3550℃)、SiO₂ (1723℃)</text>
  <text x="289" y="201" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">晶体 Si、金刚砂 SiC、BN</text>
  <text x="216" y="232" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">• 熔沸点：很高</text>
  <text x="216" y="252" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">• 硬度：很大（最硬、硬脆）</text>
  <rect x="214" y="270" width="150" height="100" rx="6" fill="#fee2e2" stroke="#f87171"/>
  <text x="289" y="290" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">导电性与熔化特点</text>
  <text x="289" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">固态、熔融皆不导电</text>
  <text x="289" y="328" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">（硅为半导体，不溶于水）</text>
  <text x="289" y="346" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">熔化需破坏共价键</text>
  <text x="289" y="362" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#7f1d1d">（SiO₂ 1723℃ ≫ CO₂ −56.6℃）</text>

  <!-- Col 3: Molecular -->
  <rect x="384" y="58" width="170" height="326" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <rect x="384" y="58" width="170" height="36" rx="10" fill="#059669"/>
  <text x="469" y="81" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3. 分子晶体</text>
  <text x="469" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">微粒：分子（或单原子稀有气体）</text>
  <text x="469" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#1e293b">作用力：范德华力（或+氢键）</text>
  <rect x="394" y="148" width="150" height="62" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="469" y="166" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#065f46">代表与熔点</text>
  <text x="469" y="184" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#334155">白磷 (44.1℃)、S (112.8℃)</text>
  <text x="469" y="201" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">干冰 CO₂、冰、I₂、蔗糖、Ne</text>
  <text x="396" y="232" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">• 熔沸点：较低（Mr↑或氢键↑）</text>
  <text x="396" y="252" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">• 硬度：较小（软/脆）</text>
  <rect x="394" y="270" width="150" height="100" rx="6" fill="#d1fae5" stroke="#34d399"/>
  <text x="469" y="290" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#047857">导电性与熔化特点</text>
  <text x="469" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">固态、熔融皆不导电</text>
  <text x="469" y="328" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">（仅 HCl 等溶于水电离导电）</text>
  <text x="469" y="346" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">熔化仅破坏分子间作用力</text>
  <text x="469" y="362" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#064e3b">分子内共价键不断裂！</text>

  <!-- Col 4: Metallic -->
  <rect x="564" y="58" width="170" height="326" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.6"/>
  <rect x="564" y="58" width="170" height="36" rx="10" fill="#ca8a04"/>
  <text x="649" y="81" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#ffffff">4. 金属晶体</text>
  <text x="649" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#854d0e">微粒：金属阳离子 + 自由电子</text>
  <text x="649" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#1e293b">作用力：金属键（电子海洋）</text>
  <rect x="574" y="148" width="150" height="62" rx="6" fill="#ffffff" stroke="#fde047"/>
  <text x="649" y="166" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#854d0e">代表与熔点跨度大</text>
  <text x="649" y="184" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#334155">Na (97.8℃)、W (3410℃)</text>
  <text x="649" y="201" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#475569">Hg (−38.9℃)、Mg (650℃)、Cr (1900℃)</text>
  <text x="576" y="232" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">• 熔沸点：高或低（差异大）</text>
  <text x="576" y="252" font-family="PingFang SC, sans-serif" font-size="11" fill="#1e293b">• 硬度：软到硬（具延展性）</text>
  <rect x="574" y="270" width="150" height="100" rx="6" fill="#fef9c3" stroke="#facc15"/>
  <text x="649" y="290" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#a16207">导电性与递变规律</text>
  <text x="649" y="310" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="700" fill="#854d0e">固态、熔融皆良导体！</text>
  <text x="649" y="328" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">（自由电子定向移动）</text>
  <text x="649" y="346" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">半径↓、价电子↑ ⇒ 金属键↑</text>
  <text x="649" y="362" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#713f12">故熔点：Na &lt; Mg &lt; Al</text>
</svg>
