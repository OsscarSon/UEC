<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-lc-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">勒沙特列原理与四类外界条件改变的 R-t 平衡移动图像（化中 p.195–206）</text>

  <!-- Quadrant 1 (Top-Left): Concentration -->
  <rect x="24" y="48" width="348" height="158" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="198" y="67" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">1. 增大反应物浓度（仅单侧速率突增，图 21-8）</text>

  <line x1="56" y1="178" x2="342" y2="178" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-lc-slate)"/>
  <line x1="56" y1="178" x2="56" y2="80" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-lc-slate)"/>
  <text x="346" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">t</text>
  <text x="48" y="84" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">R</text>

  <!-- Original eq -->
  <path d="M 56 112 Q 86 138, 126 142 L 180 142" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 56 178 Q 86 146, 126 142" fill="none" stroke="#ea580c" stroke-width="2"/>
  <line x1="180" y1="84" x2="180" y2="178" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="180" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">t₁ (加A)</text>

  <!-- Jump at t1: R_f jumps up, R_r stays -->
  <line x1="180" y1="142" x2="180" y2="94" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="3,2"/>
  <circle cx="180" cy="94" r="3" fill="#2563eb"/>
  <circle cx="180" cy="142" r="3" fill="#ea580c"/>
  <path d="M 180 94 Q 214 114, 266 120 L 330 120" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <path d="M 180 142 Q 214 126, 266 120 L 330 120" fill="none" stroke="#ea580c" stroke-width="2.2"/>
  <line x1="266" y1="84" x2="266" y2="178" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="208" y="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">R'_正</text>
  <text x="208" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#c2410c">R'_逆 (断点连续)</text>
  <rect x="252" y="152" width="110" height="20" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="307" y="166" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#047857">R'_正 &gt; R'_逆 → 正向移</text>

  <!-- Quadrant 2 (Top-Right): Pressure -->
  <rect x="388" y="48" width="348" height="158" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="562" y="67" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#047857">2. 压缩体积加压（对 N₂+3H₂ ⇌ 2NH₃，Δn_g &lt; 0）</text>

  <line x1="420" y1="178" x2="706" y2="178" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-lc-slate)"/>
  <line x1="420" y1="178" x2="420" y2="80" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-lc-slate)"/>
  <text x="710" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">t</text>
  <text x="412" y="84" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">R</text>

  <line x1="420" y1="148" x2="520" y2="148" stroke="#64748b" stroke-width="2"/>
  <text x="470" y="142" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">R_正 = R_逆</text>
  <line x1="520" y1="84" x2="520" y2="178" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="520" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">t₁ (加压)</text>

  <!-- Both jump up, R_f jumps higher -->
  <line x1="520" y1="148" x2="520" y2="90" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="520" cy="90" r="3" fill="#2563eb"/>
  <circle cx="520" cy="122" r="3" fill="#ea580c"/>
  <path d="M 520 90 Q 560 104, 616 108 L 694 108" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <path d="M 520 122 Q 560 112, 616 108 L 694 108" fill="none" stroke="#ea580c" stroke-width="2.2"/>

  <text x="556" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">R'_正 增幅更大</text>
  <text x="556" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#c2410c">R'_逆 也增大</text>
  <rect x="572" y="150" width="154" height="22" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="649" y="165" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#047857">向气体体积缩小方向(右)移动</text>

  <!-- Quadrant 3 (Bottom-Left): Temperature -->
  <rect x="24" y="216" width="348" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="198" y="235" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">3. 升高温度（对 ΔH &lt; 0 放热反应，吸热方向增幅更大）</text>

  <line x1="56" y1="348" x2="342" y2="348" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-lc-slate)"/>
  <line x1="56" y1="348" x2="56" y2="250" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-lc-slate)"/>
  <text x="346" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">t</text>
  <text x="48" y="254" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">R</text>

  <line x1="56" y1="322" x2="160" y2="322" stroke="#64748b" stroke-width="2"/>
  <text x="108" y="316" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">R_正 = R_逆</text>
  <line x1="160" y1="254" x2="160" y2="348" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="160" y="361" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">t₁ (升温)</text>

  <!-- Both jump up, R_reverse jumps higher -->
  <line x1="160" y1="322" x2="160" y2="260" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="160" cy="260" r="3" fill="#ea580c"/>
  <circle cx="160" cy="296" r="3" fill="#2563eb"/>
  <path d="M 160 260 Q 200 274, 256 278 L 330 278" fill="none" stroke="#ea580c" stroke-width="2.2"/>
  <path d="M 160 296 Q 200 282, 256 278 L 330 278" fill="none" stroke="#2563eb" stroke-width="2.2"/>

  <text x="200" y="262" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#c2410c">R'_逆 (吸热) 增幅更大</text>
  <text x="200" y="304" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">R'_正 也增大</text>
  <rect x="206" y="320" width="156" height="22" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="284" y="335" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">向吸热方向(左)移动，K_c 减小</text>

  <!-- Quadrant 4 (Bottom-Right): Catalyst -->
  <rect x="388" y="216" width="348" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="562" y="235" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">4. 加入正催化剂（正逆速率同等倍数增大，平衡不移动）</text>

  <line x1="420" y1="348" x2="706" y2="348" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-lc-slate)"/>
  <line x1="420" y1="348" x2="420" y2="250" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-lc-slate)"/>
  <text x="710" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">t</text>
  <text x="412" y="254" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">R</text>

  <line x1="420" y1="320" x2="540" y2="320" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="313" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">R_正 = R_逆</text>
  <line x1="540" y1="254" x2="540" y2="348" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="540" y="361" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">t₁ (加催化剂)</text>

  <!-- Vertical jump to equal new plateau -->
  <line x1="540" y1="320" x2="540" y2="274" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="3,2"/>
  <circle cx="540" cy="274" r="3.5" fill="#7c3aed"/>
  <line x1="540" y1="274" x2="694" y2="274" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="618" y="266" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#6d28d9">R'_正 = R'_逆（仍相等）</text>

  <rect x="556" y="294" width="166" height="44" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="639" y="311" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#5b21b6">• 降低活化能，平衡不移动</text>
  <text x="639" y="328" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#5b21b6">• 缩短达平衡时间，转化率不变</text>
</svg>
