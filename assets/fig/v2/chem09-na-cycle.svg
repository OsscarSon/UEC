<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" height="auto">
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="406" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="40" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">钠及其重要化合物转化关系网（化上 p.220–231）</text>

  <!-- Node: Na (Top Center) -->
  <rect x="315" y="60" width="130" height="54" rx="10" fill="#0f766e" stroke="#065f46" stroke-width="2"/>
  <text x="380" y="84" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Na（单质）</text>
  <text x="380" y="103" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#d1fae5">银白色 · 煤油保存 · 强还原性</text>

  <!-- Node: Na2O (Top Left) -->
  <rect x="46" y="72" width="142" height="54" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="117" y="95" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Na₂O</text>
  <text x="117" y="114" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#334155">白色固体 · 碱性氧化物</text>

  <!-- Node: Na2O2 (Top Right) -->
  <rect x="572" y="72" width="142" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="643" y="95" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#92400e">Na₂O₂</text>
  <text x="643" y="114" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#78350f">淡黄色固体 · 过氧化物</text>

  <!-- Node: NaOH (Center) -->
  <rect x="305" y="170" width="150" height="56" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="194" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#065f46">NaOH（烧碱）</text>
  <text x="380" y="213" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#047857">强碱 · 易潮解吸 CO₂ 变质</text>

  <!-- Node: Na2CO3 (Bottom Left) -->
  <rect x="46" y="268" width="166" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="129" y="292" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Na₂CO₃（纯碱/苏打）</text>
  <text x="129" y="311" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#4c1d95">受热不分解 · 溶液显碱性</text>

  <!-- Node: NaHCO3 (Bottom Right) -->
  <rect x="548" y="268" width="166" height="58" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="631" y="292" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">NaHCO₃（小苏打）</text>
  <text x="631" y="311" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#7f1d1d">溶解度较小 · 受热易分解</text>

  <!-- Node: NaCl (Bottom Center) -->
  <rect x="295" y="330" width="170" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="380" y="353" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1e293b">NaCl（食盐）</text>
  <text x="380" y="371" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#475569">熔点 801℃ · 氯碱/氨碱法原料</text>

  <!-- Arrows & Labels -->
  <!-- Na -> Na2O -->
  <line x1="313" y1="88" x2="192" y2="96" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="252" y="80" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#1e40af">O₂（常温）</text>

  <!-- Na -> Na2O2 -->
  <line x1="447" y1="88" x2="568" y2="96" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="508" y="80" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#92400e">O₂（点燃）</text>

  <!-- Na -> NaOH -->
  <line x1="380" y1="116" x2="380" y2="166" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <text x="438" y="146" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#0f766e">+ H₂O（浮熔游响红）</text>

  <!-- Na2O -> NaOH -->
  <line x1="168" y1="128" x2="302" y2="184" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="218" y="168" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#1e40af">+ H₂O</text>

  <!-- Na2O2 -> NaOH -->
  <line x1="592" y1="128" x2="458" y2="184" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="554" y="168" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#92400e">+ H₂O（放 O₂）</text>

  <!-- NaOH -> Na2CO3 -->
  <line x1="316" y1="228" x2="185" y2="266" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <text x="234" y="238" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#065f46">+ 少量 CO₂</text>

  <!-- NaOH -> NaHCO3 -->
  <line x1="444" y1="228" x2="575" y2="266" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="530" y="238" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#b91c1c">+ 过量 CO₂</text>

  <!-- Na2CO3 -> NaOH -->
  <line x1="150" y1="266" x2="300" y2="210" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="195" y="220" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#5b21b6">+ Ca(OH)₂</text>

  <!-- Na2CO3 <-> NaHCO3 -->
  <line x1="215" y1="286" x2="544" y2="286" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="380" y="279" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#5b21b6">+ CO₂ + H₂O（饱和溶液析出 NaHCO₃）</text>

  <line x1="544" y1="306" x2="215" y2="306" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="380" y="321" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">受热分解（△）或溶液中 + NaOH</text>

  <!-- NaCl -> NaOH (Chlor-alkali) -->
  <line x1="340" y1="328" x2="340" y2="230" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <text x="292" y="264" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#334155">电解饱和食盐水</text>

  <!-- NaCl -> NaHCO3 (Solvay) -->
  <line x1="467" y1="354" x2="600" y2="328" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="556" y="356" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#334155">氨碱法(+NH₃,CO₂)</text>

  <!-- Na2CO3 -> NaCl -->
  <line x1="160" y1="328" x2="292" y2="354" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <text x="210" y="356" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#334155">+ 稀盐酸 HCl</text>

  <!-- NaCl -> Na (left edge arc) -->
  <path d="M 294 370 Q 26 370 26 210 Q 26 52 311 72" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-teal)"/>
  <text x="82" y="198" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#0f766e">电解熔融 NaCl</text>

  <!-- Bottom Footer -->
  <text x="380" y="406" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" font-weight="600" fill="#475569">焰色试验：Na/Na⁺ 呈黄色；K/K⁺ 须透过蓝色钴玻璃滤去黄光干扰呈浅紫色；K 工业用热还原法（Na+KCl 高温置换真空蒸馏）。</text>
</svg>
