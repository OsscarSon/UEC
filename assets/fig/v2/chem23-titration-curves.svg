<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-tit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">酸碱中和滴定曲线突跃与指示剂选择原则（0.1000 mol/L 体系，化中 p.264–269）</text>

  <!-- Left Plot Panel -->
  <rect x="24" y="50" width="404" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="226" y="70" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">三类典型滴定曲线（25.00 mL 被测液 + 滴定剂）</text>

  <!-- Shaded Indicator Zones on Graph -->
  <!-- Graph Origin: x0=74, y0=326; X: 0..50 mL -> x=74..394 (6.4 px/mL); Y: pH 0..14 -> y=326..88 (17 px/pH) -->
  <!-- Phenolphthalein zone pH 8.2-10.0: y = 326 - 10*17 = 156 to 326 - 8.2*17 = 186.6 -->
  <rect x="74" y="156" width="320" height="30.6" fill="#fce7f3" opacity="0.8"/>
  <text x="390" y="174" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#be185d">酚酞变色区 8.2–10.0</text>

  <!-- Methyl Red zone pH 4.4-6.2: y = 326 - 6.2*17 = 220.6 to 326 - 4.4*17 = 251.2 -->
  <rect x="74" y="220.6" width="320" height="30.6" fill="#fef3c7" opacity="0.8"/>
  <text x="390" y="239" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#b45309">甲基红变色区 4.4–6.2</text>

  <!-- Methyl Orange zone pH 3.1-4.4: y = 326 - 4.4*17 = 251.2 to 326 - 3.1*17 = 273.3 -->
  <rect x="74" y="251.2" width="320" height="22.1" fill="#fee2e2" opacity="0.75"/>
  <text x="390" y="266" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">甲基橙 3.1–4.4</text>

  <!-- Axes -->
  <line x1="74" y1="326" x2="404" y2="326" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-tit)"/>
  <line x1="74" y1="326" x2="74" y2="82" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-tit)"/>
  <text x="58" y="88" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#0f172a">pH</text>
  <text x="348" y="354" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">滴定剂体积 V / mL</text>

  <!-- Vertical dashed line at V = 25.00 mL -> x = 74 + 25*6.4 = 234 -->
  <line x1="234" y1="326" x2="234" y2="90" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="234" y="341" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#0f172a">25.00</text>
  <text x="74" y="341" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">0</text>
  <text x="138" y="341" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">10</text>
  <text x="298" y="341" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">35</text>
  <text x="362" y="341" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">45</text>

  <!-- Y-axis ticks -->
  <text x="68" y="329" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">0</text>
  <text x="68" y="295" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">2</text>
  <text x="68" y="259" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">4</text>
  <text x="68" y="225" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">6</text>
  <text x="68" y="207" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">7</text>
  <text x="68" y="191" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">8</text>
  <text x="68" y="157" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">10</text>
  <text x="68" y="123" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">12</text>
  <text x="68" y="93" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">14</text>
  <line x1="74" y1="207" x2="234" y2="207" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Curve 1: NaOH into HCl (Strong Base -> Strong Acid), blue solid -->
  <!-- pH(0)=1(y=309), pH(15)=1.6(y=298), pH(24)=2.7(y=280), pH(24.95)=4.0(y=258), pH(25)=7.0(y=207), pH(25.05)=10.0(y=156), pH(26)=11.3(y=134), pH(40)=12.36(y=116) -->
  <path d="M 74 309 Q 160 302 224 282 Q 233 272 234 207 Q 235 142 244 132 Q 290 118 390 112" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Curve 2: NaOH into CH3COOH (Strong Base -> Weak Acid), purple dashed -->
  <!-- pH(0)=2.9(y=277), buffer around pH 4.7(y=246), pH(24.9)=6.8(y=210), pH(25)=8.7(y=178), pH(25.1)=10.3(y=151) -->
  <path d="M 74 277 Q 115 248 180 238 Q 228 228 234 178 Q 238 148 250 135 Q 295 119 390 113" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="6 3"/>

  <!-- Curve 3: HCl into NH3.H2O (Strong Acid -> Weak Base), green solid -->
  <!-- pH(0)=11.1(y=137), buffer pH 9.2(y=170), pH(24.9)=7.2(y=204), pH(25)=5.3(y=236), pH(25.1)=3.7(y=263), pH(40)=1.6(y=299) -->
  <path d="M 74 137 Q 120 165 180 175 Q 228 184 234 236 Q 238 265 250 278 Q 295 296 390 304" fill="none" stroke="#059669" stroke-width="2.2"/>

  <!-- Equivalence Points -->
  <circle cx="234" cy="207" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="234" cy="178" r="4.5" fill="#9333ea" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="234" cy="236" r="4.5" fill="#059669" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Legend inside plot bottom-left -->
  <rect x="82" y="348" width="220" height="20" rx="4" fill="#f8fafc"/>
  <line x1="88" y1="358" x2="104" y2="358" stroke="#2563eb" stroke-width="2.5"/>
  <text x="108" y="362" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1e3a8a">强碱滴强酸</text>
  <line x1="162" y1="358" x2="178" y2="358" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="4 2"/>
  <text x="182" y="362" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#6b21a8">强碱滴弱酸</text>
  <line x1="236" y1="358" x2="252" y2="358" stroke="#059669" stroke-width="2.2"/>
  <text x="256" y="362" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#065f46">强酸滴弱碱</text>

  <!-- Right Panel: Indicator & Rules -->
  <rect x="440" y="50" width="296" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="588" y="72" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">指示剂变色范围与选用规则（表 23-14）</text>

  <!-- Indicator Table -->
  <rect x="452" y="84" width="272" height="106" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="462" y="101" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">指示剂　　变色 pH 范围　　酸色 → 碱色</text>
  <line x1="452" y1="108" x2="724" y2="108" stroke="#cbd5e1"/>
  <text x="462" y="125" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#b91c1c" font-weight="600">甲基橙　　3.1 – 4.4　　　红 → 橙 → 黄</text>
  <text x="462" y="144" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#b45309" font-weight="600">甲基红　　4.4 – 6.2　　　红 → 橙 → 黄</text>
  <text x="462" y="163" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#4338ca" font-weight="600">石　蕊　　5.0 – 8.0　　　红 → 紫 → 蓝</text>
  <text x="462" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#be185d" font-weight="600">酚　酞　　8.2 – 10.0　　 无 → 粉红 → 红</text>

  <!-- Matching Rules -->
  <rect x="452" y="200" width="272" height="96" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="462" y="218" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">变色区间必须落在突跃范围内！</text>
  <text x="462" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• 强酸 + 强碱（突跃 4.0–10.0，等当点 pH=7）：</text>
  <text x="470" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">酚酞、甲基红、甲基橙均可（石蕊渐变较难辨）</text>
  <text x="462" y="266" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• 强碱 + 弱酸（突跃 6–10，等当点 pH&gt;7）：选酚酞</text>
  <text x="462" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• 强酸 + 弱碱（突跃 8–4，等当点 pH&lt;7）：选甲基红/橙</text>

  <!-- Apparatus & Error Note -->
  <rect x="452" y="304" width="272" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="462" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#14532d">滴定操作与计量核心（读数精确至 0.01 mL）</text>
  <text x="462" y="339" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1e293b">• 酸式滴定管盛酸/中性液；碱式滴定管盛碱液</text>
  <text x="462" y="354" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1e293b">• 滴定管需用待装液润洗 2–3 次；锥形瓶严禁润洗！</text>
</svg>