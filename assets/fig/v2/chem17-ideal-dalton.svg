<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-id" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-da" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">理想气体状态方程、STP 摩尔体积与道尔顿分压定律（化中 p.24–42）</text>

  <!-- Left Panel: Ideal Gas & Molar Volume -->
  <rect x="24" y="52" width="348" height="322" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="198" y="74" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">一、气体摩尔体积与理想气体状态方程</text>

  <!-- STP Cube -->
  <rect x="38" y="88" width="320" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="52" y="99" width="46" height="46" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="75" y="120" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">22.4 L</text>
  <text x="75" y="135" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#2563eb">0.282 m</text>
  <text x="114" y="108" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#0f172a">标准状况 STP：0℃ (273 K)、1.01×10⁵ Pa</text>
  <text x="114" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">气体摩尔体积 Vₘ = 22.4 L·mol⁻¹（仅限气体）</text>
  <text x="114" y="144" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">n = V / Vₘ = N / Nₐ = m / M（Nₐ ≈ 6.02×10²³）</text>

  <!-- Central Ideal Gas Equation Hub -->
  <rect x="56" y="174" width="284" height="58" rx="10" fill="#1e3a8a" stroke="#172554" stroke-width="1.5"/>
  <text x="198" y="198" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff">pV = nRT = (m / M)RT</text>
  <text x="198" y="218" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#bfdbfe">R = 8.314 Pa·m³·mol⁻¹·K⁻¹（p用Pa, V用m³, T用K）</text>

  <!-- 3 Derived Applications -->
  <rect x="38" y="246" width="154" height="54" rx="7" fill="#fefce8" stroke="#fde047"/>
  <text x="115" y="266" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#854d0e">求摩尔质量与密度</text>
  <text x="115" y="286" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">M = ρRT / p</text>

  <rect x="204" y="246" width="154" height="54" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="281" y="266" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#9a3412">一定质量状态变化</text>
  <text x="281" y="286" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">p₁V₁ / T₁ = p₂V₂ / T₂</text>

  <rect x="38" y="310" width="320" height="52" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="198" y="329" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">理想气体假设：分子自身体积≈0，分子间作用力≈0</text>
  <text x="198" y="348" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">真实气体在【高温、低压】下最接近理想气体；高压修正用范德华方程</text>

  <!-- Right Panel: Dalton's Law & Water Displacement -->
  <rect x="388" y="52" width="348" height="322" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="562" y="74" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#065f46">二、道尔顿分压定律与排水集气校正</text>

  <!-- 3 Cylinders (Fig 17-34) -->
  <rect x="406" y="96" width="66" height="72" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="439" y="124" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">气体 A</text>
  <text x="439" y="142" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#2563eb">nₐ → pₐ</text>
  <circle cx="424" cy="155" r="2.5" fill="#2563eb"/><circle cx="452" cy="156" r="2.5" fill="#2563eb"/>

  <text x="485" y="136" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#334155">+</text>

  <rect x="498" y="96" width="66" height="72" rx="5" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="531" y="124" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#9d174d">气体 B</text>
  <text x="531" y="142" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#be185d">n_b → p_b</text>
  <circle cx="514" cy="155" r="2.5" fill="#db2777"/><circle cx="530" cy="154" r="2.5" fill="#db2777"/><circle cx="548" cy="157" r="2.5" fill="#db2777"/>

  <text x="577" y="136" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#334155">=</text>

  <rect x="590" y="96" width="128" height="72" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="654" y="118" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#065f46">混合气体 (同 T, V)</text>
  <text x="654" y="137" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#047857">p_T = pₐ + p_b</text>
  <text x="654" y="155" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#0f172a">p_i = x_i·p_T (x_i = n_i/n_T)</text>

  <!-- Partial pressure & partial volume summary -->
  <rect x="404" y="180" width="316" height="44" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="562" y="198" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#166534">分压与分体积关系：p_i / p_T = V_i / V_T = n_i / n_T = x_i</text>
  <text x="562" y="215" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">各组分摩尔分数之和 xₐ + x_b + … = 1（气体之间不反应）</text>

  <!-- Water displacement collection schematic (Example 14 p.41) -->
  <rect x="404" y="236" width="316" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="562" y="255" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">排水集气法校正（例14，化中 p.41）</text>

  <!-- Water trough & inverted jar -->
  <rect x="418" y="318" width="106" height="34" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
  <path d="M 442 332 L 442 268 L 500 268 L 500 332" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <rect x="443" y="318" width="56" height="14" fill="#bae6fd"/>
  <text x="471" y="286" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#0c4a6e">H₂ + H₂O(g)</text>
  <text x="471" y="302" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#0369a1">总压 p_T, V_T</text>
  <text x="429" y="294" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#475569">大气</text>
  <text x="429" y="306" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">p_T ↓</text>

  <!-- Formulas next to jar -->
  <text x="536" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">① 扣水蒸气分压：</text>
  <text x="536" y="299" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">p(干H₂) = p_T − p(H₂O饱)</text>
  <text x="536" y="321" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">② 干气体分体积：</text>
  <text x="536" y="338" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">V(干H₂) = V_T × p(干H₂) / p_T</text>
  <text x="536" y="354" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">（注意：液面相平才使瓶内外总压相等）</text>
</svg>