<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-hb2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">盐类水解四类矩阵与缓冲溶液抗酸抗碱机理（化中 p.271–282）</text>

  <!-- Left Panel: Salt Hydrolysis Matrix -->
  <rect x="24" y="50" width="358" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="203" y="72" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">一、盐类水解分类与酸碱性规律</text>

  <!-- Category 1: SA-SB -->
  <rect x="36" y="84" width="160" height="84" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="116" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">1. 强酸强碱盐</text>
  <text x="116" y="119" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#334155">例：NaCl、Na₂SO₄</text>
  <text x="116" y="136" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">不水解 · 中性 (pH = 7)</text>
  <text x="116" y="153" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">不破坏水的电离平衡</text>

  <!-- Category 2: SB-WA -->
  <rect x="206" y="84" width="164" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="288" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">2. 强碱弱酸盐</text>
  <text x="288" y="119" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">例：CH₃COONa、Na₂CO₃</text>
  <text x="288" y="136" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">阴离子水解 · 碱性 (pH&gt;7)</text>
  <text x="288" y="153" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">A⁻ + H₂O ⇌ HA + OH⁻</text>

  <!-- Category 3: SA-WB -->
  <rect x="36" y="178" width="160" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="116" y="196" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">3. 强酸弱碱盐</text>
  <text x="116" y="213" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">例：NH₄Cl、Fe₂(SO₄)₃</text>
  <text x="116" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">阳离子水解 · 酸性 (pH&lt;7)</text>
  <text x="116" y="247" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">NH₄⁺ + H₂O ⇌ NH₃·H₂O + H⁺</text>

  <!-- Category 4: WA-WB -->
  <rect x="206" y="178" width="164" height="84" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.3"/>
  <text x="288" y="196" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#581c87">4. 弱酸弱碱盐</text>
  <text x="288" y="213" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">例：CH₃COONH₄、NH₄CN</text>
  <text x="288" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#6b21a8">双水解 · 由 Kₐ 与 K_b 比较定</text>
  <text x="288" y="247" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">Kₐ&gt;K_b 酸；Kₐ&lt;K_b 碱；相等中性</text>

  <!-- Hydrolysis Rules & Applications -->
  <rect x="36" y="272" width="334" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="46" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">口诀：有弱才水解，谁强显谁性，越弱越水解！</text>
  <text x="46" y="308" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• 促进因素：升高温度（水解吸热）、加水稀释（浓度越小水解度越大）</text>
  <text x="46" y="325" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• 常见应用：明矾/Al³⁺ 净水、热纯碱去油污、配 FeCl₃ 加盐酸防浑浊</text>
  <text x="46" y="342" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#78350f">• 泡沫灭火器：Al₂(SO₄)₃ + 6NaHCO₃ → 3Na₂SO₄ + 2Al(OH)₃↓ + 6CO₂↑</text>

  <!-- Right Panel: Buffer Mechanism -->
  <rect x="394" y="50" width="342" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="565" y="72" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">二、缓冲溶液组成与抗酸抗碱动态机理</text>

  <!-- Buffer Reservoir -->
  <rect x="410" y="86" width="310" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="105" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#065f46">缓冲体系：足量弱酸 + 其共轭碱（大量存在）</text>
  <text x="488" y="128" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">CH₃COOH</text>
  <text x="488" y="142" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">（抗碱成分）</text>
  <text x="565" y="132" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">⇌ H⁺ +</text>
  <text x="642" y="128" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">CH₃COO⁻</text>
  <text x="642" y="142" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#334155">（抗酸成分）</text>

  <!-- Left Branch: Add OH- -->
  <rect x="406" y="176" width="152" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="482" y="195" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">加入少量强碱 (OH⁻)</text>
  <text x="482" y="214" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">抗碱成分 CH₃COOH 中和：</text>
  <text x="482" y="232" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">CH₃COOH + OH⁻ →</text>
  <text x="482" y="247" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">CH₃COO⁻ + H₂O</text>
  <text x="482" y="261" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">pH 仅微升，基本稳定</text>

  <!-- Right Branch: Add H+ -->
  <rect x="570" y="176" width="152" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="646" y="195" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">加入少量强酸 (H⁺)</text>
  <text x="646" y="214" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">抗酸成分 CH₃COO⁻ 结合：</text>
  <text x="646" y="232" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#b91c1c">CH₃COO⁻ + H⁺ →</text>
  <text x="646" y="247" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#b91c1c">CH₃COOH</text>
  <text x="646" y="261" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">pH 仅微降，基本稳定</text>

  <path d="M 482 148 L 482 174" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-hb)"/>
  <path d="M 646 148 L 646 174" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-hb2)"/>

  <!-- Buffer Formula & Blood Buffer -->
  <rect x="406" y="276" width="316" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="416" y="294" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#0f172a">三类组成与计算：弱酸/盐 · 弱碱/盐 · 多元酸酸式盐/次级盐</text>
  <text x="416" y="313" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#4338ca">计算式：[H⁺] = Kₐ · ([HA] / [A⁻])，即 pH = pKₐ + log([A⁻]/[HA])</text>
  <text x="416" y="331" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1e293b">• 人体血液缓冲体系（pH 维持 7.35–7.45）：H₂CO₃ — NaHCO₃ 等</text>
  <text x="416" y="347" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 注意：缓冲能力有限，加入过量强酸或强碱仍会失去缓冲作用</text>
</svg>