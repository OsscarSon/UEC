<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="38" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#0f172a">氮及其化合物“价—类”二维转化全图（化上 p.298–322）</text>

  <!-- Left Oxidation State Axis -->
  <line x1="88" y1="68" x2="88" y2="352" stroke="#64748b" stroke-width="2" marker-start="url(#arr-blue)"/>
  <text x="52" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#334155">N 氧化数</text>

  <!-- Horizontal Grid Bands (y levels: +5=90, +4=145, +2=200, 0=255, -3=315) -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">
    <line x1="82" y1="90" x2="725" y2="90" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <rect x="26" y="77" width="46" height="24" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="49" y="94" text-anchor="middle" fill="#b91c1c">+5</text>

    <line x1="82" y1="145" x2="725" y2="145" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <rect x="26" y="132" width="46" height="24" rx="6" fill="#ffedd5" stroke="#fdba74"/>
    <text x="49" y="149" text-anchor="middle" fill="#c2410c">+4</text>

    <line x1="82" y1="202" x2="725" y2="202" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <rect x="26" y="189" width="46" height="24" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="49" y="206" text-anchor="middle" fill="#b45309">+2</text>

    <line x1="82" y1="258" x2="725" y2="258" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <rect x="26" y="245" width="46" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="49" y="262" text-anchor="middle" fill="#15803d">0</text>

    <line x1="82" y1="318" x2="725" y2="318" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <rect x="26" y="305" width="46" height="24" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="49" y="322" text-anchor="middle" fill="#1d4ed8">−3</text>
  </g>

  <!-- Column Headers -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#475569">
    <text x="155" y="62" text-anchor="middle">氢化物 / 碱</text>
    <text x="275" y="62" text-anchor="middle">单质</text>
    <text x="405" y="62" text-anchor="middle">氧化物</text>
    <text x="545" y="62" text-anchor="middle">含氧酸</text>
    <text x="675" y="62" text-anchor="middle">盐（铵盐 / 硝酸盐）</text>
  </g>

  <!-- Nodes -->
  <!-- -3: NH3 and NH4Cl/NH4NO3 -->
  <rect x="108" y="298" width="96" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="156" y="316" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">NH₃</text>
  <text x="156" y="332" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#3b82f6">极易溶于水(1:700)</text>

  <rect x="615" y="298" width="114" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="672" y="316" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">NH₄⁺ 盐</text>
  <text x="672" y="332" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#3b82f6">NH₄Cl · NH₄NO₃</text>

  <!-- 0: N2 -->
  <rect x="228" y="238" width="94" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="275" y="256" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">N₂ (N≡N)</text>
  <text x="275" y="272" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#059669">三键稳定 · 固氮起点</text>

  <!-- +2: NO -->
  <rect x="358" y="182" width="94" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="405" y="200" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">NO</text>
  <text x="405" y="216" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#b45309">无色 · 难溶 · 中性</text>

  <!-- +4: NO2 / N2O4 -->
  <rect x="350" y="125" width="110" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="405" y="143" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#9a3412">NO₂ ⇌ N₂O₄</text>
  <text x="405" y="159" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#c2410c">红棕色 · 有毒</text>

  <!-- +5: HNO3 -->
  <rect x="492" y="70" width="108" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="546" y="89" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">HNO₃</text>
  <text x="546" y="105" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#dc2626">强酸 · 强氧化性</text>

  <!-- +5: NO3- salts -->
  <rect x="622" y="70" width="104" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="674" y="89" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#991b1b">NO₃⁻ 硝酸盐</text>
  <text x="674" y="105" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#dc2626">棕色环检验</text>

  <!-- Arrows and Labels -->
  <!-- N2 <-> NH3 (Haber & CuO) -->
  <path d="M 228 264 Q 165 266 158 296" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="150" y="256" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#065f46">H₂, 500℃ 3×10⁷Pa Fe粉</text>
  <path d="M 185 298 Q 220 288 242 278" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="235" y="294" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">+CuO(Δ)</text>

  <!-- N2 -> NO (Lightning) -->
  <path d="M 322 252 Q 368 242 385 224" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="366" y="248" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#065f46">+O₂ 放电</text>

  <!-- NH3 -> NO (Ostwald) -->
  <path d="M 182 298 L 356 212" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="275" y="218" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">4NH₃+5O₂ (Pt-Rh/Δ)</text>

  <!-- NO -> NO2 -->
  <path d="M 405 182 L 405 167" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="444" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c">+O₂ (常温)</text>

  <!-- NO2 -> HNO3 & NO -->
  <path d="M 455 128 Q 478 108 492 98" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="448" y="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#991b1b">+H₂O (3NO₂+H₂O)</text>

  <!-- HNO3 -> NO2 (Cu conc) & HNO3 -> NO (Cu dil) -->
  <path d="M 526 112 Q 495 148 462 148" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="515" y="158" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#991b1b">浓+Cu / 光照</text>

  <path d="M 545 112 Q 528 196 454 202" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="530" y="192" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#991b1b">稀+Cu</text>

  <!-- HNO3 <-> NO3- -->
  <path d="M 600 84 L 620 84" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <path d="M 620 98 L 600 98" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="610" y="75" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#991b1b">+碱 / +浓H₂SO₄</text>

  <!-- NH3 <-> NH4+ -->
  <path d="M 206 312 L 613 312" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="410" y="306" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1d4ed8">+酸 (HCl / HNO₃ / H₂SO₄)</text>
  <path d="M 613 328 L 206 328" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="410" y="344" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1d4ed8">+碱 (Ca(OH)₂/NaOH, Δ) 实验室制 NH₃ 及 NH₄⁺ 检验</text>

  <!-- Footer Note -->
  <rect x="26" y="356" width="708" height="24" rx="6" fill="#e2e8f0"/>
  <text x="380" y="372" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">统考核心规律：稀 HNO₃ + Cu → NO；浓 HNO₃ + Cu → NO₂；常温冷浓 HNO₃ 使 Fe、Al 钝化；NH₄NO₃ 受热分解生成 N₂O</text>
</svg>