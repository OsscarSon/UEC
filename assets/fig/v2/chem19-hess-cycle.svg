<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-h1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-h2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-h3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="38" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">黑斯定律（Hess's Law）能量循环与标准生成热/燃烧热计算图解（化中 p.137–140）</text>

  <!-- Left Panel: Hess's Law Principle & Graphite -> CO example -->
  <rect x="24" y="52" width="350" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="199" y="74" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">一、途径无关性与石墨生成 CO 焓变（例5）</text>

  <!-- Energy axis -->
  <path d="M 48 278 L 48 94" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-hd)"/>
  <text x="48" y="88" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">能量 H</text>

  <!-- Top state: C(s, 石墨) + O2(g) -->
  <rect x="108" y="96" width="166" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="191" y="116" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">C(s, 石墨) + O₂(g)</text>

  <!-- Middle state: CO(g) + 1/2 O2(g) -->
  <rect x="198" y="168" width="160" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="278" y="188" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">CO(g) + ½ O₂(g)</text>

  <!-- Bottom state: CO2(g) -->
  <rect x="108" y="256" width="166" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="191" y="276" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">CO₂(g)</text>

  <!-- Direct arrow ΔH1 -->
  <path d="M 142 128 L 142 252" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-h1)"/>
  <rect x="58" y="176" width="78" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="97" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">ΔH₁ 一步</text>
  <text x="97" y="205" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">−393.5 kJ</text>

  <!-- Step 1 arrow ΔH3 (unknown) -->
  <path d="M 248 128 L 248 164" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-h2)"/>
  <text x="256" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">ΔH₃ = −110.5 kJ</text>

  <!-- Step 2 arrow ΔH2 -->
  <path d="M 248 200 L 248 252" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-h3)"/>
  <text x="256" y="232" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#059669">ΔH₂ = −283.0 kJ</text>

  <!-- Bottom summary -->
  <rect x="36" y="298" width="326" height="66" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="199" y="317" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#0f172a">黑斯定律：ΔH 只取决于始态和终态，与途径无关</text>
  <text x="199" y="336" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">ΔH₁ = ΔH₃ + ΔH₂  ⇒  ΔH₃ = ΔH₁ − ΔH₂</text>
  <text x="199" y="354" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">ΔH₃ = −393.5 − (−283.0) = −110.5 kJ·mol⁻¹</text>

  <!-- Right Panel: General Hess Triangle Cycles -->
  <rect x="386" y="52" width="350" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="561" y="74" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">二、用 ΔHf° 与 ΔHc° 计算反应焓变的通用循环</text>

  <!-- Main Reaction Top Bar -->
  <rect x="406" y="184" width="112" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="462" y="206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">反应物</text>

  <rect x="604" y="184" width="112" height="36" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="660" y="206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#065f46">生成物</text>

  <!-- Target ΔH arrow -->
  <path d="M 520 202 L 600 202" fill="none" stroke="#0f172a" stroke-width="2.4" marker-end="url(#arr-hd)"/>
  <text x="561" y="194" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f172a">ΔH°</text>

  <!-- Top Vertex: Stable Elements -->
  <rect x="476" y="92" width="170" height="34" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="561" y="113" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">稳定状态单质（ΔHf° = 0）</text>

  <!-- Formation arrows (Downwards from Elements) -->
  <path d="M 522 126 L 468 180" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-h2)"/>
  <text x="478" y="150" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#dc2626">ΣΔHf°(反)</text>

  <path d="M 600 126 L 654 180" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-h3)"/>
  <text x="646" y="150" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#059669">ΣΔHf°(生)</text>

  <!-- Bottom Vertex: Combustion Products -->
  <rect x="476" y="274" width="170" height="34" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="561" y="295" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#334155">完全燃烧产物（CO₂, H₂O）</text>

  <!-- Combustion arrows (Downwards to Combustion Products) -->
  <path d="M 468 220 L 522 270" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-h1)"/>
  <text x="476" y="254" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">ΣΔHc°(反)</text>

  <path d="M 654 220 L 600 270" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-h1)"/>
  <text x="646" y="254" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">ΣΔHc°(生)</text>

  <!-- Two General Formulas Box -->
  <rect x="398" y="316" width="326" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="561" y="335" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">① 由生成热：ΔH° = Σ ν·ΔHf°(生成物) − Σ ν·ΔHf°(反应物)</text>
  <text x="561" y="354" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">② 由燃烧热：ΔH° = Σ ν·ΔHc°(反应物) − Σ ν·ΔHc°(生成物)</text>
</svg>
