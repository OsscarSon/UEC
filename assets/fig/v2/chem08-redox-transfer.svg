<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="100%" height="auto">
  <rect x="0" y="0" width="760" height="410" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="386" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="40" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">双线桥电子转移示意与离子—电子法配平五步流程（化上 p.203–213）</text>

  <defs>
    <marker id="arr-ox" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="arr-re" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arr-step" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#0f766e"/></marker>
  </defs>

  <!-- Top Section: Double-Line Bridge (Fig/Example p.204) -->
  <rect x="26" y="56" width="708" height="154" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="26" y="56" width="708" height="28" rx="10" fill="#1e293b"/>
  <text x="380" y="75" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">一、双线桥法与核心概念口诀：升失氧还剂，降得还氧剂（p.203–205）</text>

  <!-- Equation in center -->
  <text x="155" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Zn(s)</text>
  <text x="155" y="131" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#dc2626">0</text>
  <text x="200" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0f172a">+</text>
  <text x="262" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">CuSO₄(aq)</text>
  <text x="234" y="131" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#2563eb">+2</text>
  <text x="332" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0f172a">───→</text>
  <text x="410" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">ZnSO₄(aq)</text>
  <text x="382" y="131" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#dc2626">+2</text>
  <text x="466" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#0f172a">+</text>
  <text x="514" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Cu(s)</text>
  <text x="514" y="131" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#2563eb">0</text>

  <!-- Upper Bridge (Oxidation: Zn -> Zn2+) -->
  <polyline points="155,118 155,96 382,96 382,115" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-ox)"/>
  <text x="268" y="92" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">失去 2e⁻，氧化数升高 (+2)，被氧化（Zn 是还原剂 → 氧化产物 ZnSO₄）</text>

  <!-- Lower Bridge (Reduction: Cu2+ -> Cu) -->
  <polyline points="234,158 234,182 514,182 514,160" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-re)"/>
  <text x="374" y="198" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">得到 2e⁻，氧化数降低 (−2)，被还原（CuSO₄ 是氧化剂 → 还原产物 Cu）</text>

  <!-- Summary badge on right -->
  <rect x="562" y="94" width="158" height="102" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="641" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">守恒铁律</text>
  <text x="641" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#78350f">失电子总数 = 得电子总数</text>
  <text x="641" y="153" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#78350f">氧化数升高总数 = 降低总数</text>
  <text x="641" y="172" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#b45309">氧化性：氧化剂 &gt; 氧化产物</text>
  <text x="641" y="188" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#b45309">还原性：还原剂 &gt; 还原产物</text>

  <!-- Bottom Section: 5-step Ion-Electron Method (p.212-213) -->
  <rect x="26" y="222" width="708" height="164" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <rect x="26" y="222" width="708" height="28" rx="10" fill="#0f766e"/>
  <text x="380" y="241" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">二、离子—电子法配平五步流程图（例：MnO₄⁻ + Cl⁻ → Mn²⁺ + Cl₂，酸性，p.212）</text>

  <!-- 5 Step Boxes -->
  <rect x="38" y="262" width="124" height="110" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="100" y="280" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">① 写离子框架</text>
  <text x="100" y="300" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">删去旁观离子</text>
  <text x="100" y="320" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#334155">MnO₄⁻ + Cl⁻ →</text>
  <text x="100" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#334155">Mn²⁺ + Cl₂</text>
  <text x="100" y="358" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#64748b">（拆分两半反应）</text>

  <line x1="162" y1="317" x2="177" y2="317" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-step)"/>

  <rect x="179" y="262" width="130" height="110" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="244" y="280" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">② 配平原子数</text>
  <text x="244" y="299" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">酸液：H⁺、H₂O</text>
  <text x="244" y="316" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb">碱液：OH⁻、H₂O</text>
  <text x="244" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#334155">MnO₄⁻ + 8H⁺ →</text>
  <text x="244" y="352" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#334155">Mn²⁺ + 4H₂O</text>

  <line x1="309" y1="317" x2="324" y2="317" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-step)"/>

  <rect x="326" y="262" width="128" height="110" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="390" y="280" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">③ 加 e⁻ 平电荷</text>
  <text x="390" y="300" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#334155">还原半反应 (+5e⁻):</text>
  <text x="390" y="316" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#1d4ed8">MnO₄⁻+8H⁺+5e⁻</text>
  <text x="390" y="330" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#1d4ed8">→ Mn²⁺+4H₂O</text>
  <text x="390" y="348" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#dc2626">氧化：2Cl⁻→Cl₂+2e⁻</text>

  <line x1="454" y1="317" x2="469" y2="317" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-step)"/>

  <rect x="471" y="262" width="122" height="110" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="532" y="280" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">④ 倍数消 e⁻ 相加</text>
  <text x="532" y="302" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#1e293b">LCM(5, 2) = 10</text>
  <text x="532" y="320" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#334155">还原式 × 2</text>
  <text x="532" y="337" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#334155">氧化式 × 5</text>
  <text x="532" y="356" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#0f766e">得 2MnO₄⁻+16H⁺+10Cl⁻</text>

  <line x1="593" y1="317" x2="608" y2="317" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-step)"/>

  <rect x="610" y="262" width="112" height="110" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="666" y="280" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">⑤ 还原并验算</text>
  <text x="666" y="300" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#1e293b">补回旁观离子(K⁺)</text>
  <text x="666" y="320" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="700" fill="#0f172a">2KMnO₄+16HCl →</text>
  <text x="666" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="700" fill="#0f172a">2MnCl₂+2KCl+5Cl₂↑+8H₂O</text>
  <text x="666" y="358" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#dc2626">核：原子+电荷双守恒</text>
</svg>
