<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-hf-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-hf-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-hf-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">半衰期指数衰变曲线与核裂变 / 核聚变对比示意图（化中 p.347–360）</text>

  <!-- Left Panel: Half-Life Exponential Curve -->
  <rect x="24" y="48" width="352" height="328" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="200" y="68" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">一、放射性核数随时间衰变曲线（图25-18）</text>

  <!-- Axes -->
  <line x1="76" y1="248" x2="346" y2="248" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-hf-b)"/>
  <line x1="76" y1="248" x2="76" y2="82" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-hf-b)"/>
  <text x="348" y="264" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#334155">时间 t</text>
  <text x="64" y="88" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#334155">N</text>

  <!-- Shaded step rectangles -->
  <rect x="76" y="172" width="60" height="76" fill="#dbeafe" opacity="0.75"/>
  <rect x="136" y="210" width="60" height="38" fill="#ede9fe" opacity="0.8"/>
  <rect x="196" y="229" width="60" height="19" fill="#fef3c7" opacity="0.85"/>
  <rect x="256" y="238.5" width="60" height="9.5" fill="#fee2e2" opacity="0.85"/>

  <!-- Grid dashed lines & Y labels -->
  <text x="70" y="100" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">N₀</text>
  <line x1="76" y1="172" x2="136" y2="172" stroke="#64748b" stroke-dasharray="3,3"/>
  <text x="70" y="175" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1e40af">1/2 N₀</text>
  <line x1="76" y1="210" x2="196" y2="210" stroke="#64748b" stroke-dasharray="3,3"/>
  <text x="70" y="213" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#5b21b6">1/4 N₀</text>
  <line x1="76" y1="229" x2="256" y2="229" stroke="#64748b" stroke-dasharray="3,3"/>
  <text x="70" y="232" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#b45309">1/8 N₀</text>
  <line x1="76" y1="238.5" x2="316" y2="238.5" stroke="#64748b" stroke-dasharray="3,3"/>
  <text x="70" y="246" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">1/16 N₀</text>

  <!-- Vertical dashed lines & X labels -->
  <line x1="136" y1="172" x2="136" y2="248" stroke="#64748b" stroke-dasharray="3,3"/>
  <text x="136" y="264" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">T</text>
  <line x1="196" y1="210" x2="196" y2="248" stroke="#64748b" stroke-dasharray="3,3"/>
  <text x="196" y="264" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">2T</text>
  <line x1="256" y1="229" x2="256" y2="248" stroke="#64748b" stroke-dasharray="3,3"/>
  <text x="256" y="264" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">3T</text>
  <line x1="316" y1="238.5" x2="316" y2="248" stroke="#64748b" stroke-dasharray="3,3"/>
  <text x="316" y="264" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">4T</text>

  <!-- Exponential Curve: y = 248 - 152 * 0.5^((x-76)/60) -->
  <path d="M 76 96 C 98 130, 118 155, 136 172 C 156 190, 176 202, 196 210 C 216 218, 236 225, 256 229 C 276 233, 296 236, 316 238.5 L 336 240.5" fill="none" stroke="#1d4ed8" stroke-width="2.6"/>
  <circle cx="76" cy="96" r="3.5" fill="#1d4ed8"/>
  <circle cx="136" cy="172" r="3.5" fill="#1d4ed8"/>
  <circle cx="196" cy="210" r="3.5" fill="#1d4ed8"/>
  <circle cx="256" cy="229" r="3.5" fill="#1d4ed8"/>
  <circle cx="316" cy="238.5" r="3.5" fill="#1d4ed8"/>

  <!-- Formulas Box -->
  <rect x="38" y="278" width="324" height="86" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="48" y="297" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">核心计算式（半衰期 T = T₁/₂ 不受外界温压影响）：</text>
  <text x="48" y="317" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1e40af">• 剩余比例：N / N₀ = (1/2)ⁿ ，其中 n = t / T₁/₂</text>
  <text x="48" y="336" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1e40af">• 对数推算：T₁/₂ = 0.693 / λ ，t = 3.32 T₁/₂ lg(N₀ / N)</text>
  <text x="48" y="355" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">例：¹⁴C 测年 T = 5730 年；¹⁴C 剩 6.25% (1/16) → 经过 4T = 22 920 年</text>

  <!-- Right Panel: Nuclear Fission vs Fusion -->
  <rect x="388" y="48" width="348" height="328" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="562" y="68" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">二、重核裂变链式反应 vs 轻核聚变比较</text>

  <!-- Fission Sub-panel -->
  <rect x="400" y="78" width="324" height="148" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="412" y="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#92400e">1. 核裂变（重核分裂 · 核电站 &amp; 原子弹）</text>
  <text x="412" y="114" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#78350f">¹₀n + ²³⁵₉₂U → ¹⁴¹₅₆Ba + ⁹²₃₆Kr + 3 ¹₀n + 巨大能量</text>

  <!-- Chain diagram -->
  <circle cx="426" cy="144" r="4" fill="#334155"/>
  <line x1="432" y1="144" x2="452" y2="144" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-hf-o)"/>
  <circle cx="472" cy="144" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <text x="472" y="148" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#78350f">²³⁵U</text>

  <!-- Products & 3 neutrons -->
  <line x1="488" y1="138" x2="516" y2="128" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-hf-o)"/>
  <line x1="488" y1="144" x2="520" y2="144" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-hf-o)"/>
  <line x1="488" y1="150" x2="516" y2="160" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-hf-o)"/>
  <circle cx="534" cy="126" r="8" fill="#93c5fd" stroke="#1d4ed8"/>
  <text x="534" y="129" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" fill="#1e3a8a">Ba</text>
  <circle cx="534" cy="162" r="7" fill="#fca5a5" stroke="#dc2626"/>
  <text x="534" y="165" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" fill="#7f1d1d">Kr</text>
  <text x="560" y="147" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#92400e">3 ¹₀n → 链式反应</text>
  <rect x="646" y="122" width="66" height="44" rx="5" fill="#ffffff" stroke="#d97706"/>
  <text x="679" y="139" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#92400e">临界质量</text>
  <text x="679" y="155" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#78350f">维持链式最小质量</text>

  <text x="412" y="192" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#78350f">• 反应堆：减速剂（水/重水/石墨）降低中子速度</text>
  <text x="412" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#78350f">• 控制棒（镉或硼）吸收多余中子，防失控爆炸</text>

  <!-- Fusion Sub-panel -->
  <rect x="400" y="234" width="324" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="412" y="253" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#991b1b">2. 核聚变（轻核结合 · 太阳 &amp; 氢弹 · 热核反应）</text>
  <text x="412" y="272" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#7f1d1d">²₁H (氘) + ³₁H (氚) —&gt;1亿℃→ ⁴₂He + ¹₀n + 能量</text>

  <circle cx="434" cy="296" r="10" fill="#fde047" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="434" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#713f12">²H</text>
  <text x="454" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#991b1b">+</text>
  <circle cx="474" cy="296" r="11" fill="#fb923c" stroke="#c2410c" stroke-width="1.4"/>
  <text x="474" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#7c2d12">³H</text>
  <line x1="490" y1="296" x2="532" y2="296" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-hf-r)"/>
  <circle cx="552" cy="296" r="13" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
  <text x="552" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#14532d">⁴He</text>
  <text x="574" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#991b1b">+</text>
  <circle cx="592" cy="296" r="6" fill="#475569"/>
  <text x="618" y="300" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#334155">¹₀n + E</text>

  <text x="412" y="326" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f1d1d">• 特点：等质量产能为铀裂变的 20 倍；废料几乎无辐射</text>
  <text x="412" y="343" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#7f1d1d">• 质能方程：E = mc²（质量亏损转化为巨大核能）</text>
  <text x="412" y="359" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#991b1b">• 难点：氢核正电斥力极大，需上亿℃等离子体受控约束</text>
</svg>
