<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="38" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">实验室制氢、收集、验纯及 H₂ 还原 CuO 流程与防爆要点（化上 p.30–35）</text>

  <!-- Step 1: 发生装置 -->
  <rect x="24" y="54" width="176" height="232" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <rect x="24" y="54" width="176" height="32" rx="10" fill="#3b82f6"/>
  <text x="112" y="75" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. 制取（固+液不加热）</text>
  <!-- Flask drawing -->
  <path d="M98,108 L98,132 L74,178 L150,178 L126,132 L126,108 Z" fill="#ffffff" stroke="#1e40af" stroke-width="1.8"/>
  <rect x="94" y="102" width="36" height="8" rx="2" fill="#94a3b8"/>
  <!-- Liquid & Zn granules -->
  <path d="M81,164 L143,164 L150,178 L74,178 Z" fill="#bfdbfe"/>
  <circle cx="96" cy="172" r="3.5" fill="#475569"/>
  <circle cx="110" cy="173" r="3.5" fill="#475569"/>
  <circle cx="126" cy="171" r="3.5" fill="#475569"/>
  <!-- Funnel stem -->
  <line x1="107" y1="90" x2="107" y2="170" stroke="#1e40af" stroke-width="2"/>
  <polygon points="100,90 114,90 109,98 105,98" fill="#dbeafe" stroke="#1e40af" stroke-width="1.2"/>
  <!-- Bubbles -->
  <circle cx="102" cy="154" r="2" fill="#2563eb"/>
  <circle cx="118" cy="148" r="2" fill="#2563eb"/>
  <text x="112" y="198" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Zn + 稀 H₂SO₄ / 稀 HCl</text>
  <text x="34" y="218" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1e293b">• 不用 Mg（太快）或 Fe（较慢）</text>
  <text x="34" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1e293b">• 不用浓 H₂SO₄ / HNO₃（强氧化</text>
  <text x="42" y="251" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1e293b">性酸不生成 H₂）</text>
  <text x="34" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">长颈漏斗下端须液封防漏气</text>

  <!-- Arrow 1->2 -->
  <line x1="202" y1="168" x2="216" y2="168" stroke="#475569" stroke-width="2"/>
  <polygon points="214,163 222,168 214,173" fill="#475569"/>

  <!-- Step 2: 收集方法 -->
  <rect x="224" y="54" width="166" height="232" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <rect x="224" y="54" width="166" height="32" rx="10" fill="#10b981"/>
  <text x="307" y="75" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2. 收集（二选一）</text>
  <!-- Water displacement -->
  <rect x="238" y="100" width="66" height="54" fill="#dbeafe" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="256" y="94" width="30" height="44" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <rect x="256" y="122" width="30" height="16" fill="#bae6fd"/>
  <text x="271" y="114" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f766e">H₂</text>
  <text x="271" y="170" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#065f46">排水法</text>
  <text x="271" y="185" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#047857">难溶于水（更纯）</text>

  <!-- Downward air displacement -->
  <rect x="323" y="96" width="36" height="46" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <line x1="323" y1="142" x2="359" y2="142" stroke="#ecfdf5" stroke-width="3"/>
  <line x1="341" y1="152" x2="341" y2="106" stroke="#0f766e" stroke-width="1.6"/>
  <text x="341" y="118" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f766e">H₂</text>
  <text x="341" y="170" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#065f46">向下排空气</text>
  <text x="341" y="185" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#047857">ρ 最小（干燥）</text>

  <rect x="234" y="198" width="146" height="76" rx="7" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="307" y="216" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#065f46">物理常数（p.32, 36）</text>
  <text x="242" y="234" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• ρ = 0.0899 kg·m⁻³</text>
  <text x="242" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#1e293b">• 难溶于水、无色无味</text>
  <text x="242" y="266" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#b45309" font-weight="700">• 爆炸极限：4%～74%</text>

  <!-- Arrow 2->3 -->
  <line x1="392" y1="168" x2="406" y2="168" stroke="#475569" stroke-width="2"/>
  <polygon points="404,163 412,168 404,173" fill="#475569"/>

  <!-- Step 3: 验纯 -->
  <rect x="414" y="54" width="142" height="232" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <rect x="414" y="54" width="142" height="32" rx="10" fill="#f59e0b"/>
  <text x="485" y="75" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. 点燃前必验纯！</text>
  <!-- Tilted test tube + flame -->
  <g transform="rotate(20 475 130)">
    <rect x="462" y="98" width="20" height="58" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
    <line x1="462" y1="154" x2="482" y2="154" stroke="#fef3c7" stroke-width="3"/>
  </g>
  <ellipse cx="468" cy="174" rx="7" ry="11" fill="#fb923c"/>
  <ellipse cx="468" cy="176" rx="3.5" ry="6" fill="#fef08a"/>
  <rect x="456" y="185" width="24" height="14" rx="2" fill="#94a3b8"/>
  <text x="485" y="216" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">管口朝下 + 拇指堵住</text>
  <text x="424" y="235" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.8" fill="#78350f">• 尖锐爆鸣声 → 不纯！</text>
  <text x="424" y="252" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.8" fill="#78350f">• 轻微“噗”声 → 已纯净</text>
  <text x="424" y="271" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">切忌直接用原管再收集</text>

  <!-- Arrow 3->4 -->
  <line x1="558" y1="168" x2="572" y2="168" stroke="#475569" stroke-width="2"/>
  <polygon points="570,163 578,168 570,173" fill="#475569"/>

  <!-- Step 4: H2 还原 CuO -->
  <rect x="580" y="54" width="156" height="232" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <rect x="580" y="54" width="156" height="32" rx="10" fill="#8b5cf6"/>
  <text x="658" y="75" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4. H₂ 还原 CuO</text>
  <!-- Horizontal/slightly tilted tube -->
  <path d="M594,116 L712,126 L712,146 L594,136" fill="#ffffff" stroke="#5b21b6" stroke-width="1.6"/>
  <!-- Delivery tube inside -->
  <line x1="586" y1="126" x2="665" y2="133" stroke="#3b82f6" stroke-width="2"/>
  <!-- CuO -> Cu pile -->
  <polygon points="658,140 688,143 678,131" fill="#b45309"/>
  <text x="673" y="114" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#5b21b6">黑 CuO → 红褐 Cu</text>
  <!-- Flame underneath -->
  <ellipse cx="673" cy="156" rx="6" ry="9" fill="#fb923c"/>
  <rect x="663" y="165" width="20" height="12" rx="2" fill="#94a3b8"/>
  <!-- Water droplets near mouth -->
  <circle cx="606" cy="133" r="2.5" fill="#0284c7"/>
  <circle cx="614" cy="134" r="2.5" fill="#0284c7"/>
  <text x="658" y="196" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#4c1d95">CuO + H₂ —Δ→ Cu + H₂O</text>
  <text x="588" y="216" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.8" fill="#1e293b">• 管口略向下倾（防冷凝水</text>
  <text x="596" y="231" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.8" fill="#1e293b">倒流炸裂试管）</text>
  <text x="588" y="249" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.8" fill="#1e293b">• 导管伸到试管底部</text>
  <text x="588" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.8" font-weight="700" fill="#6d28d9">• 不加塞（留尾气出口）</text>

  <!-- Bottom Safety Protocol Bar -->
  <rect x="24" y="298" width="712" height="78" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="380" y="320" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">H₂ 还原金属氧化物操作铁律：“氢气早出晚归，酒精灯迟到早退”</text>
  <text x="40" y="343" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#7f1d1d"><tspan font-weight="700">1. 先通 H₂ 后点灯：</tspan>排尽试管内空气，防止加热时 H₂ 与 O₂ 混合发生爆炸（化上 p.32, 34）。</text>
  <text x="40" y="363" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#7f1d1d"><tspan font-weight="700">2. 先熄灯后停 H₂：</tspan>待生成的红褐色 Cu 冷却至室温再停气，防止炽热 Cu 重新被空气氧化变黑（p.40 第8(3)题）。</text>
</svg>
