<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-corr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-prot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">钢铁电化学腐蚀（吸氧 vs 析氢）与阴极保护法示意图（化中 p.321–325）</text>

  <!-- Left Panel: Electrochemical Corrosion of Steel -->
  <rect x="24" y="48" width="350" height="328" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="199" y="69" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">一、钢铁吸氧腐蚀与析氢腐蚀（图 24-35）</text>

  <!-- Steel substrate & Carbon impurity & Water droplet -->
  <rect x="44" y="154" width="310" height="58" rx="4" fill="#64748b" stroke="#334155" stroke-width="1.4"/>
  <text x="108" y="188" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fe (负极 −)</text>
  <!-- Carbon impurity -->
  <polygon points="222,154 274,154 264,174 232,174" fill="#1e293b"/>
  <text x="248" y="168" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">C (正极 +)</text>
  <!-- Water film dome -->
  <path d="M 76 154 Q 199 82 322 154 Z" fill="#dbeafe" fill-opacity="0.72" stroke="#2563eb" stroke-width="1.5"/>
  <text x="199" y="114" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">表面水膜（溶有 O₂ / H⁺）</text>

  <!-- Electron flow inside Fe -->
  <path d="M 140 166 L 216 166" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-corr)"/>
  <text x="178" y="162" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#fef2f2">e⁻ →</text>
  <text x="130" y="146" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Fe → Fe²⁺ + 2e⁻</text>
  <text x="272" y="142" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f766e">O₂→OH⁻ 或 H⁺→H₂↑</text>

  <!-- Two Corrosion Boxes -->
  <rect x="34" y="222" width="330" height="72" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="44" y="239" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#9a3412">1. 吸氧腐蚀（中性 / 弱酸性水膜，最普遍！）</text>
  <text x="44" y="256" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#0f172a">负极：2Fe − 4e⁻ → 2Fe²⁺    正极：O₂ + 2H₂O + 4e⁻ → 4OH⁻</text>
  <text x="44" y="272" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#0f172a">后续：Fe(OH)₂ → Fe(OH)₃ → 铁锈 Fe₂O₃·nH₂O（疏松多孔）</text>
  <text x="44" y="287" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#7c2d12">活动7：铁粉+炭粉+NaCl液烧瓶耗氧，导管内红墨水液面上升</text>

  <rect x="34" y="302" width="330" height="64" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="44" y="319" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#991b1b">2. 析氢腐蚀（较强酸性水膜）</text>
  <text x="44" y="336" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#0f172a">负极：Fe − 2e⁻ → Fe²⁺    正极：2H⁺ + 2e⁻ → H₂↑</text>
  <text x="44" y="354" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">总反应：Fe(s) + 2H⁺(aq) → Fe²⁺(aq) + H₂(g)↑</text>

  <!-- Right Panel: Electrochemical Protection Methods -->
  <rect x="386" y="48" width="350" height="328" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="561" y="69" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">二、电化学防护与金属镀层对比（p.324–325）</text>

  <!-- Method 1: Sacrificial Anode -->
  <rect x="398" y="80" width="326" height="106" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="408" y="98" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">1. 牺牲阳极的阴极保护法（原电池原理）</text>
  <rect x="424" y="112" width="66" height="34" rx="5" fill="#0d9488"/>
  <text x="457" y="133" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Zn/Mg 块</text>
  <path d="M 492 129 L 552 129" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-prot)"/>
  <text x="522" y="122" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f766e">e⁻ 供入</text>
  <rect x="556" y="112" width="138" height="34" rx="5" fill="#475569"/>
  <text x="625" y="133" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">被保护船壳/铁管(Fe)</text>
  <text x="408" y="164" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#064e3b">• Zn/Mg 作负极(阳极)被消耗；Fe 作正极(阴极)得保护</text>
  <text x="408" y="179" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#064e3b">• 应用：海轮船尾焊锌块、地下铁管连镁块（定期更换）</text>

  <!-- Method 2: Impressed Current Cathodic Protection -->
  <rect x="398" y="194" width="326" height="96" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="408" y="212" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">2. 外加电流的阴极保护法（电解池原理）</text>
  <rect x="424" y="224" width="76" height="30" rx="5" fill="#334155"/>
  <text x="462" y="243" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#ffffff">惰性阳极(+)</text>
  <rect x="524" y="224" width="60" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="554" y="243" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#92400e">直流电源</text>
  <rect x="608" y="224" width="98" height="30" rx="5" fill="#1d4ed8"/>
  <text x="657" y="243" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#ffffff">钢铁阴极(−)</text>
  <path d="M 586 239 L 606 239" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-prot)"/>
  <text x="408" y="271" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1e3a8a">• 电源负极强制向钢铁输入大量电子，抑制 Fe 失电子</text>
  <text x="408" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1e3a8a">• 腐蚀速率对比：电解阳极 &gt; 原电池负极 &gt; 化学 &gt; 被保护</text>

  <!-- White Iron vs Tinplate Comparison -->
  <rect x="398" y="298" width="326" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="408" y="316" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">镀层破损考题：白铁皮(镀Zn) vs 马口铁(镀Sn)</text>
  <text x="408" y="334" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#065f46">• 白铁皮(Zn-Fe)：Zn 更活泼作负极先腐蚀，Fe 受保护不易锈</text>
  <text x="408" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#b91c1c">• 马口铁(Sn-Fe)：Fe 比 Sn 活泼作负极，破损后铁反而加速腐蚀！</text>
</svg>