<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-el" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">电解池原理、离子放电序、工业应用与法拉第定律（化中 p.307–319）</text>

  <!-- Left Panel: Polarity Comparison & Discharge Order -->
  <rect x="24" y="48" width="350" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="199" y="68" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">一、电解池 vs 原电池 &amp; 电化序</text>

  <!-- Mini comparison table -->
  <rect x="34" y="78" width="330" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="34" y1="100" x2="364" y2="100" stroke="#cbd5e1"/>
  <line x1="34" y1="125" x2="364" y2="125" stroke="#cbd5e1"/>
  <line x1="114" y1="78" x2="114" y2="150" stroke="#cbd5e1"/>
  <line x1="239" y1="78" x2="239" y2="150" stroke="#cbd5e1"/>
  <text x="74" y="93" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">装置类型</text>
  <text x="176" y="93" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">发生氧化反应(失e⁻)</text>
  <text x="301" y="93" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">发生还原反应(得e⁻)</text>

  <text x="74" y="117" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">原电池(自发)</text>
  <text x="176" y="117" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#991b1b">负极（电子流出）</text>
  <text x="301" y="117" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1e40af">正极（电子流入）</text>

  <text x="74" y="141" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">电解池(通电)</text>
  <text x="176" y="141" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#991b1b">阳极（接电源正极+）</text>
  <text x="301" y="141" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#1e40af">阴极（接电源负极−）</text>

  <!-- Discharge order -->
  <rect x="34" y="158" width="330" height="116" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="199" y="176" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">惰性电极上的离子放电电化序（p.309）</text>
  <text x="44" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">阴极阳离子(越往右越易得e⁻)：</text>
  <text x="44" y="212" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#0f172a">K⁺ &lt; Ca²⁺ &lt; Na⁺ &lt; Mg²⁺ &lt; Al³⁺ &lt; Zn²⁺ &lt; Fe²⁺ &lt; Pb²⁺ &lt; (H⁺) &lt; Cu²⁺ &lt; Ag⁺ &lt; Au³⁺</text>
  <text x="44" y="232" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">阳极阴离子(越往右越易失e⁻)：</text>
  <text x="44" y="248" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#0f172a">活性阳极(Cu/Ag等) &gt; S²⁻ &gt; I⁻ &gt; Br⁻ &gt; Cl⁻(浓) &gt; OH⁻ &gt; NO₃⁻, SO₄²⁻, F⁻</text>
  <text x="44" y="265" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">注：浓度影响放电！饱和食盐水中 c(Cl⁻) 远大于 c(OH⁻)，故 Cl⁻ 优先放电</text>

  <!-- Right Panel: Chlor-alkali Membrane Cell & Electroplating -->
  <rect x="386" y="48" width="350" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="561" y="68" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">二、氯碱工业离子膜电解槽（图 24-27）</text>

  <!-- Membrane Tank -->
  <rect x="414" y="96" width="294" height="120" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <!-- Cation exchange membrane -->
  <line x1="561" y1="96" x2="561" y2="216" stroke="#d97706" stroke-width="4" stroke-dasharray="6,4"/>
  <text x="561" y="90" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#b45309">阳离子交换膜(只透Na⁺)</text>

  <!-- Anode & Cathode -->
  <rect x="454" y="114" width="20" height="84" rx="3" fill="#334155"/>
  <text x="464" y="160" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#ffffff">阳</text>
  <text x="464" y="109" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">(+)</text>

  <rect x="648" y="114" width="20" height="84" rx="3" fill="#64748b"/>
  <text x="658" y="160" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#ffffff">阴</text>
  <text x="658" y="109" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">(−)</text>

  <!-- Na+ crossing arrow -->
  <path d="M 526 156 L 596 156" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-el)"/>
  <text x="561" y="148" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">Na⁺</text>

  <!-- Labels inside chambers -->
  <text x="434" y="132" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f766e">Cl₂↑</text>
  <text x="434" y="182" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e293b">进饱和</text>
  <text x="434" y="196" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e293b">NaCl</text>

  <text x="688" y="132" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#dc2626">H₂↑</text>
  <text x="688" y="182" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#1e293b">得纯</text>
  <text x="688" y="196" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#1e3a8a">NaOH</text>

  <rect x="396" y="224" width="330" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="406" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#0f172a">氯碱总反应：2NaCl(aq) + 2H₂O(l) —电解→ 2NaOH + Cl₂↑ + H₂↑</text>
  <text x="406" y="256" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">电镀与精炼铜：镀件(纯铜)作阴极，镀层金属(粗铜)作阳极</text>
  <text x="406" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#475569">离子膜阻隔 Cl₂ 与 OH⁻ 反应，防止生成次氯酸盐及产品不纯</text>

  <!-- Bottom Banner: Faraday's Laws of Electrolysis -->
  <rect x="24" y="294" width="712" height="82" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="380" y="315" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#92400e">三、法拉第电解定律（Faraday's Laws, p.318–319）</text>
  <text x="380" y="338" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Q = I × t （C = A × s）     |     n(e⁻) = Q / F （F = 96500 C·mol⁻¹）     |     m = (M × I × t) / (z × F)</text>
  <text x="380" y="361" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#78350f">每通过 1 F (96500 C) 电量，阴极析出 1 mol Ag⁺ (108 g)、1/2 mol Cu²⁺ (31.75 g)、1/3 mol Au³⁺ (65.7 g)；串联电解池各极转移电子数相等！</text>
</svg>