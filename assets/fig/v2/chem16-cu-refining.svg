<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto">
  <defs>
    <marker id="arr-cu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-cu2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="736" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="38" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#0f172a">粗铜电解精炼原理与铜及其化合物转化示意图（化上 p.428–435）</text>

  <!-- Left: Electrolytic Refining -->
  <rect x="24" y="54" width="356" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="202" y="76" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">一、粗铜电解精炼（纯度 99.5% → 99.98%）</text>

  <!-- DC Power Supply -->
  <rect x="162" y="88" width="80" height="28" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="202" y="106" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">直流电源</text>
  <text x="148" y="106" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#dc2626">+</text>
  <text x="256" y="106" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#2563eb">−</text>

  <!-- Wires -->
  <path d="M 162 102 L 104 102 L 104 134" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 242 102 L 300 102 L 300 134" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="128" y="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">e⁻ →</text>
  <text x="260" y="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">→ e⁻</text>

  <!-- Tank -->
  <rect x="52" y="150" width="300" height="128" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="202" y="170" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">CuSO₄ 酸性电解液</text>

  <!-- Anode (Crude Cu) -->
  <rect x="86" y="134" width="36" height="110" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <text x="104" y="192" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#ffffff">粗铜</text>
  <text x="104" y="208" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#fef3c7">阳极</text>

  <!-- Anode Slime -->
  <ellipse cx="104" cy="268" rx="28" ry="6" fill="#475569"/>
  <text x="104" y="258" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">阳极泥(Au, Ag)</text>

  <!-- Cathode (Pure Cu) -->
  <rect x="282" y="134" width="36" height="110" rx="3" fill="#f97316" stroke="#9a3412" stroke-width="1.5"/>
  <text x="300" y="192" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#ffffff">纯铜</text>
  <text x="300" y="208" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#fff7ed">阴极</text>

  <!-- Cu2+ migration arrow -->
  <path d="M 134 212 L 268 212" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-cu)"/>
  <text x="202" y="204" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Cu²⁺ 迁移并析出</text>
  <text x="202" y="232" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#334155">Fe、Zn 失电子留在溶液中</text>

  <!-- Electrode Equations -->
  <rect x="38" y="288" width="328" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="307" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">阳极(氧化)：Cu(s) → Cu²⁺(aq) + 2e⁻（Zn, Fe 亦溶解）</text>
  <text x="48" y="326" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">阴极(还原)：Cu²⁺(aq) + 2e⁻ → Cu(s)（仅 Cu²⁺ 优先得电子）</text>
  <text x="48" y="348" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">注：电解过程中 c(Cu²⁺) 略微减小；Ag、Au 沉入阳极泥</text>

  <!-- Right: Copper & Compounds Transformations -->
  <rect x="394" y="54" width="342" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="565" y="76" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">二、铜及其重要化合物转化与检验</text>

  <!-- Nodes -->
  <rect x="414" y="102" width="110" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="469" y="121" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#9a3412">Cu (紫红)</text>
  <text x="469" y="137" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#c2410c">潮湿空气→铜绿</text>

  <rect x="606" y="102" width="110" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
  <text x="661" y="121" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">CuO (黑)</text>
  <text x="661" y="137" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#475569">1100℃+Cu→红色Cu₂O</text>

  <rect x="414" y="210" width="120" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="474" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a">Cu²⁺(aq) 蓝色</text>
  <text x="474" y="247" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#2563eb">胆矾 CuSO₄·5H₂O(蓝)</text>

  <rect x="606" y="210" width="114" height="48" rx="8" fill="#dbeafe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="663" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">Cu(OH)₂ 蓝↓</text>
  <text x="663" y="247" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#0284c7">CuSO₄+石灰乳=波尔多液</text>

  <rect x="414" y="308" width="136" height="48" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="482" y="328" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">CuS 黑色沉淀</text>
  <text x="482" y="346" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#cbd5e1">Cu²⁺ + H₂S → CuS↓ + 2H⁺</text>

  <rect x="572" y="308" width="150" height="48" rx="8" fill="#1e3a8a" stroke="#172554" stroke-width="1.5"/>
  <text x="647" y="328" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#ffffff">[Cu(NH₃)₄]²⁺ 深蓝</text>
  <text x="647" y="346" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#bfdbfe">过量浓氨水特征配离子</text>

  <!-- Arrows -->
  <path d="M 524 124 L 604 124" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-cu2)"/>
  <text x="564" y="116" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#92400e">+O₂, Δ</text>

  <path d="M 469 146 L 469 208" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-cu)"/>
  <text x="404" y="174" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1d4ed8">浓H₂SO₄(Δ) /</text>
  <text x="404" y="188" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1d4ed8">浓/稀 HNO₃</text>

  <path d="M 628 146 L 520 208" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-cu)"/>
  <text x="556" y="176" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">+H⁺(酸)</text>

  <path d="M 661 210 L 661 148" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-cu2)"/>
  <text x="688" y="182" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#92400e">Δ 分解</text>

  <path d="M 534 234 L 604 234" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-cu)"/>
  <text x="569" y="226" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">+OH⁻/少量NH₃</text>

  <path d="M 474 258 L 474 306" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-cu)"/>
  <text x="442" y="284" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1e293b">+H₂S(g)</text>

  <path d="M 656 258 L 656 306" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-cu)"/>
  <text x="615" y="284" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1e3a8a">+过量 NH₃·H₂O</text>
</svg>