refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6b7280"/></marker></defs><rect width="360" height="430" rx="10" fill="#fff" stroke="#ddd"/><rect x="100" y="10" width="160" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="32.68" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">葡萄糖 C₆H₁₂O₆</text><line x1="180" y1="46" x2="180" y2="66" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="66" width="280" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="180.0" y="88.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">① 糖酵解 glycolysis</text><text x="180.0" y="104.0" text-anchor="middle" fill="#555" font-size="11" font-weight="normal">细胞质基质 · 不需要 O₂ · 净得 2 ATP + 2 NADH</text><line x1="180" y1="116" x2="180" y2="136" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><rect x="110" y="136" width="140" height="32" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="156.68" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">2 丙酮酸（3C）</text><line x1="150" y1="168" x2="92" y2="200" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><line x1="210" y1="168" x2="268" y2="200" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="88" y="194" text-anchor="end" fill="#16a34a" font-size="12" font-weight="bold">有 O₂</text><text x="272" y="194" text-anchor="start" fill="#dc2626" font-size="12" font-weight="bold">缺 O₂</text><rect x="8" y="204" width="164" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="90.0" y="231.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">② 连接反应 + 克氏循环</text><text x="90.0" y="247.0" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">线粒体基质 · 放出 CO₂ · 共 2 ATP</text><line x1="90" y1="264" x2="90" y2="284" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><rect x="8" y="284" width="164" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="90.0" y="311.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">③ 电子传递链</text><text x="90.0" y="327.0" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">内膜 · 约 26–28 ATP · O₂ → H₂O</text><line x1="90" y1="344" x2="90" y2="362" stroke="#222" stroke-width="1.6" marker-end="url(#g)"/><rect x="8" y="362" width="164" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="90.0" y="383.32" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">有氧呼吸共约 30–32 ATP</text><text x="90" y="414" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">（旧教材常写 36–38，以课本为准）</text><rect x="188" y="204" width="164" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="270.0" y="228.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">动物、乳酸菌</text><text x="270.0" y="244.0" text-anchor="middle" fill="#555" font-size="11" font-weight="normal">→ 乳酸 + 2 ATP</text><rect x="188" y="268" width="164" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="270.0" y="292.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">酵母、植物（根淹水）</text><text x="270.0" y="308.0" text-anchor="middle" fill="#555" font-size="11" font-weight="normal">→ 乙醇 + CO₂ + 2 ATP</text><text x="270" y="342" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="normal">无氧呼吸：只有糖酵解</text><text x="270" y="356" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="normal">的 2 ATP；在细胞质基质</text><text x="270" y="370" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="normal">进行，不用氧</text><text x="270" y="392" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">作用：把 NADH 变回 NAD⁺，</text><text x="270" y="406" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">让糖酵解继续进行</text></svg>