refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6b7280"/></marker></defs><rect width="360" height="250" rx="10" fill="#fff" stroke="#ddd"/><text x="70" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">s 轨域</text><text x="250" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">p 轨域（三个方向）</text><circle cx="70" cy="100" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="70" cy="100" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="70" y="160" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">球形，没有方向性</text><text x="70" y="176" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">1s、2s、3s … 越来越大</text><text x="70" y="192" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">每个能层只有 1 个 s 轨域</text><line x1="178" y1="98" x2="322" y2="98" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/><line x1="250" y1="36" x2="250" y2="160" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/><line x1="200" y1="148" x2="300" y2="48" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/><ellipse cx="224" cy="98" rx="26" ry="11" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/><ellipse cx="276" cy="98" rx="26" ry="11" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/><ellipse cx="250" cy="72" rx="11" ry="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/><ellipse cx="250" cy="124" rx="11" ry="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/><ellipse cx="232" cy="116" rx="22" ry="9" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8" transform="rotate(-45 232 116)"/><ellipse cx="268" cy="80" rx="22" ry="9" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8" transform="rotate(-45 268 80)"/><text x="326" y="102" text-anchor="start" fill="#dc2626" font-size="11" font-weight="bold">x</text><text x="254" y="36" text-anchor="start" fill="#16a34a" font-size="11" font-weight="bold">y</text><text x="302" y="46" text-anchor="start" fill="#2563eb" font-size="11" font-weight="bold">z</text><text x="250" y="180" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">哑铃形：pₓ、p_y、p_z</text><text x="250" y="196" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">3 个轨域，能量相同（简并）</text><text x="250" y="212" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">2p、3p … 每个能层（n ≥ 2）有 3 个</text><text x="180" y="240" text-anchor="middle" fill="#555" font-size="11" font-weight="normal">轨域：电子出现概率最大的空间区域（电子云的“边界”）</text></svg>