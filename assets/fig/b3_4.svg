refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6b7280"/></marker></defs><rect width="360" height="336" rx="10" fill="#fff" stroke="#ddd"/><text x="180" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">ATP 的结构</text><rect x="18" y="44" width="76" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="56.0" y="66.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">腺嘌呤</text><text x="56.0" y="82.0" text-anchor="middle" fill="#555" font-size="10" font-weight="normal">adenine</text><polygon points="124.0,52.0 150.0,68.0 142.0,92.0 106.0,92.0 98.0,68.0" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/><text x="124" y="76" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">核糖</text><line x1="94" y1="69" x2="99" y2="69" stroke="#222" stroke-width="1.6"/><circle cx="184" cy="69" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="184" y="74" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">P</text><circle cx="236" cy="69" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="236" y="74" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">P</text><circle cx="288" cy="69" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="288" y="74" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">P</text><line x1="150" y1="69" x2="165" y2="69" stroke="#222" stroke-width="1.6"/><path d="M203,69 q7,-9 14,0 t14,0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M255,69 q7,-9 14,0 t14,0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="104" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">~</text><text x="262" y="104" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">~</text><text x="236" y="120" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="normal">~ = 高能磷酸键（水解时释放能量）</text><line x1="18" y1="100" x2="150" y2="100" stroke="#555" stroke-width="1.2"/><text x="84" y="115" text-anchor="middle" fill="#555" font-size="11" font-weight="normal">腺苷 adenosine</text><text x="18" y="138" text-anchor="start" fill="#555" font-size="11" font-weight="normal">AMP = 腺苷 + 1 个磷酸；ADP = 腺苷 + 2 个磷酸</text><text x="18" y="152" text-anchor="start" fill="#555" font-size="11" font-weight="normal">ATP = 腺苷 + 3 个磷酸</text><text x="180" y="176" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">ATP–ADP 循环</text><rect x="30" y="194" width="100" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="80.0" y="222.76" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">ATP</text><rect x="230" y="194" width="100" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="280.0" y="222.4" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">ADP + Pi</text><path d="M130,208 C170,186 190,186 228,208" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#r)" stroke-linejoin="round" stroke-linecap="round"/><path d="M228,228 C190,252 170,252 132,228" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#g)" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="274" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="normal">水解（+H₂O，ATP 酶）：释放能量 → 供生命活动</text><text x="180" y="294" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="normal">磷酸化：吸收能量（呼吸、光合）→ 重新合成 ATP</text><text x="180" y="318" text-anchor="middle" fill="#555" font-size="11" font-weight="normal">细胞里 ATP 很少，但分解与合成极快，不断循环</text></svg>