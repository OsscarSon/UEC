<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" font-family="-apple-system,PingFang SC,Noto Sans SC,sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><rect width="360" height="266" rx="10" fill="#fff" stroke="#ddd"/><rect x="30" y="14" width="300" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="180" y="34" text-anchor="middle" fill="#222" font-size="13">①　各元素质量</text><text x="180" y="51" text-anchor="middle" fill="#555" font-size="11">（给的是 % 时，当作 100 g 中的质量）</text><line x1="180" y1="60" x2="180" y2="78" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="78" width="300" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="180" y="98" text-anchor="middle" fill="#222" font-size="13">②　÷ 各元素的相对原子质量</text><text x="180" y="115" text-anchor="middle" fill="#555" font-size="11">得到相对原子数</text><line x1="180" y1="124" x2="180" y2="142" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="142" width="300" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="180" y="162" text-anchor="middle" fill="#222" font-size="13">③　÷ 其中最小的数</text><text x="180" y="179" text-anchor="middle" fill="#555" font-size="11">出现 1.5 / 1.33 / 1.25 → 乘 2 / 3 / 4</text><line x1="180" y1="188" x2="180" y2="206" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="206" width="300" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="180" y="226" text-anchor="middle" fill="#222" font-size="13">④　最简整数比 → 实验式</text><text x="180" y="243" text-anchor="middle" fill="#555" font-size="11">给了 Mr：n = Mr ÷ 实验式量 → 分子式</text></svg>