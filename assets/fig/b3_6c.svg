,76 113,62" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)" stroke-linejoin="round" stroke-linecap="round"/><text x="18" y="100" text-anchor="start" fill="#222" font-size="10" font-weight="normal">③ 再生 RuBP</text><text x="18" y="114" text-anchor="start" fill="#222" font-size="10" font-weight="normal">消耗 ATP</text><text x="18" y="128" text-anchor="start" fill="#222" font-size="10" font-weight="normal">（5/6 的 TP）</text><line x1="72" y1="206" x2="72" y2="244" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/><text x="72" y="260" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="bold">1/6 的 TP 离开循环</text><text x="72" y="275" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="normal">→ 葡萄糖、淀粉、脂质、氨基酸</text><text x="250" y="235" text-anchor="start" fill="#555" font-size="11" font-weight="bold">每固定 3 个 CO₂：</text><text x="250" y="251" text-anchor="start" fill="#dc2626" font-size="11" font-weight="normal">9 ATP + 6 NADPH</text><text x="250" y="267" text-anchor="start" fill="#555" font-size="11" font-weight="normal">→ 净得 1 个 TP</text><text x="180" y="310" text-anchor="middle" fill="#555" font-size="11" font-weight="normal">合成 1 个葡萄糖要固定 6 个 CO₂ → 18 ATP + 12 NADPH</text></svg>