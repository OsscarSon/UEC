<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">5.1 模型：观察、推断与局限</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">实验观察</text><text x="53" y="172" class="small">多数α粒子近似直穿</text><text x="53" y="209" class="small">少数大偏转，极少回散</text><text x="53" y="246" class="small">类别数量不代表各1/3概率</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">支持的结构解释</text><text x="593" y="172" class="small">正电与大部分质量集中于小核</text><text x="593" y="209" class="small">核远小于原子尺度</text><text x="593" y="246" class="small">不直接测得电子圆轨道</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">历史模型</text><text x="53" y="442" class="small">汤姆生：正电连续分布假设</text><text x="53" y="479" class="small">卢瑟福：带核结构</text><text x="53" y="516" class="small">玻尔：氢的离散能级模型</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">模型验收</text><text x="593" y="442" class="small">解释旧证据，也需预测新现象</text><text x="593" y="479" class="small">同一氢原子只有1个电子</text><text x="593" y="516" class="small">能级选择不是同时有多个电子</text><text x="35" y="690" class="small">历史原理示意；不按比例，不提供放射性操作。</text><text x="35" y="727" class="small">结构推断不等于对电子轨迹的直接拍照。</text></svg>
