<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="50" class="title">5.3 氢能级：数值轴与跃迁</text><path d="M100,650 L100,70" fill="none" stroke="#245b91" stroke-width="3" marker-end="url(#a)"/><text x="20" y="90" class="">E/eV</text><path d="M150,576.0 L600,576.0" fill="none" stroke="#245b91" stroke-width="3"/><text x="620" y="583.0" class="">n=1   E=-13.600 eV</text><path d="M150,219.0 L600,219.0" fill="none" stroke="#245b91" stroke-width="3"/><text x="620" y="226.0" class="">n=2   E=-3.400 eV</text><path d="M150,152.88888888888889 L600,152.88888888888889" fill="none" stroke="#245b91" stroke-width="3"/><text x="620" y="159.88888888888889" class="">n=3   E=-1.511 eV</text><path d="M150,129.75 L600,129.75" fill="none" stroke="#245b91" stroke-width="3"/><text x="620" y="136.75" class="">n=4   E=-0.850 eV</text><path d="M150,100 L600,100" fill="none" stroke="#245b91" stroke-width="3"/><text x="620" y="107" class="">电离界 E=0</text><path d="M270,152.88888888888889 L270,219.0" fill="none" stroke="#245b91" stroke-width="3" marker-end="url(#a)"/><text x="320" y="290" class="">3→2：光子约1.89 eV</text><text x="320" y="335" class="">λ≈656–657 nm（舍入）</text><text x="35" y="690" class="small">能级位置按E计算；高n挤在0附近并非等间隔。</text><text x="35" y="727" class="small">发射光子能量为正，原子能量变化为负；只用氢近似。</text></svg>
