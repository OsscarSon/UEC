<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">5.2 两套计数与一个统计平均</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">核子账本：²³₁₁Na⁺</text><text x="53" y="172" class="small">p = Z = 11</text><text x="53" y="209" class="small">n = A − Z = 12</text><text x="53" y="246" class="small">p + n = 23</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">电荷账本</text><text x="593" y="172" class="small">e = Z − q = 11 − 1 = 10</text><text x="593" y="209" class="small">p − e = +1</text><text x="593" y="246" class="small">电离不改变Z与A</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">丰度加权（题给近似）</text><text x="53" y="442" class="small">35×0.75 + 37×0.25 = 35.5</text><text x="53" y="479" class="small">x₁+x₂ = 1</text><text x="53" y="516" class="small">平均不是某个原子的质量数</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">质谱读图先查</text><text x="593" y="442" class="small">横轴通常m/z，须确定电荷态</text><text x="593" y="479" class="small">单电荷时可作质量近似读数</text><text x="593" y="516" class="small">丰度须归一化</text><text x="35" y="690" class="small">原子数、核子数与电荷不能混合相加。</text><text x="35" y="727" class="small">这里只用明确题给近似；不是仪器实测谱图。</text></svg>
