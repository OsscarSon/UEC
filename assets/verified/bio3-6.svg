<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">3.6 光合：统一3CO₂碳基准</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">光反应：类囊体膜</text><text x="53" y="172" class="small">2H₂O → 4H⁺ + 4e⁻ + O₂</text><text x="53" y="209" class="small">提供ATP与NADPH</text><text x="53" y="246" class="small">O₂的氧来自水</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">碳固定：叶绿体基质</text><text x="593" y="172" class="small">3RuBP(15C) + 3CO₂(3C)</text><text x="593" y="209" class="small">→ 6个3-PGA(18C)</text><text x="593" y="246" class="small">后续得到6个G3P(18C)</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">分流与再生</text><text x="53" y="442" class="small">5G3P(15C) → 3RuBP(15C)</text><text x="53" y="479" class="small">1G3P(3C) 净输出</text><text x="53" y="516" class="small">18C = 15C + 3C</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">同一基准能量需求</text><text x="593" y="442" class="small">3CO₂：9ATP、6NADPH</text><text x="593" y="479" class="small">6CO₂：18ATP、12NADPH</text><text x="593" y="516" class="small">两份净G3P碳数相当于六碳糖</text><text x="35" y="690" class="small">碳数、分子数与能量使用同一循环次数，不混单次与三次。</text><text x="35" y="727" class="small">暗反应不是只在夜间；ATP/还原力供应及调控仍重要。</text></svg>
