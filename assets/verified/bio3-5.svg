<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">3.5 呼吸账本与化学渗透</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">糖酵解：细胞质基质</text><text x="53" y="172" class="small">葡萄糖 → 2丙酮酸</text><text x="53" y="209" class="small">投入2ATP、形成4、净2</text><text x="53" y="246" class="small">后续发酵不再重复加2ATP</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">发酵分支</text><text x="593" y="172" class="small">再生NAD⁺使糖酵解持续</text><text x="593" y="209" class="small">乳酸或乙醇/CO₂等路径</text><text x="593" y="246" class="small">不是全部微生物厌氧呼吸</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">线粒体内膜区室</text><text x="53" y="442" class="small">H⁺泵：基质 → 膜间隙</text><text x="53" y="479" class="small">ATP合酶回流：膜间隙 → 基质</text><text x="53" y="516" class="small">电子流与H⁺流分开</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">有氧路径</text><text x="593" y="442" class="small">O₂为末端电子受体，形成水</text><text x="593" y="479" class="small">总ATP依穿梭与耦联等条件</text><text x="593" y="516" class="small">不把30–32与旧36–38混加</text><text x="35" y="690" class="small">能量、碳、电子和质子各自做账，不将路径分支全部相加。</text><text x="35" y="727" class="small">定性区室示意；非实测ATP产量或操作方案。</text></svg>
