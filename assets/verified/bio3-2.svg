<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">3.2 酶曲线的条件与证据</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">温度 / pH</text><text x="53" y="172" class="small">最适值绑定具体酶与测定条件</text><text x="53" y="209" class="small">Q10不能跨失活区无限外推</text><text x="53" y="246" class="small">先预平衡，再比较初速</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">底物浓度平台</text><text x="593" y="172" class="small">固定酶量、温度、pH</text><text x="593" y="209" class="small">饱和 ≠ 反应停止或酶坏掉</text><text x="593" y="246" class="small">另排底物耗尽与仪器上限</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">竞争性理想模型</text><text x="53" y="442" class="small">Vmax不变</text><text x="53" y="479" class="small">表观Km增大</text><text x="53" y="516" class="small">增加底物可减弱相对抑制</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">纯非竞争性理想模型</text><text x="593" y="442" class="small">Vmax下降，Km不变</text><text x="593" y="479" class="small">不等同全部变构/混合型</text><text x="593" y="516" class="small">需参数和条件，不能仅看图高低</text><text x="35" y="690" class="small">不是实测曲线，无伪造最适温度、误差棒或显著性。</text><text x="35" y="727" class="small">实验：自变量、初速、控制量、对照、重复、替代解释。</text></svg>
