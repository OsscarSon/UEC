<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">3.3 固定化酶：流动与传质</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">物料路径</text><text x="53" y="172" class="small">底物入口 → 接触固定化酶</text><text x="53" y="209" class="small">催化转化 → 产物流出</text><text x="53" y="246" class="small">支持网保留载体，不保证无泄漏</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">活性位路径</text><text x="593" y="172" class="small">底物先扩散到有效活性位</text><text x="593" y="209" class="small">发生特定催化反应</text><text x="593" y="246" class="small">产物再扩散离开</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">可检验优势</text><text x="53" y="442" class="small">易于回收、可连续使用</text><text x="53" y="479" class="small">比较累计产物和有效活性</text><text x="53" y="516" class="small">不保证每次都比游离酶快</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">控制与限制</text><text x="593" y="442" class="small">温度/pH/流速按协议确认</text><text x="593" y="479" class="small">扩散与停留时间可限制转化</text><text x="593" y="516" class="small">检测酶泄漏与载体影响</text><text x="35" y="690" class="small">装置原理图，无药品配方或虚构实验参数。</text><text x="35" y="727" class="small">箭头指物料或过程，不能把能量当作产品流出。</text></svg>
