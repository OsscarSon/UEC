<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">3.4 ATP：整体水解与具体耦联</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">整体反应</text><text x="53" y="172" class="small">ATP + H₂O → ADP + Pi</text><text x="53" y="209" class="small">整体ΔG依条件，可为负</text><text x="53" y="246" class="small">断键本身需要能量</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">具体耦联</text><text x="593" y="172" class="small">酶促磷酸转移/构象变化等</text><text x="593" y="209" class="small">连接特定吸能过程</text><text x="593" y="246" class="small">仅把两式并列不证明已耦联</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">题给能量账</text><text x="53" y="442" class="small">水解 −30，吸能过程 +20</text><text x="53" y="479" class="small">同进度总ΔG = −10 kJ/mol</text><text x="53" y="516" class="small">有利 ≠ 无能垒或立即完成</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">再生</text><text x="593" y="442" class="small">ADP + Pi → ATP需能量输入</text><text x="593" y="479" class="small">能源可由呼吸或光反应耦联</text><text x="593" y="516" class="small">能量不随物质无限循环</text><text x="35" y="690" class="small">各反应式为生化简写，电荷/质子按具体pH约定处理。</text><text x="35" y="727" class="small">能量箭头属于整体自由能变化，不从某根断键凭空射出。</text></svg>
