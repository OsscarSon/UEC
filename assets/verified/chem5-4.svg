<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">5.4 排布与离子：规则和边界</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">轨域与容量</text><text x="53" y="172" class="small">s：1轨域→2电子</text><text x="53" y="209" class="small">p：3轨域→6电子</text><text x="53" y="246" class="small">d：5轨域→10电子</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">2p占据（各格为等能轨域）</text><text x="593" y="172" class="small">C： [↑] [↑] [ ]</text><text x="593" y="209" class="small">N： [↑] [↑] [↑]</text><text x="593" y="246" class="small">O： [↑↓] [↑] [↑]</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">Fe核查</text><text x="53" y="442" class="small">Fe： [Ar]3d⁶4s² → 26e</text><text x="53" y="479" class="small">Fe²⁺： [Ar]3d⁶ → 24e</text><text x="53" y="516" class="small">Fe³⁺： [Ar]3d⁵ → 23e</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">不可误读</text><text x="593" y="442" class="small">电子自旋箭头不是空间轨迹</text><text x="593" y="479" class="small">构造助记不等于普适能级顺序</text><text x="593" y="516" class="small">4s/3d相对能量随状态改变</text><text x="35" y="690" class="small">基态规则：鲍利 + 汉德 + 构造近似，另核例外。</text><text x="35" y="727" class="small">半满构型不能单独证明某氧化态在所有环境更稳定。</text></svg>
