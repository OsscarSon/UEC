<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#142b40;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.box{fill:#edf5ff;stroke:#245b91;stroke-width:2}.line{fill:none;stroke:#245b91;stroke-width:3}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#245b91"/></marker></defs><rect width="1100" height="760" fill="white"/><text x="35" y="52" class="title">3.7 净量与限制因素</text><rect class="box" x="35" y="90" width="510" height="245" rx="12"/><text x="53" y="128" class="">净CO₂吸收为正</text><text x="53" y="172" class="small">N = P − R（同单位）</text><text x="53" y="209" class="small">黑暗截距约 −R</text><text x="53" y="246" class="small">补偿点N=0但P=R可非0</text><rect class="box" x="575" y="90" width="510" height="245" rx="12"/><text x="593" y="128" class="">反推总光合</text><text x="593" y="172" class="small">例：净吸收6、呼吸2</text><text x="593" y="209" class="small">P=N+R=8</text><text x="593" y="246" class="small">呼吸条件及其他过程须说明</text><rect class="box" x="35" y="360" width="510" height="245" rx="12"/><text x="53" y="398" class="">平台解释</text><text x="53" y="442" class="small">先查温度、CO₂和光是否受控</text><text x="53" y="479" class="small">平台不唯一证明酶坏掉</text><text x="53" y="516" class="small">改变另一变量可检验解释</text><rect class="box" x="575" y="360" width="510" height="245" rx="12"/><text x="593" y="398" class="">储藏判断的限制</text><text x="593" y="442" class="small">总CO₂最低不必是最少底物</text><text x="593" y="479" class="small">还需RQ、组织损伤与品质证据</text><text x="593" y="516" class="small">不据模型给实际推荐氧浓度</text><text x="35" y="690" class="small">定性关系与明确题给数据分开；不是实测最优曲线。</text><text x="35" y="727" class="small">单一净交换指标不能自动分解出所有总过程。</text></svg>
